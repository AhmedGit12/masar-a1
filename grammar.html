<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>قواعد ومحتوى A1</title>
<meta name="description" content="خريطة ذهنية تفاعلية لمنهج الإنجليزي A1 في 30 يوم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#EEF2EC; --grid:#DCE3D8; --surface:#FFFFFF; --surface2:#F6F8F4; --ink:#17212B; --muted:#5B6672; --line:#CBD4C7; --shadow:0 1px 2px rgba(23,33,43,.06),0 8px 24px -14px rgba(23,33,43,.28);
  --teal:#0E7C74; --indigo:#3B4CC0; --amber:#A8650A; --green:#2D7F3E; --rose:#B3395F; --blue:#1C6AA3; --violet:#7043B3; --clay:#9C4E28; --inkc:#17212B;
  --hi:#FFE27A; --hi-ink:#2A2100; --ok:#1E8A4C; --bad:#B7322D;
  --f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif; --f-disp:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1519; --grid:#1A232A; --surface:#172027; --surface2:#1D2831; --ink:#E6ECEF; --muted:#98A5B0; --line:#2C3943; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  --teal:#3CC2B6; --indigo:#8C9BFF; --amber:#F0AC45; --green:#62C877; --rose:#F07CA0; --blue:#5FB0EC; --violet:#B792F5; --clay:#E58F63; --inkc:#E6ECEF;
  --hi:#5A4A00; --hi-ink:#FFE9A0; --ok:#52C98A; --bad:#F07A74; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0F1519; --grid:#1A232A; --surface:#172027; --surface2:#1D2831; --ink:#E6ECEF; --muted:#98A5B0; --line:#2C3943; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  --teal:#3CC2B6; --indigo:#8C9BFF; --amber:#F0AC45; --green:#62C877; --rose:#F07CA0; --blue:#5FB0EC; --violet:#B792F5; --clay:#E58F63; --inkc:#E6ECEF;
  --hi:#5A4A00; --hi-ink:#FFE9A0; --ok:#52C98A; --bad:#F07A74; color-scheme:dark;}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-inline-end:auto;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:20px;margin:0;white-space:nowrap}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--indigo);outline-offset:1px}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:55vh;overflow:auto;z-index:20;padding:4px}
.results button{display:block;width:100%;text-align:start;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface2);outline:none}
.results .rp{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px}
.tb{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb:focus-visible,.node:focus-visible,.say:focus-visible,.kid:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;display:flex}
.map{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:22px 22px}
.map.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg.links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
svg.links path{fill:none;stroke-width:2;opacity:.55}
.node{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;width:max-content;max-width:270px;padding:7px 11px 7px 9px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:start;white-space:normal;line-height:1.35}
.node .tx{min-width:0}
.node .tt{font-weight:600;font-size:14px;display:block}
.node .st{font-size:11.5px;color:var(--muted);display:block;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.node .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.node .cnt{flex:none;font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--c);color:var(--c);font-variant-numeric:tabular-nums}
.node .ck{flex:none;color:var(--ok);font-weight:700}
.node.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),var(--shadow)}
.node.d1{padding:10px 14px;border-width:2px;border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.node.d1 .tt{font-family:var(--f-disp);font-size:17px}
.node.root{padding:14px 18px;background:var(--inkc);color:var(--surface);border-color:var(--inkc);max-width:260px}
.node.root .tt{font-family:var(--f-disp);font-size:21px}
.node.root .st{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.node.done .tt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 70%,transparent)}
/* panel */
.panel{width:min(440px,42vw);flex:none;background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ph h2{font-family:var(--f-disp);font-weight:600;font-size:22px;margin:0;text-wrap:balance;display:flex;gap:8px;align-items:center}
.ph h2 i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.ph .sub{color:var(--muted);font-size:13px;margin-top:4px}
.ph .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.pill.on{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok)}
.closep{display:none;margin-inline-start:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.pb{padding:12px 18px 24px;overflow:auto;line-height:1.75}
.pb p{margin:0 0 10px}
.pb h4{margin:16px 0 6px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.pb ul,.pb ol{margin:0 0 10px;padding-inline-start:20px}
.pb li{margin:3px 0}
.pb a{color:var(--c);text-underline-offset:3px}
.en{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
.ar{color:var(--muted);font-size:13.5px}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;margin-inline-end:4px;margin-bottom:8px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.t-memo{--tc:var(--violet)}.t-und{--tc:var(--blue)}.t-rep{--tc:var(--clay)}.t-focus{--tc:var(--teal)}.t-bg{--tc:var(--muted)}.t-read{--tc:var(--green)}.t-write{--tc:var(--rose)}.t-test{--tc:var(--ink)}
.rule{background:var(--hi);color:var(--hi-ink);border-radius:8px;padding:4px 10px;font-weight:600;display:inline-block;margin:4px 0 10px;direction:ltr}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 10px;margin-bottom:10px}
.w{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);min-width:0}
.w .en{font-weight:600}
.w .ar{margin-inline-start:auto;text-align:end}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ln{display:flex;gap:8px;align-items:flex-start}
.ln .en{display:block;font-weight:500}
.say{flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--c);border-radius:999px;min-width:26px;height:26px;padding:0 6px;font-size:11px;cursor:pointer;line-height:1}
.say:hover{border-color:var(--c)}
.mis{border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:10px;padding:8px 12px;margin:6px 0 10px}
.mis .lbl{font-size:12px;color:var(--bad);font-weight:600}
.mis s{color:var(--bad)}
.passage{background:var(--surface2);border-radius:10px;padding:10px 14px;line-height:1.7;margin-bottom:8px;text-align:left}
details{display:inline-block;margin-inline-start:6px}
details summary{cursor:pointer;color:var(--c);font-size:13px}
.taglist{display:flex;flex-direction:column;gap:6px}
.tg{display:flex;gap:6px;align-items:baseline}
.tg .chip{flex:none;margin:0}
.kids{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.kids h4{margin-top:0}
.kid{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.kid:hover{border-color:var(--c)}
.kid small{color:var(--muted)}
.hint{position:absolute;bottom:14px;inset-inline-end:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none}
@media (max-width:760px){
  header{padding:8px 16px;gap:8px}
  .brand small{display:none}
  .search{order:3;flex-basis:100%;max-width:none}
  .stage{flex-direction:column}
  .panel{position:absolute;inset-inline:0;bottom:0;width:auto;height:58%;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.35);z-index:8;transform:translateY(0);transition:transform .28s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.shut{transform:translateY(calc(100% - 52px))}
  .panel.shut .pb{visibility:hidden}
  .closep{display:block}
  .hint{display:none}
  .tb.hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
[hidden]{display:none!important}
.tw{overflow-x:auto;margin:6px 0 12px}
.gt{direction:ltr;border-collapse:collapse;width:100%;font-size:14px}
.gt th,.gt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.gt th{background:var(--surface2);font-weight:600}
.gt .ar{direction:rtl;text-align:right;color:var(--ink)}
.f-aff{--tc:var(--green)}.f-neg{--tc:var(--rose)}.f-q{--tc:var(--blue)}.f-sa{--tc:var(--violet)}.f-wh{--tc:var(--teal)}.f-use{--tc:var(--amber)}.f-err{--tc:var(--bad)}
.mis{margin:6px 0}
</style>

 our teacher. He is very nice. Every morning I say, &quot;Good morning, Mr Adam!&quot; and he says, &quot;Good morning, Sara. How are you?&quot; I say, &quot;I'm fine, thank you.&quot;<\/div><button class=\"say\" data-say=\"Hello! My name is Sara. I am a student. Omar is my friend. He is a student too. Mr Adam is our teacher. He is very nice. Every morning I say, &quot;Good morning, Mr Adam!&quot; and he says, &quot;Good morning, Sara. How are you?&quot; I say, &quot;I'm fine, thank you.&quot;\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">مرحباً! اسمي سارة. أنا طالبة. عمر صديقي. هو طالب أيضاً. السيد آدم معلّمنا. هو لطيف جداً. كل صباح أقول: «صباح الخير يا سيد آدم!» فيقول: «صباح الخير يا سارة. كيف حالك؟» فأقول: «أنا بخير، شكراً.»<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is Sara?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a student<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Who is Omar?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">her friend<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does Sara say every morning?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Good morning<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd2","t":"Karim's number","s":"اليوم 2","d":"<div class=\"passage\" dir=\"ltr\">This is Karim. He is a student. He is twenty years old. Mona is his sister. She is twelve. Karim's phone number is 0 1 5 7 3 8 9 4. His name is easy to spell: K-A-R-I-M.<\/div><button class=\"say\" data-say=\"This is Karim. He is a student. He is twenty years old. Mona is his sister. She is twelve. Karim's phone number is 0 1 5 7 3 8 9 4. His name is easy to spell: K-A-R-I-M.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">هذا كريم. هو طالب. عمره عشرون سنة. منى أخته. عمرها اثنتا عشرة سنة. رقم هاتف كريم هو 0 1 5 7 3 8 9 4. اسمه سهل في التهجئة: K-A-R-I-M.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">How old is Karim?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">twenty<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How old is Mona?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">twelve<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How do you spell Karim's name?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">K-A-R-I-M<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd3","t":"Yusuf and John","s":"اليوم 3","d":"<div class=\"passage\" dir=\"ltr\">I am Yusuf. I am from Egypt, but I live in Saudi Arabia. My city is Riyadh. I speak Arabic and a little English. My friend John is not Egyptian. He is British. He is from London, the capital of Britain. His language is English. Are you from Egypt too?<\/div><button class=\"say\" data-say=\"I am Yusuf. I am from Egypt, but I live in Saudi Arabia. My city is Riyadh. I speak Arabic and a little English. My friend John is not Egyptian. He is British. He is from London, the capital of Britain. His language is English. Are you from Egypt too?\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">أنا يوسف. أنا من مصر، لكني أعيش في السعودية. مدينتي الرياض. أتكلم العربية وقليلاً من الإنجليزية. صديقي جون ليس مصرياً. هو بريطاني، من لندن عاصمة بريطانيا. لغته الإنجليزية. هل أنت من مصر أيضاً؟<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where is Yusuf from?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Egypt<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where does Yusuf live?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in Saudi Arabia<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What nationality is John?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">British<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd4","t":"Huda's family","s":"اليوم 4","d":"<div class=\"passage\" dir=\"ltr\">My name is Huda. I am married. My husband's name is Tarek. We have two children, a son and a daughter. Our son is eight and our daughter is five. My parents live near us. My father is a teacher and my mother is a doctor. My brother, Sami, is single. His car is red.<\/div><button class=\"say\" data-say=\"My name is Huda. I am married. My husband's name is Tarek. We have two children, a son and a daughter. Our son is eight and our daughter is five. My parents live near us. My father is a teacher and my mother is a doctor. My brother, Sami, is single. His car is red.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">اسمي هدى. أنا متزوجة. اسم زوجي طارق. لدينا طفلان، ولد وبنت. ابننا عمره ثماني سنوات وابنتنا خمس سنوات. والداي يعيشان قريباً منا. أبي معلّم وأمي طبيبة. أخي سامي أعزب. سيارته حمراء.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Is Huda married?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Yes, she is.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How many children do Huda and Tarek have?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">two<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Who is single?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Sami<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd5","t":"What's in my bag?","s":"اليوم 5","d":"<div class=\"passage\" dir=\"ltr\">This is my bag. It is big and black. In my bag there is a book, two pens and a pencil. These are my keys, and this is my phone. That is my wallet on the table. Those are not my glasses. They are my brother's glasses. My laptop is not in my bag. It is at home.<\/div><button class=\"say\" data-say=\"This is my bag. It is big and black. In my bag there is a book, two pens and a pencil. These are my keys, and this is my phone. That is my wallet on the table. Those are not my glasses. They are my brother's glasses. My laptop is not in my bag. It is at home.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">هذه حقيبتي. إنها كبيرة وسوداء. في حقيبتي كتاب وقلمان وقلم رصاص. هذه مفاتيحي، وهذا هاتفي. تلك محفظتي على الطاولة. تلك ليست نظارتي، إنها نظارة أخي. اللابتوب ليس في حقيبتي، إنه في البيت.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What color is the bag?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">black<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How many pens are in the bag?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">two<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where is the laptop?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at home<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd6","t":"My favorite things","s":"اليوم 6","d":"<div class=\"passage\" dir=\"ltr\">My favorite color is green. My new car is dark green and very beautiful. My house is small, but it is nice. My cat is gray and white. She is very small and very happy. My brother is tall and strong. His favorite color is blue. Today is very hot, so I am tired.<\/div><button class=\"say\" data-say=\"My favorite color is green. My new car is dark green and very beautiful. My house is small, but it is nice. My cat is gray and white. She is very small and very happy. My brother is tall and strong. His favorite color is blue. Today is very hot, so I am tired.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">لوني المفضل هو الأخضر. سيارتي الجديدة خضراء غامقة وجميلة جداً. بيتي صغير لكنه لطيف. قطتي رمادية وبيضاء. هي صغيرة جداً وسعيدة جداً. أخي طويل وقوي. لونه المفضل الأزرق. اليوم حار جداً، لذلك أنا متعب.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is the writer's favorite color?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">green<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What color is the cat?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">gray and white<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why is the writer tired?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It is very hot.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rdt1","t":"نص الاختبار: Omar","s":"اختبار الأسبوع 1","d":"<div class=\"passage\" dir=\"ltr\">My name is Omar. I am from Saudi Arabia, but I live in Egypt. I am a student. I am twenty years old. My family is big. I have two brothers and one sister. My sister's name is Nora. She is ten years old. My father is a teacher. My favorite color is blue, but my car is white. It is small and old.<\/div><button class=\"say\" data-say=\"My name is Omar. I am from Saudi Arabia, but I live in Egypt. I am a student. I am twenty years old. My family is big. I have two brothers and one sister. My sister's name is Nora. She is ten years old. My father is a teacher. My favorite color is blue, but my car is white. It is small and old.\" aria-label=\"استمع\">▶ استمع للنص<\/button><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where is Omar from?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Saudi Arabia<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How many brothers does he have?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">two<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How old is Nora?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">ten<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What color is his car?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">white<\/span><\/details><\/li><\/ul>","color":"green"}],"color":"green"},{"id":"rdw2","t":"الأسبوع 2","s":"My day · Nadia's week · Two different brothers · Mariam's free time · At the restaurant · Buying a jacket","d":"<p>نصوص الأسبوع 2.<\/p>","c":[{"id":"rd8","t":"My day","s":"اليوم 8","d":"<div class=\"passage\" dir=\"ltr\">I get up at six o'clock every day. I wash my face and pray. Then I have breakfast with my family. We eat bread, eggs and cheese. I go to work at seven thirty. I work in an office. I come back home at four. In the evening, I study English for one hour. I go to bed at eleven.<\/div><button class=\"say\" data-say=\"I get up at six o'clock every day. I wash my face and pray. Then I have breakfast with my family. We eat bread, eggs and cheese. I go to work at seven thirty. I work in an office. I come back home at four. In the evening, I study English for one hour. I go to bed at eleven.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">أستيقظ الساعة السادسة كل يوم. أغسل وجهي وأصلّي. ثم أتناول الفطور مع عائلتي. نأكل خبزاً وبيضاً وجبناً. أذهب إلى العمل الساعة السابعة والنصف. أعمل في مكتب. أرجع إلى البيت الساعة الرابعة. في المساء أدرس الإنجليزية لمدة ساعة. أنام الساعة الحادية عشرة.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When does the writer get up?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at six<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where does the writer work?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in an office<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does the writer do in the evening?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">studies English<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd9","t":"Nadia's week","s":"اليوم 9","d":"<div class=\"passage\" dir=\"ltr\">Nadia is a nurse. She works in a big hospital. She starts work at seven in the morning and finishes at three in the afternoon. Friday and Saturday are her weekend. On Friday she visits her mother. In the evening she watches TV or reads a book. Her birthday is in May.<\/div><button class=\"say\" data-say=\"Nadia is a nurse. She works in a big hospital. She starts work at seven in the morning and finishes at three in the afternoon. Friday and Saturday are her weekend. On Friday she visits her mother. In the evening she watches TV or reads a book. Her birthday is in May.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">نادية ممرضة. تعمل في مستشفى كبير. تبدأ العمل الساعة السابعة صباحاً وتنتهي الساعة الثالثة عصراً. الجمعة والسبت عطلة نهاية الأسبوع لها. يوم الجمعة تزور أمها. في المساء تشاهد التلفاز أو تقرأ كتاباً. عيد ميلادها في شهر مايو.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is Nadia's job?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a nurse<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What time does she finish work?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at three<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does she do on Friday?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">She visits her mother.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd10","t":"Two different brothers","s":"اليوم 10","d":"<div class=\"passage\" dir=\"ltr\">Ali and Hassan are brothers, but they are very different. Ali likes soccer. He watches every match on TV. Hassan doesn't like soccer. He loves music and reading. Ali drinks coffee every morning, but Hassan doesn't drink coffee. He prefers tea. Do they like the same food? Yes, they do! They love chicken and rice.<\/div><button class=\"say\" data-say=\"Ali and Hassan are brothers, but they are very different. Ali likes soccer. He watches every match on TV. Hassan doesn't like soccer. He loves music and reading. Ali drinks coffee every morning, but Hassan doesn't drink coffee. He prefers tea. Do they like the same food? Yes, they do! They love chicken and rice.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">علي وحسن أخوان، لكنهما مختلفان جداً. علي يحب كرة القدم. يشاهد كل مباراة على التلفاز. حسن لا يحب كرة القدم. يحب الموسيقى والقراءة. علي يشرب القهوة كل صباح، لكن حسن لا يشرب القهوة. يفضّل الشاي. هل يحبان نفس الطعام؟ نعم! يحبان الدجاج والأرز.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Who likes soccer?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Ali<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does Hassan drink?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">tea<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What food do both brothers love?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">chicken and rice<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd11","t":"Mariam's free time","s":"اليوم 11","d":"<div class=\"passage\" dir=\"ltr\">Mariam is very busy in the week, but on the weekend she has free time. She always visits her grandmother on Friday. She usually goes to the gym on Saturday morning. She often walks in the park with her friends. She sometimes takes photos with her camera. She never watches TV because she thinks it is boring.<\/div><button class=\"say\" data-say=\"Mariam is very busy in the week, but on the weekend she has free time. She always visits her grandmother on Friday. She usually goes to the gym on Saturday morning. She often walks in the park with her friends. She sometimes takes photos with her camera. She never watches TV because she thinks it is boring.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">مريم مشغولة جداً خلال الأسبوع، لكن في عطلة نهاية الأسبوع عندها وقت فراغ. دائماً تزور جدتها يوم الجمعة. عادةً تذهب إلى النادي الرياضي صباح السبت. غالباً تمشي في الحديقة مع صديقاتها. أحياناً تلتقط صوراً بكاميرتها. لا تشاهد التلفاز أبداً لأنها تراه مملاً.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When does Mariam visit her grandmother?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">on Friday<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How often does she walk in the park?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">often<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does she never do?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">watch TV<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd12","t":"At the restaurant","s":"اليوم 12","d":"<div class=\"passage\" dir=\"ltr\">Waiter: Good evening. Are you ready to order? — Ahmed: Yes. I'd like some chicken soup and a salad, please. — Waiter: Would you like any rice? — Ahmed: No, thank you. I'm not very hungry. — Waiter: And to drink? — Ahmed: Some orange juice, please. — Later: Can I have the bill, please? The food was delicious!<\/div><button class=\"say\" data-say=\"Waiter: Good evening. Are you ready to order? — Ahmed: Yes. I'd like some chicken soup and a salad, please. — Waiter: Would you like any rice? — Ahmed: No, thank you. I'm not very hungry. — Waiter: And to drink? — Ahmed: Some orange juice, please. — Later: Can I have the bill, please? The food was delicious!\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">النادل: مساء الخير. هل أنت مستعد للطلب؟ — أحمد: نعم. أريد شوربة دجاج وسلطة من فضلك. — النادل: هل تريد أرزاً؟ — أحمد: لا، شكراً. لست جائعاً جداً. — النادل: وماذا تشرب؟ — أحمد: عصير برتقال من فضلك. — بعد ذلك: ممكن الحساب من فضلك؟ الطعام كان لذيذاً!<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What soup does Ahmed order?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">chicken soup<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Does Ahmed want rice?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, he doesn't.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does he drink?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">orange juice<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd13","t":"Buying a jacket","s":"اليوم 13","d":"<div class=\"passage\" dir=\"ltr\">Salma is at the market. She wants a new jacket for winter. She tries on a black jacket, but it is too small. She asks for a large size. The large jacket is perfect. &quot;How much is it?&quot; she asks. &quot;It's fifty riyals,&quot; says the shop assistant. It is not cheap, but it is not expensive. Salma pays by card and takes her receipt.<\/div><button class=\"say\" data-say=\"Salma is at the market. She wants a new jacket for winter. She tries on a black jacket, but it is too small. She asks for a large size. The large jacket is perfect. &quot;How much is it?&quot; she asks. &quot;It's fifty riyals,&quot; says the shop assistant. It is not cheap, but it is not expensive. Salma pays by card and takes her receipt.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">سلمى في السوق. تريد جاكيت جديداً للشتاء. تجرّب جاكيت أسود، لكنه صغير جداً عليها. تطلب مقاساً كبيراً. الجاكيت الكبير ممتاز. تسأل: «بكم هذا؟» فيقول البائع: «بخمسين ريالاً.» ليس رخيصاً وليس غالياً. تدفع سلمى بالبطاقة وتأخذ الإيصال.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What does Salma want?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a jacket<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is the problem with the first jacket?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It is too small.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How does Salma pay?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">by card<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rdt2","t":"نص الاختبار: Lina's day","s":"اختبار الأسبوع 2","d":"<div class=\"passage\" dir=\"ltr\">Lina is a student. She gets up at six o'clock every day. She has breakfast with her mother. She usually drinks tea, but she never drinks coffee. She goes to university by bus. Her classes start at eight. On Friday she doesn't study. She goes to the market with her friends. She likes shopping, but she doesn't like expensive shops.<\/div><button class=\"say\" data-say=\"Lina is a student. She gets up at six o'clock every day. She has breakfast with her mother. She usually drinks tea, but she never drinks coffee. She goes to university by bus. Her classes start at eight. On Friday she doesn't study. She goes to the market with her friends. She likes shopping, but she doesn't like expensive shops.\" aria-label=\"استمع\">▶ استمع للنص<\/button><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When does Lina get up?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at six<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does she never drink?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">coffee<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How does she go to university?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">by bus<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does she do on Friday?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">She goes to the market.<\/span><\/details><\/li><\/ul>","color":"green"}],"color":"green"},{"id":"rdw3","t":"الأسبوع 3","s":"My new apartment · The way to the museum · What can you do? · A message from the airport · Weather in two cities · Meet Dr Rania","d":"<p>نصوص الأسبوع 3.<\/p>","c":[{"id":"rd15","t":"My new apartment","s":"اليوم 15","d":"<div class=\"passage\" dir=\"ltr\">My new apartment is small but clean. There are three rooms: a living room, a bedroom and a kitchen. There is one bathroom. In the living room there is a big sofa and a lamp, but there isn't a TV. There are two windows in my bedroom. The rent is not expensive, and my neighbors are quiet and friendly.<\/div><button class=\"say\" data-say=\"My new apartment is small but clean. There are three rooms: a living room, a bedroom and a kitchen. There is one bathroom. In the living room there is a big sofa and a lamp, but there isn't a TV. There are two windows in my bedroom. The rent is not expensive, and my neighbors are quiet and friendly.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">شقتي الجديدة صغيرة لكنها نظيفة. فيها ثلاث غرف: غرفة معيشة وغرفة نوم ومطبخ. فيها حمّام واحد. في غرفة المعيشة كنبة كبيرة ومصباح، لكن لا يوجد تلفاز. في غرفة نومي نافذتان. الإيجار ليس غالياً، وجيراني هادئون وودودون.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">How many rooms are there?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">three<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Is there a TV in the living room?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, there isn't.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What are the neighbors like?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">quiet and friendly<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd16","t":"The way to the museum","s":"اليوم 16","d":"<div class=\"passage\" dir=\"ltr\">Excuse me, where is the museum? — Go straight on this street. Turn left at the traffic lights. The museum is next to the library, opposite the big mosque. It is not far. It's about five minutes from here. — Thank you! — You're welcome.<\/div><button class=\"say\" data-say=\"Excuse me, where is the museum? — Go straight on this street. Turn left at the traffic lights. The museum is next to the library, opposite the big mosque. It is not far. It's about five minutes from here. — Thank you! — You're welcome.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">لو سمحت، أين المتحف؟ — امشِ مستقيماً في هذا الشارع. انعطف يساراً عند إشارة المرور. المتحف بجانب المكتبة، مقابل المسجد الكبير. ليس بعيداً. حوالي خمس دقائق من هنا. — شكراً! — عفواً.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where do you turn left?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at the traffic lights<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is next to the museum?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">the library<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Is the museum far?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, it isn't.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd17","t":"What can you do?","s":"اليوم 17","d":"<div class=\"passage\" dir=\"ltr\">My name is Faisal. I am ten years old. I can swim and I can ride a bike, but I can't drive a car. My sister Laila can draw very well. She can't sing, but she can dance! My grandfather can't read small letters, so I help him. I read the news to him. Can you play the piano? I can't, but I want to learn.<\/div><button class=\"say\" data-say=\"My name is Faisal. I am ten years old. I can swim and I can ride a bike, but I can't drive a car. My sister Laila can draw very well. She can't sing, but she can dance! My grandfather can't read small letters, so I help him. I read the news to him. Can you play the piano? I can't, but I want to learn.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">اسمي فيصل. عمري عشر سنوات. أستطيع السباحة وركوب الدراجة، لكن لا أستطيع قيادة السيارة. أختي ليلى تستطيع الرسم جيداً جداً. لا تستطيع الغناء، لكنها تستطيع الرقص! جدي لا يستطيع قراءة الحروف الصغيرة، لذلك أساعده وأقرأ له الأخبار. هل تستطيع العزف على البيانو؟ أنا لا أستطيع، لكني أريد أن أتعلم.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What can't Faisal do?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">drive a car<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What can Laila do very well?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">draw<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How does Faisal help his grandfather?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">He reads the news to him.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd18","t":"A message from the airport","s":"اليوم 18","d":"<div class=\"passage\" dir=\"ltr\">Hi Khaled! I'm at the airport right now. I'm going to Cairo today. It's raining outside, and a lot of people are sitting and waiting. A small boy is crying, and his mother is holding him. His father is talking on the phone. I'm drinking coffee and reading a book. See you tomorrow! Omar<\/div><button class=\"say\" data-say=\"Hi Khaled! I'm at the airport right now. I'm going to Cairo today. It's raining outside, and a lot of people are sitting and waiting. A small boy is crying, and his mother is holding him. His father is talking on the phone. I'm drinking coffee and reading a book. See you tomorrow! Omar\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">مرحباً خالد! أنا في المطار الآن. أنا مسافر إلى القاهرة اليوم. إنها تمطر بالخارج، وكثير من الناس جالسون ينتظرون. ولد صغير يبكي، وأمه تحمله. أبوه يتكلم في الهاتف. أنا أشرب قهوة وأقرأ كتاباً. أراك غداً! عمر<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where is Omar now?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at the airport<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is the weather like?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It's raining.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is Omar doing?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">He's drinking coffee and reading.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd19","t":"Weather in two cities","s":"اليوم 19","d":"<div class=\"passage\" dir=\"ltr\">In Riyadh, the summer is very hot and dry. It usually doesn't rain in June or July. Today it is 45 degrees! In London, the weather is different. It often rains in summer. Right now my friend Tom is in London. He is wearing a jacket because it is cool and cloudy. He is sending me photos of the rain!<\/div><button class=\"say\" data-say=\"In Riyadh, the summer is very hot and dry. It usually doesn't rain in June or July. Today it is 45 degrees! In London, the weather is different. It often rains in summer. Right now my friend Tom is in London. He is wearing a jacket because it is cool and cloudy. He is sending me photos of the rain!\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">في الرياض، الصيف حار جداً وجاف. عادةً لا تمطر في يونيو أو يوليو. اليوم درجة الحرارة 45! في لندن الطقس مختلف. غالباً تمطر في الصيف. الآن صديقي توم في لندن. يرتدي جاكيت لأن الجو بارد قليلاً وغائم. يرسل لي صوراً للمطر!<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is summer like in Riyadh?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">hot and dry<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is the temperature in Riyadh today?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">45 degrees<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why is Tom wearing a jacket?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It is cool and cloudy.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd20","t":"Meet Dr Rania","s":"اليوم 20","d":"<div class=\"passage\" dir=\"ltr\">Who is Rania? She is a doctor. Where does she work? She works at a hospital in Jeddah. When does she start work? She starts at eight. Why does she love her job? Because she helps people every day. How does she go to work? She drives. Her husband, Majid, is an engineer. He works for a big company.<\/div><button class=\"say\" data-say=\"Who is Rania? She is a doctor. Where does she work? She works at a hospital in Jeddah. When does she start work? She starts at eight. Why does she love her job? Because she helps people every day. How does she go to work? She drives. Her husband, Majid, is an engineer. He works for a big company.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">من هي رانيا؟ هي طبيبة. أين تعمل؟ تعمل في مستشفى في جدة. متى تبدأ العمل؟ تبدأ الساعة الثامنة. لماذا تحب عملها؟ لأنها تساعد الناس كل يوم. كيف تذهب إلى العمل؟ تقود سيارتها. زوجها ماجد مهندس. يعمل في شركة كبيرة.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where does Rania work?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at a hospital<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why does she love her job?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">She helps people.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is Majid's job?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">engineer<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rdt3","t":"نص الاختبار: Khaled's message","s":"اختبار الأسبوع 3","d":"<div class=\"passage\" dir=\"ltr\">Hi Sam, I'm writing from my new apartment! It's small but very nice. There are two bedrooms and a big kitchen. There isn't a garden, but there is a balcony. The apartment is on King Street, next to a supermarket and opposite a pharmacy. It's raining now and I'm drinking hot tea. I work at a bank near here, so I can walk to work. See you soon! Khaled<\/div><button class=\"say\" data-say=\"Hi Sam, I'm writing from my new apartment! It's small but very nice. There are two bedrooms and a big kitchen. There isn't a garden, but there is a balcony. The apartment is on King Street, next to a supermarket and opposite a pharmacy. It's raining now and I'm drinking hot tea. I work at a bank near here, so I can walk to work. See you soon! Khaled\" aria-label=\"استمع\">▶ استمع للنص<\/button><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">How many bedrooms are there?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">two<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Is there a garden?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, there isn't.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is next to the apartment?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a supermarket<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How does Khaled go to work?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">he walks<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is Khaled doing now?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">drinking tea<\/span><\/details><\/li><\/ul>","color":"green"}],"color":"green"},{"id":"rdw4","t":"الأسبوع 4","s":"A wedding last Friday · Yesterday at home · A trip to Dubai · Adel's plans · At the doctor's · Two friends","d":"<p>نصوص الأسبوع 4.<\/p>","c":[{"id":"rd22","t":"A wedding last Friday","s":"اليوم 22","d":"<div class=\"passage\" dir=\"ltr\">Last Friday was my cousin's wedding. It was in a big hotel. The party was great, and the food was delicious. My parents were very happy. My little brother was tired at night. The next day I was sick, so I was at home. I wasn't at work on Saturday.<\/div><button class=\"say\" data-say=\"Last Friday was my cousin's wedding. It was in a big hotel. The party was great, and the food was delicious. My parents were very happy. My little brother was tired at night. The next day I was sick, so I was at home. I wasn't at work on Saturday.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">الجمعة الماضية كان حفل زفاف ابن عمي. كان في فندق كبير. الحفلة كانت رائعة، والطعام كان لذيذاً. والداي كانا سعيدين جداً. أخي الصغير كان متعباً في الليل. في اليوم التالي كنت مريضاً، لذلك كنت في البيت. لم أكن في العمل يوم السبت.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where was the wedding?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in a big hotel<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How was the party?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">great<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where was the writer on Saturday?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at home<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd23","t":"Yesterday at home","s":"اليوم 23","d":"<div class=\"passage\" dir=\"ltr\">Yesterday I stayed at home. In the morning I cleaned the kitchen and washed the car. At noon I cooked rice and chicken for my family. In the afternoon my friend Sami called me. We talked for an hour. Then I watched a soccer game on TV. I studied English in the evening and finished my lesson at ten.<\/div><button class=\"say\" data-say=\"Yesterday I stayed at home. In the morning I cleaned the kitchen and washed the car. At noon I cooked rice and chicken for my family. In the afternoon my friend Sami called me. We talked for an hour. Then I watched a soccer game on TV. I studied English in the evening and finished my lesson at ten.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">أمس بقيت في البيت. في الصباح نظّفت المطبخ وغسلت السيارة. عند الظهر طبخت أرزاً ودجاجاً لعائلتي. في العصر اتصل بي صديقي سامي وتكلمنا لمدة ساعة. ثم شاهدت مباراة كرة قدم على التلفاز. درست الإنجليزية في المساء وأنهيت درسي الساعة العاشرة.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where did the writer stay yesterday?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at home<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What did the writer cook?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">rice and chicken<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Who called the writer?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">his friend Sami<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd24","t":"A trip to Dubai","s":"اليوم 24","d":"<div class=\"passage\" dir=\"ltr\">Last month I went to Dubai with my wife. We flew from Cairo, and the trip took three hours. We stayed in a small hotel near the beach. We ate fish every day and drank a lot of juice. We saw many very tall buildings. I bought a watch for my father. On the last day I lost my wallet, but a man found it and gave it back to me!<\/div><button class=\"say\" data-say=\"Last month I went to Dubai with my wife. We flew from Cairo, and the trip took three hours. We stayed in a small hotel near the beach. We ate fish every day and drank a lot of juice. We saw many very tall buildings. I bought a watch for my father. On the last day I lost my wallet, but a man found it and gave it back to me!\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">الشهر الماضي ذهبت إلى دبي مع زوجتي. سافرنا بالطائرة من القاهرة، واستغرقت الرحلة ثلاث ساعات. أقمنا في فندق صغير قرب الشاطئ. أكلنا السمك كل يوم وشربنا الكثير من العصير. رأينا مباني عالية جداً. اشتريت ساعة لأبي. في اليوم الأخير فقدت محفظتي، لكن رجلاً وجدها وأعادها إليّ!<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">How did they travel to Dubai?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">by plane<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What did the writer buy for his father?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a watch<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What happened to the wallet?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">A man found it and gave it back.<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd25","t":"Adel's plans","s":"اليوم 25","d":"<div class=\"passage\" dir=\"ltr\">Next year is going to be a big year for Adel. He is going to finish university in June. Then he is going to look for a job in a bank. He is also going to save money because he wants to get married. In the summer he is going to travel abroad with his brother. He hopes to visit Turkey.<\/div><button class=\"say\" data-say=\"Next year is going to be a big year for Adel. He is going to finish university in June. Then he is going to look for a job in a bank. He is also going to save money because he wants to get married. In the summer he is going to travel abroad with his brother. He hopes to visit Turkey.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">العام القادم سيكون عاماً مهماً لعادل. سينهي الجامعة في يونيو. ثم سيبحث عن عمل في بنك. وسيدّخر المال أيضاً لأنه يريد أن يتزوج. في الصيف سيسافر إلى الخارج مع أخيه. يتمنى أن يزور تركيا.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When is Adel going to finish university?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in June<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where does he want to work?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in a bank<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why is he going to save money?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">to get married<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd26","t":"At the doctor's","s":"اليوم 26","d":"<div class=\"passage\" dir=\"ltr\">Doctor: Hello, Mr Nasser. What's the problem? — Nasser: I don't feel well. I have a headache and a bad cough, and my back hurts. — Doctor: Do you have a fever? — Nasser: Yes, a little. — Doctor: You have a cold. Take this medicine three times a day and rest at home for two days. Drink a lot of water. — Nasser: Thank you, doctor.<\/div><button class=\"say\" data-say=\"Doctor: Hello, Mr Nasser. What's the problem? — Nasser: I don't feel well. I have a headache and a bad cough, and my back hurts. — Doctor: Do you have a fever? — Nasser: Yes, a little. — Doctor: You have a cold. Take this medicine three times a day and rest at home for two days. Drink a lot of water. — Nasser: Thank you, doctor.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">الطبيب: مرحباً يا سيد ناصر. ما المشكلة؟ — ناصر: لا أشعر أنني بخير. عندي صداع وسعال شديد، وظهري يؤلمني. — الطبيب: هل عندك حمّى؟ — ناصر: نعم، قليلاً. — الطبيب: عندك زكام. خذ هذا الدواء ثلاث مرات في اليوم واسترح في البيت يومين. اشرب الكثير من الماء. — ناصر: شكراً يا دكتور.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is wrong with Nasser?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">He has a headache and a cough.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does the doctor say he has?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a cold<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How often must he take the medicine?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">three times a day<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rd27","t":"Two friends","s":"اليوم 27","d":"<div class=\"passage\" dir=\"ltr\">Laila and Dina are friends, but they are different. Laila is friendly, and she enjoys meeting new people. She likes going to parties. Dina is shy. She prefers staying at home and reading. But they both love cooking, so they often cook together. Dina wants to learn English, and Laila helps her. Laila also likes Dina's family very much.<\/div><button class=\"say\" data-say=\"Laila and Dina are friends, but they are different. Laila is friendly, and she enjoys meeting new people. She likes going to parties. Dina is shy. She prefers staying at home and reading. But they both love cooking, so they often cook together. Dina wants to learn English, and Laila helps her. Laila also likes Dina's family very much.\" aria-label=\"استمع\">▶ استمع للنص<\/button><details><summary>الترجمة<\/summary><p class=\"ar\">ليلى ودينا صديقتان، لكنهما مختلفتان. ليلى ودودة وتستمتع بالتعرف على أشخاص جدد. تحب الذهاب إلى الحفلات. دينا خجولة. تفضّل البقاء في البيت والقراءة. لكن الاثنتين تحبان الطبخ، لذلك غالباً تطبخان معاً. دينا تريد أن تتعلم الإنجليزية، وليلى تساعدها. وليلى تحب عائلة دينا كثيراً.<\/p><\/details><h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What does Laila enjoy?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">meeting new people<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is Dina like?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">shy<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What do they often do together?<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">cook<\/span><\/details><\/li><\/ul>","color":"green"},{"id":"rdt4","t":"نص الاختبار: Last weekend","s":"اختبار الأسبوع 4","d":"<div class=\"passage\" dir=\"ltr\">Last weekend was great. On Thursday night I went to my uncle's house. We ate dinner together and talked a lot. On Friday morning I was tired, so I stayed at home. In the afternoon I visited my friend Ali. We watched ltr\">thought<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"saw\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">saw<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"read\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">read<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"ate\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">ate<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"said\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">said<\/span><\/div><\/div>","color":"rose"},{"id":"p25","t":"gonna","s":"اليوم 25","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>في الكلام السريع going to تُسمع «قونا». افهمها عند السماع، واكتبها دائماً going to.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"I'm going to\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">I'm going to<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"We're going to\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">We're going to<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Are you going to\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Are you going to<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"What are you going to do?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">What are you going to do?<\/span><\/div><\/div>","color":"rose"},{"id":"p26","t":"الجمع الشاذ","s":"اليوم 26","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>foot → feet، tooth → teeth، child → children، man → men، woman → women (ويمِن).<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"feet\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">feet<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"teeth\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">teeth<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"children\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">children<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"women\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">women<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"men\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">men<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"stomach\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">stomach<\/span><\/div><\/div>","color":"rose"},{"id":"p27","t":"التنغيم في الأسئلة","s":"اليوم 27","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>أسئلة نعم/لا يرتفع الصوت في آخرها ↗ (Do you like it?). أسئلة wh ينخفض ↘ (What do you like?).<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"Do you like it?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Do you like it?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"What do you like?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">What do you like?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Are you ready?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Are you ready?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Where do you live?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Where do you live?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Can you come?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Can you come?<\/span><\/div><\/div>","color":"rose"}],"color":"rose"}]}]}</script>
<script>
(() => {
const ROOT = JSON.parse(document.getElementById('tree').textContent);
const byId = new Map(), parent = new Map();
(function idx(n, p, dep) { n.dep = dep; byId.set(n.id, n); if (p) parent.set(n.id, p); (n.c || []).forEach(k => idx(k, n, dep + 1)); })(ROOT, null, 0);
const leafIds = n => n.c ? n.c.flatMap(leafIds) : [n.id];
const LS = 'a1gram.v1';
let saved = {}; try { saved = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) {}
const done = new Set(saved.done || []);
const expanded = new Set(['root']);
let sel = 'root';
const persist = () => { try { localStorage.setItem(LS, JSON.stringify({ done: [...done] })); } catch (e) {} };

const $ = s => document.querySelector(s);
const map = $('#map'), world = $('#world'), svg = $('#links'), panel = $('#panel');
const els = new Map(), pos = new Map();
const small = () => matchMedia('(max-width:760px)').matches;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const colorVar = n => `var(--${n.color === 'ink' ? 'inkc' : n.color})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() { const out = []; (function w(n) { out.push(n); if (n.c && expanded.has(n.id)) n.c.forEach(w); })(ROOT); return out; }
function progress(n) { const L = leafIds(n); return [L.filter(i => done.has(i)).length, L.length]; }

function nodeEl(n) {
  let el = els.get(n.id);
  if (!el) {
    el = document.createElement('button'); el.className = 'node'; el.dataset.id = n.id;
    el.style.setProperty('--c', colorVar(n));
    el.addEventListener('click', e => { if (moved) return; onNode(n.id); });
    world.appendChild(el); els.set(n.id, el);
  }
  const kids = n.c ? n.c.length : 0, open = expanded.has(n.id);
  let badge = '';
  if (kids) { const [a, b] = progress(n); badge = `<span class="cnt">${open ? '−' : '+' + kids}${a ? ' · ' + a + '/' + b : ''}</span>`; }
  else if (done.has(n.id)) badge = '<span class="ck" aria-label="خلصته">✓</span>';
  el.innerHTML = `${n.dep ? '<span class="dot"></span>' : ''}<span class="tx"><span class="tt">${esc(n.t)}</span>${n.s && n.dep < 3 ? `<span class="st">${esc(n.s)}</span>` : ''}</span>${badge}`;
  el.className = 'node' + (n.dep === 0 ? ' root' : n.dep === 1 ? ' d1' : '') + (n.id === sel ? ' sel' : '') + (!kids && done.has(n.id) ? ' done' : '');
  el.setAttribute('aria-expanded', kids ? String(open) : 'false');
  el.setAttribute('aria-label', n.t + (kids ? (open ? '، مفتوح' : '، فيه ' + kids + ' فروع') : ''));
  return el;
}

const HG = 56, VG = 10;
let anim = null;
function layout(animate = true) {
  const vis = visible(), seen = new Set(vis.map(n => n.id));
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); }
  vis.forEach(nodeEl);
  const size = new Map(); vis.forEach(n => { const el = els.get(n.id); size.set(n.id, [el.offsetWidth, el.offsetHeight]); });
  const colW = []; vis.forEach(n => { colW[n.dep] = Math.max(colW[n.dep] || 0, size.get(n.id)[0]); });
  const right = [0]; for (let d = 1; d < colW.length; d++) right[d] = right[d - 1] - colW[d - 1] - HG;
  const target = new Map(); let cur = 0;
  (function place(n) {
    const [w, h] = size.get(n.id);
    let y;
    if (n.c && expanded.has(n.id)) {
      const ys = n.c.map(place); y = (ys[0] + ys[ys.length - 1]) / 2;
      if (n.dep >= 1) cur += VG;
    } else { y = cur + h / 2; cur += h + VG; }
    target.set(n.id, { x: right[n.dep] - w, y: y - h / 2, w, h, cy: y });
    return y;
  })(ROOT);
  const from = new Map();
  vis.forEach(n => {
    const t = target.get(n.id), p = parent.get(n.id);
    from.set(n.id, pos.get(n.id) || (p && pos.get(p.id) ? { ...t, x: pos.get(p.id).x - t.w + pos.get(p.id).w, y: pos.get(p.id).cy - t.h / 2, cy: pos.get(p.id).cy } : t));
  });
  const t0 = performance.now(), dur = animate && !reduce ? 320 : 0;
  cancelAnimationFrame(anim);
  const step = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    vis.forEach(n => { const a = from.get(n.id), b = target.get(n.id);
      const q = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, w: b.w, h: b.h, cy: a.cy + (b.cy - a.cy) * e };
      pos.set(n.id, q); els.get(n.id).style.transform = `translate(${q.x}px,${q.y}px)`; });
    drawLinks(vis);
    if (k < 1) anim = requestAnimationFrame(step);
  };
  if (dur) anim = requestAnimationFrame(step); else step(t0);
  return target;
}
function drawLinks(vis) {
  let d = '';
  const byColor = {};
  vis.forEach(n => { const p = parent.get(n.id); if (!p) return; const a = pos.get(p.id), b = pos.get(n.id); if (!a || !b) return;
    const x1 = a.x, y1 = a.cy, x2 = b.x + b.w, y2 = b.cy, mx = (x1 + x2) / 2;
    (byColor[n.color] = byColor[n.color] || []).push(`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`); });
  svg.innerHTML = Object.entries(byColor).map(([c, ps]) => `<path stroke="var(--${c})" d="${ps.join(' ')}"/>`).join('');
}

// ---- view transform ----
let tx = 0, ty = 0, k = 1, viewAnim = null;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${k})`; };
function viewTo(nx, ny, nk, animate = true) {
  cancelAnimationFrame(viewAnim);
  if (!animate || reduce) { tx = nx; ty = ny; k = nk; apply(); return; }
  const a = { tx, ty, k }, t0 = performance.now();
  const step = now => { const q = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - q, 3);
    tx = a.tx + (nx - a.tx) * e; ty = a.ty + (ny - a.ty) * e; k = a.k + (nk - a.k) * e; apply(); if (q < 1) viewAnim = requestAnimationFrame(step); };
  viewAnim = requestAnimationFrame(step);
}
function focusOn(id, targetMap, zoom) {
  const t = (targetMap && targetMap.get(id)) || pos.get(id); if (!t) return;
  const r = map.getBoundingClientRect(), nk = zoom || k;
  const panelH = small() && !panel.classList.contains('shut') ? r.height * 0.58 : 0;
  const cx = r.width * (small() ? 0.5 : 0.62), cy = (r.height - panelH) * 0.5;
  viewTo(cx - (t.x + t.w / 2) * nk, cy - (t.y + t.h / 2) * nk, nk);
}
function fit() {
  const r = map.getBoundingClientRect();
  const panelH = small() && !panel.classList.contains('shut') ? r.height * 0.58 : 0;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [id] of els) { const t = pos.get(id); if (!t) continue; x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x + t.w); y0 = Math.min(y0, t.y); y1 = Math.max(y1, t.y + t.h); }
  if (!isFinite(x0)) return;
  const W = r.width - 40, H = r.height - panelH - 40;
  const nk = Math.max(0.4, Math.min(1, W / (x1 - x0), H / (y1 - y0)));
  viewTo(r.width - 20 - x1 * nk, 20 + (H - (y1 - y0) * nk) / 2 - y0 * nk, nk);
}

// ---- interactions ----
function ancestors(id) { const a = []; let p = parent.get(id); while (p) { a.unshift(p); p = parent.get(p.id); } return a; }
function onNode(id, fromPanel) {
  const n = byId.get(id);
  if (n.c) { if (expanded.has(id) && sel === id && !fromPanel) collapse(id); else expanded.add(id); }
  select(id);
}
function collapse(id) { expanded.delete(id); (function w(n) { (n.c || []).forEach(k => { expanded.delete(k.id); w(k); }); })(byId.get(id)); }
function select(id, reveal) {
  if (reveal) ancestors(id).forEach(a => expanded.add(a.id));
  sel = id; const tgt = layout(); renderPanel();
  if (small()) panel.classList.remove('shut');
  focusOn(id, tgt, Math.max(k, small() ? 0.8 : 0.9));
}
function renderPanel() {
  const n = byId.get(sel), anc = ancestors(sel);
  panel.style.setProperty('--c', colorVar(n.color === 'ink' ? { color: 'indigo' } : n));
  const kids = n.c || [];
  const isLeaf = !kids.length;
  panel.innerHTML = `<div class="ph">
    <div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0">
    ${anc.length ? `<div class="crumbs">${anc.map(a => `<button data-go="${a.id}">${esc(a.t)}</button><span>‹</span>`).join('')}</div>` : ''}
    <h2><i></i>${esc(n.t)}</h2>${n.s ? `<div class="sub">${esc(n.s)}</div>` : ''}</div>
    <button class="closep" id="closep" aria-label="اقفل التفاصيل">×</button></div>
    ${isLeaf ? `<div class="row"><button class="pill ${done.has(n.id) ? 'on' : ''}" id="doneBtn">${done.has(n.id) ? '✓ خلصته' : 'علّم إنك خلصته'}</button></div>` : (() => { const [a, b] = progress(n); return `<div class="row"><span class="pill" style="cursor:default">خلصت ${a} من ${b}</span></div>`; })()}
  </div>
  <div class="pb">${n.d || ''}
    ${kids.length ? `<div class="kids"><h4>الفروع (${kids.length})</h4>${kids.map(c => `<button class="kid" data-go="${c.id}"><span>${esc(c.t)}${done.has(c.id) ? ' ✓' : ''}</span><small>${c.c ? c.c.length + ' ←' : ''}</small></button>`).join('')}</div>` : ''}
  </div>`;
  panel.querySelector('.pb').scrollTop = 0;
}
panel.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { onNode(go.dataset.go, true); return; }
  const s = e.target.closest('[data-say]'); if (s) { speak(s.dataset.say); return; }
  if (e.target.closest('#doneBtn')) { done.has(sel) ? done.delete(sel) : done.add(sel); persist(); layout(false); renderPanel(); return; }
  if (e.target.closest('#closep')) { panel.classList.add('shut'); return; }
  if (small() && panel.classList.contains('shut') && e.target.closest('.ph')) panel.classList.remove('shut');
});

// speech
let voice = null;
function pickVoice() { const v = speechSynthesis.getVoices(); voice = v.find(x => /^en[-_]US/i.test(x.lang) && /Google|Samantha|Aria|Jenny|Ava/.test(x.name)) || v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = 0.85; speechSynthesis.speak(u); }

// pan / zoom
let pointers = new Map(), moved = false, start = null, pinch = null;
map.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { moved = false; start = { x: e.clientX, y: e.clientY, tx, ty }; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k, tx, ty, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
});
map.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()], r = map.getBoundingClientRect();
    const nk = Math.min(2.2, Math.max(0.25, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    const mx = pinch.mx - r.left, my = pinch.my - r.top;
    tx = mx - (mx - pinch.tx) * nk / pinch.k; ty = my - (my - pinch.ty) * nk / pinch.k; k = nk; moved = true; apply(); return;
  }
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (!moved && Math.hypot(dx, dy) > 5) { moved = true; map.classList.add('drag'); try { map.setPointerCapture(e.pointerId); } catch (x) {} }
  if (moved) { cancelAnimationFrame(viewAnim); tx = start.tx + dx; ty = start.ty + dy; apply(); }
});
const end = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) { start = null; map.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); } };
map.addEventListener('pointerup', end); map.addEventListener('pointercancel', end);
map.addEventListener('wheel', e => { e.preventDefault(); const r = map.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const nk = Math.min(2.2, Math.max(0.25, k * Math.exp(-e.deltaY * 0.0015))); cancelAnimationFrame(viewAnim);
  tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk; apply(); }, { passive: false });
const zoomBy = f => { const r = map.getBoundingClientRect(), mx = r.width / 2, my = r.height / 2, nk = Math.min(2.2, Math.max(0.25, k * f)); viewTo(mx - (mx - tx) * nk / k, my - (my - ty) * nk / k, nk); };
$('#bIn').onclick = () => zoomBy(1.2); $('#bOut').onclick = () => zoomBy(1 / 1.2);
$('#bFit').onclick = () => { layout(false); fit(); };
$('#bFold').onclick = () => { expanded.clear(); expanded.add('root'); sel = 'root'; layout(); renderPanel(); setTimeout(fit, 30); };

// search
const plain = new Map(); byId.forEach((n, id) => plain.set(id, (n.t + ' ' + (n.s || '') + ' ' + (n.d || '').replace(/<[^>]+>/g, ' ')).toLowerCase()));
const q = $('#q'), res = $('#res');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  if (s.length < 2) { res.hidden = true; return; }
  const hits = []; byId.forEach((n, id) => { if (id === 'root') return; const txt = plain.get(id); const i = txt.indexOf(s); if (i >= 0) hits.push([n, (n.t.toLowerCase().includes(s) ? 0 : 1) + n.dep * 0.01]); });
  hits.sort((a, b) => a[1] - b[1]);
  res.innerHTML = hits.length ? hits.slice(0, 30).map(([n]) => `<button data-hit="${n.id}"><div>${esc(n.t)}</div><div class="rp">${esc(ancestors(n.id).slice(1).map(a => a.t).join(' ‹ ') || 'فرع رئيسي')}</div></button>`).join('') : '<div class="rp" style="padding:10px">مفيش نتيجة. جرّب كلمة تانية.</div>';
  res.hidden = false;
});
res.addEventListener('click', e => { const b = e.target.closest('[data-hit]'); if (!b) return; res.hidden = true; q.blur(); select(b.dataset.hit, true); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
q.addEventListener('keydown', e => { if (e.key === 'Escape') { res.hidden = true; q.blur(); } if (e.key === 'Enter') { const b = res.querySelector('[data-hit]'); if (b) b.click(); } });

// start: root + main branches, with "ابدأ من هنا" open
expanded.add('gram');
if (small()) panel.classList.add('shut');
layout(false); renderPanel(); fit();
addEventListener('resize', () => { layout(false); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(false); fit(); });
})();
</script>

</body>
</html>
