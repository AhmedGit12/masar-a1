<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2742C2">
<title>مسار A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --sunk:#E9EDF5; --ink:#141D33; --ink2:#4B5670; --ink3:#7B859C; --line:#D9DFEA;
  --accent:#2742C2; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --hi:#FFD84A; --hi-ink:#231A00;
  --ok:#17875A; --ok-soft:#DDF3E8; --bad:#C63A3A; --bad-soft:#FBE3E3; --warn:#B26A00; --warn-soft:#FFF0D6;
  --t-memo:#6D3FD0; --t-memo-bg:#EDE6FB; --t-und:#1F63C4; --t-und-bg:#E1ECFB; --t-rep:#C45F0C; --t-rep-bg:#FCEBDC;
  --t-focus:#0B7F80; --t-focus-bg:#DCF2F2; --t-bg:#5F6A84; --t-bg-bg:#E8EBF1; --t-read:#2C7A2C; --t-read-bg:#E3F2E0;
  --t-write:#B3336D; --t-write-bg:#F9E2EC; --t-test:#141D33; --t-test-bg:#DDE1EA;
  --shadow:0 1px 2px rgba(20,29,51,.06),0 6px 24px -12px rgba(20,29,51,.18);
  --r:14px; --r-sm:10px;
  --f-ar:"IBM Plex Sans Arabic","Readex Pro",Tahoma,"Segoe UI",sans-serif;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D1220; --card:#161D31; --sunk:#1D2640; --ink:#E9EDF7; --ink2:#A7B1C9; --ink3:#7C87A1; --line:#28324E;
    --accent:#8FA2FF; --accent-ink:#0D1220; --accent-soft:#232E55;
    --hi:#F5CD3D; --hi-ink:#1D1600;
    --ok:#4CC990; --ok-soft:#133A2A; --bad:#FF7A7A; --bad-soft:#402020; --warn:#F2B04C; --warn-soft:#3A2C12;
    --t-memo:#B79BFF; --t-memo-bg:#2B2250; --t-und:#83B3FF; --t-und-bg:#1B2B4B; --t-rep:#FFAD6B; --t-rep-bg:#3B2717;
    --t-focus:#5FD6D6; --t-focus-bg:#113536; --t-bg:#A9B3CB; --t-bg-bg:#252D44; --t-read:#83D683; --t-read-bg:#1B3620;
    --t-write:#FF8DBD; --t-write-bg:#3E1D2E; --t-test:#E9EDF7; --t-test-bg:#2E3753;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0D1220; --card:#161D31; --sunk:#1D2640; --ink:#E9EDF7; --ink2:#A7B1C9; --ink3:#7C87A1; --line:#28324E;
    --accent:#8FA2FF; --accent-ink:#0D1220; --accent-soft:#232E55;
    --hi:#F5CD3D; --hi-ink:#1D1600;
    --ok:#4CC990; --ok-soft:#133A2A; --bad:#FF7A7A; --bad-soft:#402020; --warn:#F2B04C; --warn-soft:#3A2C12;
    --t-memo:#B79BFF; --t-memo-bg:#2B2250; --t-und:#83B3FF; --t-und-bg:#1B2B4B; --t-rep:#FFAD6B; --t-rep-bg:#3B2717;
    --t-focus:#5FD6D6; --t-focus-bg:#113536; --t-bg:#A9B3CB; --t-bg-bg:#252D44; --t-read:#83D683; --t-read-bg:#1B3620;
    --t-write:#FF8DBD; --t-write-bg:#3E1D2E; --t-test:#E9EDF7; --t-test-bg:#2E3753;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}
audio{vertical-align:middle}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.en{font-family:var(--f-disp);direction:ltr;unicode-bidi:isolate;text-align:left}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .mark{display:inline-grid;place-items:center;height:28px;padding-inline:7px;border-radius:8px;background:var(--hi);color:var(--hi-ink);font-size:14px;font-weight:700;direction:ltr}
.sync{margin-inline-start:auto;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--bad)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;min-width:34px;padding-inline:9px;display:inline-grid;place-items:center;font-size:13px;color:var(--ink2)}

/* bottom nav */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:6px}
.nav button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2.2}

main{padding-block:18px 28px}
.stack{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.lift{box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--ink3);font-weight:600}

/* day hero */
.dayhero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.daynum{isolation:isolate;font-family:var(--f-disp);font-weight:700;font-size:56px;line-height:.9;letter-spacing:-.04em;direction:ltr;position:relative;padding:4px 6px 0}
.daynum::after{content:"";position:absolute;inset-inline:0;bottom:6px;height:16px;background:var(--hi);opacity:.85;z-index:-1;border-radius:3px}
.daynum small{font-size:15px;color:var(--ink3);letter-spacing:0;font-weight:500}
.dayhero .topic{font-size:20px;font-family:var(--f-disp);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.ok b{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px}
.stat b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--ink2);line-height:1.3}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;line-height:1.7}
.tag.memo{color:var(--t-memo);background:var(--t-memo-bg)} .tag.und{color:var(--t-und);background:var(--t-und-bg)}
.tag.rep{color:var(--t-rep);background:var(--t-rep-bg)} .tag.focus{color:var(--t-focus);background:var(--t-focus-bg)}
.tag.bg{color:var(--t-bg);background:var(--t-bg-bg)} .tag.read{color:var(--t-read);background:var(--t-read-bg)}
.tag.write{color:var(--t-write);background:var(--t-write-bg)} .tag.test{color:var(--t-test);background:var(--t-test-bg)}
.tag.min{color:var(--ink2);background:transparent;border:1px solid var(--line);font-weight:500}

/* tasks */
.group-h{display:flex;align-items:baseline;gap:8px;margin:4px 2px -4px}
.group-h h3{font-size:15px}
.tasks{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;margin-top:2px;padding:0}
.task .chk svg{width:16px;height:16px;opacity:0;color:var(--accent-ink)}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk svg{opacity:1}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--ink3);color:var(--ink2)}
.t-title{font-weight:600;font-size:15px}
.t-how{font-size:13.5px;color:var(--ink2);margin-top:2px}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.t-act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);line-height:1.4}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.lg{padding:11px 18px;font-size:15.5px;border-radius:12px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ext::after{content:"↗";font-size:12px;opacity:.7}

.spk{border:0;background:var(--accent-soft);color:var(--accent);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;padding:0}
.spk svg{width:17px;height:17px}
.spk.lg{width:64px;height:64px}
.spk.lg svg{width:30px;height:30px}

/* lesson */
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.how{font-size:13.5px;color:var(--ink2);background:var(--sunk);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.how b{color:var(--ink)}
.rule{font-family:var(--f-disp);direction:ltr;text-align:center;font-weight:600;font-size:16.5px;background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:10px 12px;margin:10px 0}
.ex{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:0}
.ex .en{font-size:16px;font-weight:500}
.ex .ar{font-size:13.5px;color:var(--ink2)}
.mis{display:grid;gap:4px;border-radius:10px;padding:10px 12px;background:var(--bad-soft);margin-top:10px;font-size:14px}
.mis .wrong{text-decoration:line-through;color:var(--bad)}
.mis .right{color:var(--ok);font-weight:600}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.word{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.word .en{font-weight:600;font-size:15.5px}
.word .ar{font-size:13px;color:var(--ink2);line-height:1.4}
.word .lk{font-size:11.5px;color:var(--ink3);text-decoration:none}
.dlg{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;background:var(--sunk)}
.bub.B{align-self:flex-end;background:var(--accent-soft)}
.bub .en{font-size:15.5px}
.bub .ar{font-size:13px;color:var(--ink2)}
.hideAr .bub .ar{display:none}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;resize:vertical}
textarea.en,input.en{font-family:var(--f-disp)}
textarea:focus,input:focus{border-color:var(--accent);outline:none}
.fb{border-radius:12px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.warn{background:var(--warn-soft)} .fb.info{background:var(--sunk)}
.diff span{padding:0 2px;border-radius:4px}
.diff .hit{background:var(--ok-soft);color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}

/* quiz */
.qwrap{max-width:620px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qbody{min-height:300px}
.qprompt{font-size:14px;color:var(--ink2);margin-bottom:10px}
.qmain{font-family:var(--f-disp);direction:ltr;text-align:left;font-size:22px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:start;font-size:16px;font-weight:500}
.opt.en{text-align:left}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.passage{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.7;max-height:260px;overflow:auto;margin-bottom:12px}
.skill{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;font-size:13.5px}
.big-score{font-family:var(--f-disp);font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* cards */
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;user-select:none}
.flash .front{font-family:var(--f-disp);font-size:34px;font-weight:600;direction:ltr}
.flash .front.arf{font-family:var(--f-ar);direction:rtl}
.flash .back{font-size:19px;color:var(--ink2)}

/* grid */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-disp);font-weight:600;font-size:14px;color:var(--ink3);padding:0}
.cal .pass{background:var(--ok);border-color:var(--ok);color:#fff}
.cal .open{border:2px solid var(--accent);color:var(--accent)}
.cal .lock{background:var(--sunk);border-color:transparent;opacity:.6}
.cal .rev{border-style:dashed}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:15.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg .corr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--warn);direction:rtl;text-align:right;font-family:var(--f-ar)}
.legend{display:grid;gap:10px}
.legend .item{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;font-size:14px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.player-now{text-align:center;padding:18px 8px}
.player-now .en{text-align:center;font-size:26px;font-weight:600}
.player-now .ar{font-size:15px;color:var(--ink2);margin-top:6px}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
select{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px}
.guide{border:2px solid var(--accent)}
.gdots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.gdots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.gdots i.d{background:var(--ok)} .gdots i.c{background:var(--accent);transform:scale(1.3)}
.gbar{position:sticky;top:calc(55px + env(safe-area-inset-top,0px));z-index:19;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.gbar .wrap{padding-block:8px}
.gbar .btn{white-space:nowrap;flex:none}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:600}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill-row button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.pill-row button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:480px){
  .daynum{font-size:46px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat b{font-size:17px}
  .legend .item{grid-template-columns:1fr}
  .qmain{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app" dir="rtl" lang="ar"></div>
<script>
// ================= CURRICULUM DATA =================
const BC = "https://learnenglish.britishcouncil.org/free-resources/";
const VOA = {

17:{kind:"learn",week:3,topic:"القدرة والطلب: can",en:"Can you...?",
 g:{t:"can / can't",ar:"can = يستطيع، و can't = لا يستطيع. بعدها فعل أصلي بدون to ولا s: She can drive. للسؤال: Can you...? وتُستخدم أيضاً للطلب بأدب: Can you help me?",rule:"فاعل + can / can't + فعل أصلي  ·  Can + فاعل + فعل؟",ex:[["I can swim, but I can't dance.","أستطيع السباحة لكن لا أستطيع الرقص."],["Can you help me?","هل يمكنك مساعدتي؟"],["Can you speak slowly, please?","هل يمكنك التحدث ببطء؟"],["She can speak three languages.","تستطيع التحدث بثلاث لغات."]],mis:["He can to drive.","He can drive.","لا to ولا s بعد can."]},

2:{t:"Karim's number",text:"This is Karim. He is a student. He is twenty years old. Mona is his sister. She is twelve. Karim's phone number is 0 1 5 7 3 8 9 4. His name is easy to spell: K-A-R-I-M.",ar:"هذا كريم. هو طالب. عمره عشرون سنة. منى أخته. عمرها اثنتا عشرة سنة. رقم هاتف كريم هو 0 1 5 7 3 8 9 4. اسمه سهل في التهجئة: K-A-R-I-M.",
 q:[["How old is Karim?",["twelve","twenty","thirty"],1],["How old is Mona?",["ten","eleven","twelve"],2],["How do you spell Karim's name?",["K-A-R-I-M","K-E-R-I-M","C-A-R-I-M"],0]]},
3:{t:"Yusuf and John",text:"I am Yusuf. I am from Egypt, but I live in Saudi Arabia. My city is Riyadh. I speak Arabic and a little English. My friend John is not Egyptian. He is British. He is from London, the capital of Britain. His language is English. Are you from Egypt too?",ar:"أنا يوسف. أنا من مصر، لكني أعيش في السعودية. مدينتي الرياض. أتكلم العربية وقليلاً من الإنجليزية. صديقي جون ليس مصرياً. هو بريطاني، من لندن عاصمة بريطانيا. لغته الإنجليزية. هل أنت من مصر أيضاً؟",
 q:[["Where is Yusuf from?",["Saudi Arabia","Egypt","Britain"],1],["Where does Yusuf live?",["in Egypt","in London","in Saudi Arabia"],2],["What nationality is John?",["Egyptian","British","American"],1]]},
4:{t:"Huda's family",text:"My name is Huda. I am married. My husband's name is Tarek. We have two children, a son and a daughter. Our son is eight and our daughter is five. My parents live near us. My father is a teacher and my mother is a doctor. My brother, Sami, is single. His car is red.",ar:"اسمي هدى. أنا متزوجة. اسم زوجي طارق. لدينا طفلان، ولد وبنت. ابننا عمره ثماني سنوات وابنتنا خمس سنوات. والداي يعيشان قريباً منا. أبي معلّم وأمي طبيبة. أخي سامي أعزب. سيارته حمراء.",
 q:[["Is Huda married?",["Yes, she is.","No, she isn't.","We don't know."],0],["How many children do Huda and Tarek have?",["one","two","three"],1],["Who is single?",["Tarek","Sami","Huda's father"],1]]},
5:{t:"What's in my bag?",text:"This is my bag. It is big and black. In my bag there is a book, two pens and a pencil. These are my keys, and this is my phone. That is my wallet on the table. Those are not my glasses. They are my brother's glasses. My laptop is not in my bag. It is at home.",ar:"هذه حقيبتي. إنها كبيرة وسوداء. في حقيبتي كتاب وقلمان وقلم رصاص. هذه مفاتيحي، وهذا هاتفي. تلك محفظتي على الطاولة. تلك ليست نظارتي، إنها نظارة أخي. اللابتوب ليس في حقيبتي، إنه في البيت.",
 q:[["What color is the bag?",["red","black","white"],1],["How many pens are in the bag?",["one","two","three"],1],["Where is the laptop?",["in the bag","on the table","at home"],2]]},
6:{t:"My favorite things",text:"My favorite color is green. My new car is dark green and very beautiful. My house is small, but it is nice. My cat is gray and white. She is very small and very happy. My brother is tall and strong. His favorite color is blue. Today is very hot, so I am tired.",ar:"لوني المفضل هو الأخضر. سيارتي الجديدة خضراء غامقة وجميلة جداً. بيتي صغير لكنه لطيف. قطتي رمادية وبيضاء. هي صغيرة جداً وسعيدة جداً. أخي طويل وقوي. لونه المفضل الأزرق. اليوم حار جداً، لذلك أنا متعب.",
 q:[["What is the writer's favorite color?",["blue","green","gray"],1],["What color is the cat?",["black and white","gray and white","brown"],1],["Why is the writer tired?",["It is very hot.","The car is new.","The house is small."],0]]},
8:{t:"My day",text:"I get up at six o'clock every day. I wash my face and pray. Then I have breakfast with my family. We eat bread, eggs and cheese. I go to work at seven thirty. I work in an office. I come back home at four. In the evening, I study English for one hour. I go to bed at eleven.",ar:"أستيقظ الساعة السادسة كل يوم. أغسل وجهي وأصلّي. ثم أتناول الفطور مع عائلتي. نأكل خبزاً وبيضاً وجبناً. أذهب إلى العمل الساعة السابعة والنصف. أعمل في مكتب. أرجع إلى البيت الساعة الرابعة. في المساء أدرس الإنجليزية لمدة ساعة. أنام الساعة الحادية عشرة.",
 q:[["When does the writer get up?",["at five","at six","at seven"],1],["Where does the writer work?",["in a school","in an office","at home"],1],["What does the writer do in the evening?",["works","studies English","goes to the gym"],1]]},
9:{t:"Nadia's week",text:"Nadia is a nurse. She works in a big hospital. She starts work at seven in the morning and finishes at three in the afternoon. Friday and Saturday are her weekend. On Friday she visits her mother. In the evening she watches TV or reads a book. Her birthday is in May.",ar:"نادية ممرضة. تعمل في مستشفى كبير. تبدأ العمل الساعة السابعة صباحاً وتنتهي الساعة الثالثة عصراً. الجمعة والسبت عطلة نهاية الأسبوع لها. يوم الجمعة تزور أمها. في المساء تشاهد التلفاز أو تقرأ كتاباً. عيد ميلادها في شهر مايو.",
 q:[["What is Nadia's job?",["a teacher","a nurse","a doctor"],1],["What time does she finish work?",["at seven","at three","at five"],1],["What does she do on Friday?",["She works.","She visits her mother.","She goes to the gym."],1]]},
10:{t:"Two different brothers",text:"Ali and Hassan are brothers, but they are very different. Ali likes soccer. He watches every match on TV. Hassan doesn't like soccer. He loves music and reading. Ali drinks coffee every morning, but Hassan doesn't drink coffee. He prefers tea. Do they like the same food? Yes, they do! They love chicken and rice.",ar:"علي وحسن أخوان، لكنهما مختلفان جداً. علي يحب كرة القدم. يشاهد كل مباراة على التلفاز. حسن لا يحب كرة القدم. يحب الموسيقى والقراءة. علي يشرب القهوة كل صباح، لكن حسن لا يشرب القهوة. يفضّل الشاي. هل يحبان نفس الطعام؟ نعم! يحبان الدجاج والأرز.",
 q:[["Who likes soccer?",["Ali","Hassan","both brothers"],0],["What does Hassan drink?",["coffee","tea","juice"],1],["What food do both brothers love?",["pizza","fish","chicken and rice"],2]]},
11:{t:"Mariam's free time",text:"Mariam is very busy in the week, but at the weekend she has free time. She always visits her grandmother on Friday. She usually goes to the gym on Saturday morning. She often walks in the park with her friends. She sometimes takes photos with her camera. She never watches TV because she thinks it is boring.",ar:"مريم مشغولة جداً خلال الأسبوع، لكن في عطلة نهاية الأسبوع عندها وقت فراغ. دائماً تزور جدتها يوم الجمعة. عادةً تذهب إلى النادي الرياضي صباح السبت. غالباً تمشي في الحديقة مع صديقاتها. أحياناً تلتقط صوراً بكاميرتها. لا تشاهد التلفاز أبداً لأنها تراه مملاً.",
 q:[["When does Mariam visit her grandmother?",["on Saturday","on Friday","every day"],1],["How often does she walk in the park?",["often","never","always"],0],["What does she never do?",["go to the gym","take photos","watch TV"],2]]},
12:{t:"At the restaurant",text:"Waiter: Good evening. Are you ready to order? — Ahmed: Yes. I'd like some chicken soup and a salad, please. — Waiter: Would you like any rice? — Ahmed: No, thank you. I'm not very hungry. — Waiter: And to drink? — Ahmed: Some orange juice, please. — Later: Can I have the bill, please? The food was delicious!",ar:"النادل: مساء الخير. هل أنت مستعد للطلب؟ — أحمد: نعم. أريد شوربة دجاج وسلطة من فضلك. — النادل: هل تريد أرزاً؟ — أحمد: لا، شكراً. لست جائعاً جداً. — النادل: وماذا تشرب؟ — أحمد: عصير برتقال من فضلك. — بعد ذلك: ممكن الحساب من فضلك؟ الطعام كان لذيذاً!",
 q:[["What soup does Ahmed order?",["fish soup","chicken soup","tomato soup"],1],["Does Ahmed want rice?",["Yes, he does.","No, he doesn't.","The text doesn't say."],1],["What does he drink?",["water","tea","orange juice"],2]]},
13:{t:"Buying a jacket",text:"Salma is at the market. She wants a new jacket for winter. She tries on a black jacket, but it is too small. She asks for a large size. The large jacket is perfect. \"How much is it?\" she asks. \"It's fifty riyals,\" says the shop assistant. It is not cheap, but it is not expensive. Salma pays by card and takes her receipt.",ar:"سلمى في السوق. تريد جاكيت جديداً للشتاء. تجرّب جاكيت أسود، لكنه صغير جداً عليها. تطلب مقاساً كبيراً. الجاكيت الكبير ممتاز. تسأل: «بكم هذا؟» فيقول البائع: «بخمسين ريالاً.» ليس رخيصاً وليس غالياً. تدفع سلمى بالبطاقة وتأخذ الإيصال.",
 q:[["What does Salma want?",["a dress","a jacket","shoes"],1],["What is the problem with the first jacket?",["It is too big.","It is too small.","It is too expensive."],1],["How does Salma pay?",["cash","by card","She doesn't pay."],1]]},
15:{t:"My new apartment",text:"My new apartment is small but clean. There are three rooms: a living room, a bedroom and a kitchen. There is one bathroom. In the living room there is a big sofa and a lamp, but there isn't a TV. There are two windows in my bedroom. The rent is not expensive, and my neighbors are quiet and friendly.",ar:"شقتي الجديدة صغيرة لكنها نظيفة. فيها ثلاث غرف: غرفة معيشة وغرفة نوم ومطبخ. فيها حمّام واحد. في غرفة المعيشة كنبة كبيرة ومصباح، لكن لا يوجد تلفاز. في غرفة نومي نافذتان. الإيجار ليس غالياً، وجيراني هادئون وودودون.",
 q:[["How many rooms are there?",["two","three","four"],1],["Is there a TV in the living room?",["Yes, there is.","No, there isn't.","There are two."],1],["What are the neighbors like?",["noisy","quiet and friendly","lazy"],1]]},
16:{t:"The way to the museum",text:"Excuse me, where is the museum? — Go straight on this street. Turn left at the traffic lights. The museum is next to the library, opposite the big mosque. It is not far. It's about five minutes from here. — Thank you! — You're welcome.",ar:"لو سمحت، أين المتحف؟ — امشِ مستقيماً في هذا الشارع. انعطف يساراً عند إشارة المرور. المتحف بجانب المكتبة، مقابل المسجد الكبير. ليس بعيداً. حوالي خمس دقائق من هنا. — شكراً! — عفواً.",
 q:[["Where do you turn left?",["at the bank","at the traffic lights","at the corner"],1],["What is next to the museum?",["the library","the hospital","the station"],0],["Is the museum far?",["Yes, it is.","No, it isn't.","It's thirty minutes."],1]]},
17:{t:"What can you do?",text:"My name is Faisal. I am ten years old. I can swim and I can ride a bike, but I can't drive a car. My sister Laila can draw very well. She can't sing, but she can dance! My grandfather can't read small letters, so I help him. I read the news to him. Can you play the piano? I can't, but I want to learn.",ar:"اسمي فيصل. عمري عشر سنوات. أستطيع السباحة وركوب الدراجة، لكن لا أستطيع قيادة السيارة. أختي ليلى تستطيع الرسم جيداً جداً. لا تستطيع الغناء، لكنها تستطيع الرقص! جدي لا يستطيع قراءة الحروف الصغيرة، لذلك أساعده وأقرأ له الأخبار. هل تستطيع العزف على البيانو؟ أنا لا أستطيع، لكني أريد أن أتعلم.",
 q:[["What can't Faisal do?",["swim","ride a bike","drive a car"],2],["What can Laila do very well?",["sing","draw","swim"],1],["How does Faisal help his grandfather?",["He drives him.","He reads the news to him.","He cooks for him."],1]]},
18:{t:"A message from the airport",text:"Hi Khaled! I'm at the airport right now. I'm going to Cairo today. It's raining outside, and a lot of people are sitting and waiting. A small boy is crying, and his mother is holding him. His father is talking on the phone. I'm drinking coffee and reading a book. See you tomorrow! Omar",ar:"مرحباً خالد! أنا في المطار الآن. أنا مسافر إلى القاهرة اليوم. إنها تمطر بالخارج، وكثير من الناس جالسون ينتظرون. ولد صغير يبكي، وأمه تحمله. أبوه يتكلم في الهاتف. أنا أشرب قهوة وأقرأ كتاباً. أراك غداً! عمر",
 q:[["Where is Omar now?",["at home","at the airport","at the station"],1],["What is the weather like?",["It's sunny.","It's raining.","It's windy."],1],["What is Omar doing?",["He's crying.","He's drinking coffee and reading.","He's talking on the phone."],1]]},
19:{t:"Weather in two cities",text:"In Riyadh, the summer is very hot and dry. It usually doesn't rain in June or July. Today it is 45 degrees! In London, the weather is different. It often rains in summer. Right now my friend Tom is in London. He is wearing a jacket because it is cool and cloudy. He is sending me photos of the rain!",ar:"في الرياض، الصيف حار جداً وجاف. عادةً لا تمطر في يونيو أو يوليو. اليوم درجة الحرارة 45! في لندن الطقس مختلف. غالباً تمطر في الصيف. الآن صديقي توم في لندن. يرتدي جاكيت لأن الجو بارد قليلاً وغائم. يرسل لي صوراً للمطر!",
 q:[["What is summer like in Riyadh?",["cool and rainy","hot and dry","cold and windy"],1],["What is the temperature in Riyadh today?",["25 degrees","35 degrees","45 degrees"],2],["Why is Tom wearing a jacket?",["It is cool and cloudy.","It is snowing.","It is hot."],0]]},
20:{t:"Meet Dr Rania",text:"Who is Rania? She is a doctor. Where does she work? She works at a hospital in Jeddah. When does she start work? She starts at eight. Why does she love her job? Because she helps people every day. How does she go to work? She drives. Her husband, Majid, is an engineer. He works for a big company.",ar:"من هي رانيا؟ هي طبيبة. أين تعمل؟ تعمل في مستشفى في جدة. متى تبدأ العمل؟ تبدأ الساعة الثامنة. لماذا تحب عملها؟ لأنها تساعد الناس كل يوم. كيف تذهب إلى العمل؟ تقود سيارتها. زوجها ماجد مهندس. يعمل في شركة كبيرة.",
 q:[["Where does Rania work?",["at a school","at a hospital","at a company"],1],["Why does she love her job?",["The salary is good.","She helps people.","It is easy."],1],["What is Majid's job?",["doctor","engineer","driver"],1]]},
22:{t:"A wedding last Friday",text:"Last Friday was my cousin's wedding. It was in a big hotel. The party was great, and the food was delicious. My parents were very happy. My little brother was tired at night. The next day I was sick, so I was at home. I wasn't at work on Saturday.",ar:"الجمعة الماضية كان حفل زفاف ابن عمي. كان في فندق كبير. الحفلة كانت رائعة، والطعام كان لذيذاً. والداي كانا سعيدين جداً. أخي الصغير كان متعباً في الليل. في اليوم التالي كنت مريضاً، لذلك كنت في البيت. لم أكن في العمل يوم السبت.",
 q:[["Where was the wedding?",["at home","in a big hotel","in a park"],1],["How was the party?",["boring","great","bad"],1],["Where was the writer on Saturday?",["at work","at the hotel","at home"],2]]},
23:{t:"Yesterday at home",text:"Yesterday I stayed at home. In the morning I cleaned the kitchen and washed the car. At noon I cooked rice and chicken for my family. In the afternoon my friend Sami called me. We talked for an hour. Then I watched a soccer game on TV. I studied English in the evening and finished my lesson at ten.",ar:"أمس بقيت في البيت. في الصباح نظّفت المطبخ وغسلت السيارة. عند الظهر طبخت أرزاً ودجاجاً لعائلتي. في العصر اتصل بي صديقي سامي وتكلمنا لمدة ساعة. ثم شاهدت مباراة كرة قدم على التلفاز. درست الإنجليزية في المساء وأنهيت درسي الساعة العاشرة.",
 q:[["Where did the writer stay yesterday?",["at work","at home","at a friend's house"],1],["What did the writer cook?",["fish","rice and chicken","soup"],1],["Who called the writer?",["his brother","his friend Sami","his teacher"],1]]},
24:{t:"A trip to Dubai",text:"Last month I went to Dubai with my wife. We flew from Cairo, and the trip took three hours. We stayed in a small hotel near the beach. We ate fish every day and drank a lot of juice. We saw many very tall buildings. I bought a watch for my father. On the last day I lost my wallet, but a man found it and gave it back to me!",ar:"الشهر الماضي ذهبت إلى دبي مع زوجتي. سافرنا بالطائرة من القاهرة، واستغرقت الرحلة ثلاث ساعات. أقمنا في فندق صغير قرب الشاطئ. أكلنا السمك كل يوم وشربنا الكثير من العصير. رأينا مباني عالية جداً. اشتريت ساعة لأبي. في اليوم الأخير فقدت محفظتي، لكن رجلاً وجدها وأعادها إليّ!",
 q:[["How did they travel to Dubai?",["by car","by plane","by bus"],1],["What did the writer buy for his father?",["a watch","a wallet","a shirt"],0],["What happened to the wallet?",["He never found it.","A man found it and gave it back.","His wife took it."],1]]},
25:{t:"Adel's plans",text:"Next year is going to be a big year for Adel. He is going to finish university in June. Then he is going to look for a job in a bank. He is also going to save money because he wants to get married. In the summer he is going to travel abroad with his brother. He hopes to visit Turkey.",ar:"العام القادم سيكون عاماً مهماً لعادل. سينهي الجامعة في يونيو. ثم سيبحث عن عمل في بنك. وسيدّخر المال أيضاً لأنه يريد أن يتزوج. في الصيف سيسافر إلى الخارج مع أخيه. يتمنى أن يزور تركيا.",
 q:[["When is Adel going to finish university?",["in January","in June","next month"],1],["Where does he want to work?",["in a hospital","in a bank","in a school"],1],["Why is he going to save money?",["to buy a car","to get married","to study abroad"],1]]},
26:{t:"At the doctor's",text:"Doctor: Hello, Mr Nasser. What's the problem? — Nasser: I don't feel well. I have a headache and a bad cough, and my back hurts. — Doctor: Do you have a fever? — Nasser: Yes, a little. — Doctor: You have a cold. Take this medicine three times a day and rest at home for two days. Drink a lot of water. — Nasser: Thank you, doctor.",ar:"الطبيب: مرحباً يا سيد ناصر. ما المشكلة؟ — ناصر: لا أشعر أنني بخير. عندي صداع وسعال شديد، وظهري يؤلمني. — الطبيب: هل عندك حمّى؟ — ناصر: نعم، قليلاً. — الطبيب: عندك زكام. خذ هذا الدواء ثلاث مرات في اليوم واسترح في البيت يومين. اشرب الكثير من الماء. — ناصر: شكراً يا دكتور.",
 q:[["What is wrong with Nasser?",["He has a headache and a cough.","His leg hurts.","He has a toothache."],0],["What does the doctor say he has?",["a broken arm","a cold","nothing"],1],["How often must he take the medicine?",["once a day","twice a day","three times a day"],2]]},
27:{t:"Two friends",text:"Laila and Dina are friends, but they are different. Laila is friendly, and she enjoys meeting new people. She likes going to parties. Dina is shy. She prefers staying at home and reading. But they both love cooking, so they often cook together. Dina wants to learn English, and Laila helps her. Laila also likes Dina's family very much.",ar:"ليلى ودينا صديقتان، لكنهما مختلفتان. ليلى ودودة وتستمتع بالتعرف على أشخاص جدد. تحب الذهاب إلى الحفلات. دينا خجولة. تفضّل البقاء في البيت والقراءة. لكن الاثنتين تحبان الطبخ، لذلك غالباً تطبخان معاً. دينا تريد أن تتعلم الإنجليزية، وليلى تساعدها. وليلى تحب عائلة دينا كثيراً.",
 q:[["What does Laila enjoy?",["staying at home","meeting new people","reading"],1],["What is Dina like?",["shy","lazy","angry"],0],["What do they often do together?",["go to parties","cook","travel"],1]]}

const NUMW = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const CONTR = {"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","don't":"do not","doesn't":"does not","can't":"cannot","isn't":"is not","aren't":"are not","what's":"what is","i'd":"i would","didn't":"did not","wasn't":"was not","weren't":"were not","that's":"that is","there's":"there is","where's":"where is","i'll":"i will","let's":"let us","how's":"how is","im":"i am","dont":"do not","doesnt":"does not","cant":"cannot","isnt":"is not","arent":"are not","didnt":"did not","whats":"what is","youre":"you are","theyre":"they are","wasnt":"was not","werent":"were not"};
function toks(s) {
  s = String(s).toLowerCase().replace(/[’‘`]/g, "'");
  s = s.replace(/[a-z']+/g, w => CONTR[w] || w).replace(/can not/g, "cannot");
  return s.replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean).map(w => /^\d+$/.test(w) && +w <= 20 ? NUMW[+w] : w.replace(/'/g, ""));
}
function compare(target, said) {

  const m = a.length, n = b.length, L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);

  while (i < m && j < n) { if (a[i] === b[j]) { hits[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }

}

function allWords() { const m = {}; learnDays().forEach(d => wordsOf(d).forEach(w => m[w.key] = w)); return m; }

function mcVocab(w, pool, dir) {

  const opts = shuffle([w, ...others]);
  return dir === "en"
    ? { type: "mc", skill: "vocab", prompt: "ما معنى هذه الكلمة؟", main: w.en, audio: w.en, opts: opts.map(o => o.ar), ans: opts.indexOf(w), wkey: w.key, reveal: w.en + " = " + w.ar }

}
function mcGrammar(g) { return { type: "mc", skill: "grammar", prompt: "اختر الإجابة الصحيحة", main: g[0], opts: g[1], en: true, ans: g[2], reveal: g[0].replace("___", g[1][g[2]]) }; }
function mcListen(p, pool) {
  const others = pick(pool.filter(x => x.en !== p.en), 3), opts = shuffle([p, ...others]);
  return { type: "mc", skill: "listening", prompt: "استمع (بدون قراءة) واختر المعنى", hidden: true, audio: p.en, opts: opts.map(o => o.ar), ans: opts.indexOf(p), reveal: p.en };

const qType = p => ({ type: "type", skill: "listening", prompt: "استمع واكتب ما تسمعه بالإنجليزية", audio: p.en, target: p.en, ar: p.ar });
const qSpeak = p => ({ type: "speak", skill: "speaking", prompt: "انطق هذه الجملة في ميكروفون الكيبورد", target: p.en, ar: p.ar });
const qRead = (r, q) => ({ type: "mc", skill: "reading", prompt: "اقرأ النص وأجب", passage: r, main: q[0], opts: q[1], en: true, ans: q[2], reveal: q[1][q[2]] });

function buildQuiz(key) {
  let Q = [];
  if (key[0] === "d") {
    const d = +key.slice(1), W = wordsOf(d), P = phrasesOf(d);
    const poolW = learnDays(1, d).flatMap(wordsOf), poolP = learnDays(1, d).flatMap(phrasesOf);
    const ws = pick(W, 6);
    ws.slice(0, 4).forEach(w => Q.push(mcVocab(w, poolW, "en")));
    ws.slice(4).forEach(w => Q.push(mcVocab(w, poolW, "ar")));
    DAYS[d].gq.forEach(g => Q.push(mcGrammar(g)));
    const ps = pick(P, 4);
    if (DAYS[d].rd) { const R = DAYS[d].rd; Q.push(qRead({ title: R.t, text: R.text }, R.q[Math.floor(Math.random() * R.q.length)])); }
    Q.push(mcListen(ps[0], poolP), mcListen(ps[1], poolP), qType(ps[2]), qSpeak(ps[3]));
    if (d > 2) { const old = learnDays(1, d - 1); const od = old[Math.floor(Math.random() * old.length)]; Q.splice(6, 0, mcVocab(pick(wordsOf(od), 1)[0], poolW, "en")); }
    return { key, title: "اختبار اليوم " + d, pass: PASS.learn, qs: Q };
  }
  if (key[0] === "w") {
    const w = +key.slice(1), days = weekDays(w), W = days.flatMap(wordsOf), P = days.flatMap(phrasesOf);
    const poolW = learnDays(1, w * 7).flatMap(wordsOf), poolP = learnDays(1, w * 7).flatMap(phrasesOf);
    const ws = pick(W, 10);
    ws.slice(0, 6).forEach(x => Q.push(mcVocab(x, poolW, "en"))); ws.slice(6).forEach(x => Q.push(mcVocab(x, poolW, "ar")));
    pick(days.flatMap(d => DAYS[d].gq), 7).forEach(g => Q.push(mcGrammar(g)));
    const ps = pick(P, 7);
    Q.push(mcListen(ps[0], poolP), mcListen(ps[1], poolP), mcListen(ps[2], poolP), qType(ps[3]), qType(ps[4]));
    READING[w].q.forEach(q => Q.push(qRead(READING[w], q)));
    Q.push(qSpeak(ps[5]), qSpeak(ps[6]));
    return { key, title: "اختبار الأسبوع " + w, pass: PASS.review, qs: Q };
  }
  const all = learnDays(), W = all.flatMap(wordsOf), P = all.flatMap(phrasesOf), G = all.flatMap(d => DAYS[d].gq);
  const final = key === "final";
  const ws = pick(W, final ? 12 : 10);
  ws.forEach((x, i) => Q.push(mcVocab(x, W, i % 3 === 2 ? "ar" : "en")));
  pick(G, final ? 12 : 10).forEach(g => Q.push(mcGrammar(g)));
  const ps = pick(P, final ? 16 : 13);
  let i = 0;
  for (let k = 0; k < (final ? 6 : 5); k++) Q.push(mcListen(ps[i++], P));
  for (let k = 0; k < 3; k++) Q.push(qType(ps[i++]));
  const R = final ? READING[5] : READING[Math.random() < .5 ? 3 : 4];
  R.q.forEach(q => Q.push(qRead(R, q)));
  for (let k = 0; k < (final ? 5 : 4); k++) Q.push(qSpeak(ps[i++]));
  Q.push({ type: "write", skill: "writing", prompt: final ? "اكتب 6 إلى 8 جمل عن نفسك: اسمك ومن أين أنت، عائلتك، يومك المعتاد، ماذا فعلت في آخر عطلة، وماذا ستفعل الأسبوع القادم." : "اكتب 5 إلى 6 جمل: عرّف بنفسك، وصف يومك، وماذا فعلت أمس.", weight: 6 });
  return { key, title: final ? "الاختبار النهائي A1" : "الاختبار التجريبي", pass: final ? PASS.final : PASS.mock, perSkill: final, qs: Q };
}

function startQuiz(key) {

function recordAnswer(pts, max, extra = {}) {
  const Z = UI.quiz, q = Z.qs[Z.i];
  Z.answers[Z.i] = Object.assign({ pts, max, skill: q.skill }, extra);
  if (q.wkey && S.srs[q.wkey] && pts < max) S.srs[q.wkey] = [0, Date.now()];

function finishQuiz() {
  const Z = UI.quiz, by = {};
  let got = 0, max = 0;
  Z.answers.forEach(a => { if (!a || a.skip) return; got += a.pts; max += a.max; by[a.skill] = by[a.skill] || [0, 0]; by[a.skill][0] += a.pts; by[a.skill][1] += a.max; });
  const pct = max ? Math.round(100 * got / max) : 0;
  const skills = {}; Object.keys(by).forEach(k => skills[k] = Math.round(100 * by[k][0] / by[k][1]));
  const skippedSpeak = Z.answers.some(a => a && a.skip);
  let passed = Z.perSkill ? Object.values(skills).every(v => v >= Z.pass) && pct >= Z.pass && !skippedSpeak : pct >= Z.pass;
  const prev = S.tests[Z.key] || { best: 0, n: 0 };
  S.tests[Z.key] = { best: Math.max(prev.best || 0, pct), last: pct, n: (prev.n || 0) + 1, at: Date.now(), skills, passed: prev.passed || passed };
  Z.result = { pct, skills, passed, skippedSpeak };
  // unlocks
  const dayOf = Object.keys(DAYS).map(Number).find(d => testKey(d) === Z.key);
  if (passed && dayOf) {
    markDone(dayOf, "quiz"); S.lastPass = todayKey();
    if (dayOf < 30 && S.unlocked <= dayOf) S.unlocked = dayOf + 1;
    if (dayOf === 30) S.finished = true;
  }
  logActivity(); ensureCards(); save(false);
  UI.view = "quizResult"; render(); window.scrollTo(0, 0);
}

async function aiText(turns, json) {
  const merged = [];
  turns.forEach(t => { const last = merged[merged.length - 1]; if (last && last.role === t.role && !t.audio && !last.audio) last.text += "\n\n" + t.text; else merged.push(Object.assign({}, t)); });
  const j = await api("ai", { turns: merged, json: !!json });
  if (!j.ok) throw j;
  return j.text;
}

}

async function plRun() {
  const tok = ++PL.tok;
  try { if (navigator.wakeLock && !PL.lock) navigator.wakeLock.request("screen").then(l => { PL.lock = l; }).catch(() => {}); } catch (e) {}
  while (PL.on && tok === PL.tok) {
    if (PL.i >= PL.items.length) { if (UI.plLoop !== false) PL.i = 0; else { PL.on = false; break; } }
    const it = PL.items[PL.i];
    if (UI.view === "listen") render();
    await say(it.en); if (tok !== PL.tok) return;
    if (UI.plShadow !== false) { await wait(900 + it.en.length * 55); if (tok !== PL.tok) return; }
    if (UI.plAr && it.ar && TTS.ar) { await say(it.ar, { lang: "ar" }); if (tok !== PL.tok) return; await wait(400); }
    await wait(500); if (tok !== PL.tok) return;
    PL.i++;
  }
  try { PL.lock && PL.lock.release(); } catch (e) {} PL.lock = null;
  if (UI.view === "listen") render();
}
function plStart(items, from = 0) { hush(); PL.items = items; PL.i = from; PL.on = true; logActivity(); save(false); plRun(); }
function plStop() { PL.on = false; PL.tok++; hush(); }

      </div>
      <div class="row"><span>سرعة النطق</span><select id="rate2" data-act="rate">${[0.6, 0.75, 0.85, 1].map(r => `<option value="${r}" ${S.rate == r ? "selected" : ""}>${r}</option>`).join("")}</select><button class="btn" data-act="say" data-t="Hello! This is my voice. Can you hear me?">جرّب الصوت</button></div>
      <div class="tiny">صوت النطق: ${TTS.en ? esc(TTS.en.name) : "الافتراضي"}. لصوت أوضح استخدم Chrome أو Edge أو Safari.</div>
      <div class="row">${AUTH ? `<button class="btn ghost" data-act="logout">تسجيل الخروج من هذا الجهاز</button>` : `<button class="btn pri" data-act="view" data-v="login">سجّل الدخول لحفظ تقدمك على إيميلك</button>`}</div>
      ${UI.confirmReset ? `<div class="fb bad stack" style="gap:8px"><b>سيُحذف كل تقدمك نهائياً من كل أجهزتك.</b><div class="row"><button class="btn" data-act="reset" data-y="1" style="border-color:var(--bad);color:var(--bad)">نعم، ابدأ من جديد</button><button class="btn ghost" data-act="reset" data-y="0">إلغاء</button></div></div>` : `<button class="btn ghost" data-act="reset" style="align-self:flex-start;color:var(--bad)">ابدأ المسار من جديد</button>`}
    </section>
  </div>`;
}

function vGuide() {
  return `<div class="stack">

      <p class="muted" style="margin:0">المستوى A1 حسب الإطار الأوروبي (CEFR) يعني أنك تفهم وتستخدم عبارات يومية بسيطة، تعرّف بنفسك وتسأل وتجيب عن معلومات شخصية، وتتفاهم مع شخص يتكلم ببطء. المسار يغطي هذا بالكامل في 30 يوماً: 24 يوم تعلم (حوالي 480 كلمة و150 جملة جاهزة و24 قاعدة)، و4 أيام مراجعة واختبار أسبوعي، ويوم اختبار تجريبي، ويوم اختبار نهائي.</p>
      <div class="fb info small"><b>بصراحة عن «الضمان»:</b> تقدّر كامبريدج أن A1 يحتاج حوالي 90 إلى 100 ساعة تعلم موجّه. في 30 يوماً هذا يعني بمعدل ساعتين يومياً تقريباً، بين تركيز واستماع في الخلفية. لذلك الضمان مبني على قاعدتين: <b>لا تنتقل ليوم جديد إلا بعد نجاحك في اختبار اليوم</b>، و<b>النجاح في الاختبار النهائي يشترط 70% في كل مهارة على حدة</b>. إن كانت أيامك كلها «مشغول» فستصل أيضاً، لكن في مدة أطول من شهر. اجعل 4 أيام في الأسبوع على الأقل «عادي» أو «متفرغ».</div>
    </section>
    <section class="card stack">
      <h2>ماذا تفعل بكل شيء؟ (الوسوم)</h2>
      <div class="legend">${Object.entries(TAGS).map(([k, t]) => `<div class="item"><span>${tagHTML(k)}</span><span class="small">${esc(t.d)}</span></div>`).join("")}</div>
    </section>
    <section class="card stack">
      <h2>الأوضاع الثلاثة</h2>
      ${Object.entries(MODES).map(([k, m]) => `<div class="res"><div><b>${m.ar}</b> <span class="tiny num">~${m.min} دقيقة</span><div class="small muted">${esc(m.d)}</div></div></div>`).join("")}
      <div class="small">وفي كل الأوضاع: مهام «في الخلفية» تشغّلها أثناء القيادة أو الطبخ أو المشي، فلا تأخذ من وقتك شيئاً.</div>
    </section>
    <section class="card stack">
      <h2>يوم نموذجي لشخص مشغول</h2>
      <div class="ex" style="grid-template-columns:90px 1fr"><b class="small">الصباح</b><span class="small">في الطريق للعمل: حلقة VOA أو البودكاست في الخلفية (15 د).</span></div>
      <div class="ex" style="grid-template-columns:90px 1fr"><b class="small">الاستراحة</b><span class="small">البطاقات (10 د) من الجوال.</span></div>
      <div class="ex" style="grid-template-columns:90px 1fr"><b class="small">المساء</b><span class="small">القاعدة + الجمل + الحوار + الاختبار بتركيز (30-40 د).</span></div>
      <div class="ex" style="grid-template-columns:90px 1fr"><b class="small">قبل النوم</b><span class="small">مشغّل الاستماع بكلمات اليوم (10 د) مع التكرار الخافت.</span></div>
    </section>
    <section class="card stack">
      <h2>الصوت والنطق</h2>
      <div class="small">${dictHelp()}</div>
      <div class="small"><b>ثلاث طرق لقياس نطقك:</b> (1) «اضغط وتكلم»: يحوّل كلامك لنص ويقارنه بالجملة الصحيحة فوراً. (2) «سجّل صوتك وقارن»: تسمع صوتك وبجانبه النطق الصحيح. (3) «حلّل نطقي بالذكاء الاصطناعي»: Gemini يسمع التسجيل ويقول لك أي كلمة نطقتها خطأ وكيف تصلحها بالعربي.</div>
      <div class="small"><b>إن رفض المتصفح الميكروفون:</b> اضغط أيقونة القفل بجانب رابط الموقع، واختر «السماح» للميكروفون، ثم أعد تحميل الصفحة.</div>

      <div class="res"><div><b class="en">EF SET 50</b><div class="small muted">قراءة واستماع مع شهادة مجانية</div></div><a class="btn ext" href="${RES.ef50}" target="_blank" rel="noopener">افتح</a></div>
      <div class="res"><div><b class="en">Cambridge — Test your English</b><div class="small muted">اختبار سريع مجاني</div></div><a class="btn ext" href="${RES.cambridgeTest}" target="_blank" rel="noopener">افتح</a></div>
      <div class="res"><div><b class="en">Oxford 3000 word list</b><div class="small muted">قائمة أكسفورد، صفّها على مستوى A1 لترى الكلمات الأساسية</div></div><a class="btn ext" href="${RES.oxford3000}" target="_blank" rel="noopener">افتح</a></div>
    </section>
    <section class="card small muted">تقدّمك وتسجيلاتك تُحفظ في Google Drive على إيميلك (مجلد «مسار A1 — بياناتي»). افتح نفس الرابط من أي جهاز وادخل بإيميلك ورمزك لتكمل من حيث وقفت. التذكير اليومي والتقرير الأسبوعي يصلانك على نفس الإيميل.</section>
  </div>`;
}

function vQuiz() {
  const Z = UI.quiz, q = Z.qs[Z.i], a = Z.answers[Z.i], n = Z.qs.length;
  let body = "";
  if (q.passage && Z.showPassage !== Z.i) body += `<details open class="passage en"><summary style="font-family:var(--f-ar);direction:rtl;text-align:right">${esc(q.passage.title)} — النص</summary><div style="margin-top:6px">${esc(q.passage.text)}</div><div class="row" style="margin-top:6px">${spk(q.passage.text)}<span class="tiny" style="font-family:var(--f-ar)">اقرأ أولاً، الصوت اختياري</span></div></details>`;
  body += `<div class="qprompt">${esc(q.prompt)} <span class="tag min">${SKILL_AR[q.skill]}</span></div>`;
  if (q.type === "mc") {
    if (q.hidden) body += `<div class="row" style="justify-content:center;margin:10px 0 16px">${spk(q.audio, "lg")}<button class="btn ghost small" data-act="sayslow" data-t="${esc(q.audio)}">أبطأ</button></div>`;
    else if (q.main) body += `<div class="qmain">${q.audio ? spk(q.audio) : ""}<span>${esc(q.main)}</span></div>`;
    body += `<div class="opts">${q.opts.map((o, i) => { let c = ""; if (a) { if (i === q.ans) c = "right"; else if (i === a.choice) c = "wrong"; } return `<button class="opt ${q.en ? "en" : ""} ${c}" data-act="qpick" data-i="${i}" ${a ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>`;
    if (a) body += `<div class="fb ${a.pts ? "ok" : "bad"}" style="margin-top:12px"><b>${a.pts ? "صحيح" : "خطأ"}</b>${q.reveal ? ` <span class="en">— ${esc(q.reveal)}</span>` : ""}${q.hidden || q.skill === "grammar" ? ` ${spk(q.reveal)}` : ""}</div>`;
  } else if (q.type === "type") {
    body += `<div class="row" style="justify-content:center;margin:10px 0 16px">${spk(q.audio, "lg")}<button class="btn ghost small" data-act="sayslow" data-t="${esc(q.audio)}">أبطأ</button></div>
      <input type="text" id="q-in" class="en" dir="ltr" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type what you hear…" ${a ? "disabled" : ""} value="${esc(a ? a.said : "")}">`;
    if (a) body += `<div class="fb ${a.pts ? "ok" : "bad"}" style="margin-top:12px"><b class="num">${a.score}%</b> ${a.pts ? "صحيح" : "راجع الكلمات الحمراء"}${diffHTML(compare(q.target, a.said))}<div class="small">${esc(q.ar)}</div></div>`;
  } else if (q.type === "speak") {
    body += `<div class="qmain" style="font-size:20px">${spk(q.target)}<span>${esc(q.target)}</span></div><div class="small muted" style="margin:-8px 0 12px">${esc(q.ar)}</div>
      ${a ? "" : `<div class="row">${micBtn("quiz", "اضغط وقل الجملة")}</div>`}
      ${SR ? "" : `<textarea id="q-in" class="en" rows="2" dir="ltr" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="اضغط هنا ثم ميكروفون الكيبورد…" ${a ? "disabled" : ""}>${esc(a ? a.said || "" : "")}</textarea>
      <div class="tiny" style="margin-top:6px">لغة الكيبورد يجب أن تكون English. لا تكتب بيدك، فالهدف قياس النطق.</div>`}`;
    if (a) body += a.skip ? `<div class="fb warn" style="margin-top:12px">تم التخطي. لن يُحسب هذا السؤال${Z.perSkill ? "، لكن الاختبار النهائي يتطلب التحدث" : ""}.</div>` : `<div class="fb ${a.pts ? "ok" : "bad"}" style="margin-top:12px"><b class="num">وضوح: ${a.score}%</b>${diffHTML(compare(q.target, a.said))}<div class="tiny">سمعتك تقول: <span class="en">${esc(a.said)}</span></div></div>`;
  } else if (q.type === "write") {
    const ws = Z.ws || {};
    body += `<p style="margin:0 0 10px"><b>${esc(q.prompt)}</b></p><textarea id="q-in" class="en" rows="7" dir="ltr" placeholder="Write here…" ${a ? "disabled" : ""}>${esc(ws.text || "")}</textarea>`;
    if (!a && ws.self) body += `<div class="fb info stack" style="gap:6px;margin-top:10px"><b>قيّم نفسك بصدق:</b>${SELF_CHECK.map((c, i) => `<label class="ck"><input type="checkbox" id="qsc-${i}"> ${c}</label>`).join("")}<button class="btn pri" data-act="qselfdone" style="align-self:flex-start">اعتمد التقييم</button></div>`;
    if (ws.err) body += `<div class="fb warn small" style="margin-top:10px">${esc(ws.err)}</div>`;
    if (a && ws.res) body += `<div style="margin-top:10px">${writeResultHTML(ws.res)}</div>`;
    if (a && !ws.res) body += `<div class="fb info" style="margin-top:10px">تقييم ذاتي: <span class="num">${a.pts}/${a.max}</span></div>`;
  }
  let foot = "";
  if (!a) {
    if (q.type === "type") foot = `<button class="btn pri lg" data-act="qcheck">تحقق</button>`;
    if (q.type === "speak") foot = `${SR ? "" : `<button class="btn pri lg" data-act="qcheck">تحقق</button>`}<button class="btn ghost" data-act="qskip">لا أستطيع التحدث الآن</button>`;
    if (q.type === "write") foot = store.ai ? `<button class="btn pri lg" data-act="qwrite" ${(Z.ws || {}).busy ? "disabled" : ""}>${(Z.ws || {}).busy ? "يصحّح…" : "سلّم للتصحيح"}</button><button class="btn ghost" data-act="qselfw">تقييم ذاتي</button>` : `<button class="btn pri lg" data-act="qselfw">تقييم ذاتي</button>`;
  } else foot = `<button class="btn pri lg" data-act="qnext">${Z.i + 1 < n ? "التالي" : "النتيجة"}</button>`;
  return `<div class="qwrap stack">
    <div class="qhead"><button class="btn ghost" data-act="qexit">خروج</button><div class="grow"><div class="bar"><b style="width:${Math.round(100 * Z.i / n)}%"></b></div></div><span class="tiny num">${Z.i + 1}/${n}</span></div>
    <h2>${esc(Z.title)}</h2>
    <section class="card lift qbody">${body}</section>
    <div class="row">${foot}</div>
  </div>`;
}
function vQuizResult() {
  const Z = UI.quiz, R = Z.result;
  const wrong = Z.qs.map((q, i) => [q, Z.answers[i]]).filter(([q, a]) => a && !a.skip && a.pts < a.max && q.type !== "write");
  const dayOf = Object.keys(DAYS).map(Number).find(d => testKey(d) === Z.key);
  return `<div class="qwrap stack">
    <section class="card lift stack" style="align-items:center;text-align:center">
      <div class="eyebrow">${esc(Z.title)}</div>
      <div class="big-score" style="color:${R.passed ? "var(--ok)" : "var(--ink)"}">${R.pct}%</div>
      <div class="fb ${R.passed ? "ok" : "warn"}" style="width:100%">${R.passed ? (Z.key === "final" ? "<b>مبروك! وصلت إلى مستوى A1.</b> ثبّت النتيجة باختبار EF SET الخارجي." : "<b>نجحت!</b> " + (dayOf && dayOf < 30 ? "اليوم " + (dayOf + 1) + " مفتوح الآن." : "")) : `<b>لم تصل بعد إلى ${Z.pass}%${Z.perSkill ? " في كل مهارة" : ""}.</b> راجع الأخطاء أدناه ثم أعد، فالأسئلة تتغير كل مرة.${R.skippedSpeak && Z.perSkill ? " (تخطيت أسئلة التحدث، وهي مطلوبة هنا)" : ""}`}</div>
    </section>
    <section class="card stack">${Object.entries(R.skills).map(([k, v]) => `<div class="skill"><span>${SKILL_AR[k]}</span><div class="bar ${v >= Z.pass ? "ok" : ""}"><b style="width:${v}%"></b></div><span class="num tiny">${v}%</span></div>`).join("")}</section>
    ${wrong.length ? `<section class="card stack"><h3>راجع هذه (أُعيدت الكلمات الخاطئة إلى بطاقاتك)</h3>${wrong.map(([q]) => { const t = q.reveal || q.target || ""; return `<div class="ex">${spk(t)}<div><div class="en">${esc(t)}</div>${q.ar ? `<div class="ar">${esc(q.ar)}</div>` : ""}</div></div>`; }).join("")}</section>` : ""}
    <div class="row"><button class="btn pri lg" data-act="quiz" data-k="${Z.key}">أعد الاختبار</button><button class="btn lg" data-act="qdone">${R.passed && dayOf && dayOf < 30 ? "إلى اليوم " + (dayOf + 1) : "رجوع"}</button></div>
  </div>`;
}
function vChat() {
  const C = UI.chat;
  return `<div class="stack">
    <div class="row between"><button class="btn ghost" data-act="chatExit">رجوع</button><span class="tiny">اليوم ${C.day} · ${esc(DAYS[C.day].topic)}</span></div>
    <div class="how small">${tagHTML("rep")} تكلم بالزر الأصفر أو اكتب ردك بالإنجليزية. الشريك يرد بصوت، والتصحيح يظهر تحت رده باللون البرتقالي.</div>
    <div class="chat" id="chatlog">
      ${C.msgs.map(m => { if (m.role === "user") return `<div class="msg me en">${esc(m.content)}</div>`; const [reply, corr] = m.content.split(/\n?\s*Correction:\s*/); return `<div class="msg ai en"><div class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start">${spk(reply)}<div>${esc(reply)}</div></div>${corr ? `<div class="corr"><b>تصحيح:</b> <span class="en" style="display:inline">${esc(corr)}</span></div>` : ""}</div>`; }).join("")}
      ${C.busy ? `<div class="msg ai small muted">${C.stream ? esc(C.stream) : "يفكر…"}</div>` : ""}
      ${C.err ? `<div class="fb warn small">${esc(C.err)}</div>` : ""}
    </div>
    ${store.ai ? `${C.msgs.length && !C.busy ? `<div class="row">${micBtn("chat", "اضغط وتكلم")}</div>` : ""}<textarea id="chat-in" class="en" rows="2" dir="ltr" placeholder="Type or dictate your answer…" ${C.busy ? "disabled" : ""}></textarea>
    <div class="row"><button class="btn pri" data-act="chatSend" ${C.busy ? "disabled" : ""}>${C.msgs.length ? "أرسل" : "ابدأ"}</button><span class="tiny num">ردودك: ${C.msgs.filter(m => m.role === "user").length}</span></div>`
    : `<div class="fb warn">المحادثة تحتاج تفعيل Gemini المجاني (خطوة واحدة). <button class="btn small" data-act="go" data-go="progress#settings">افتح الإعدادات</button></div>`}
  </div>`;
}

    </section>
  </div>`;
}
function render() {
  if (!AUTH && UI.view !== "login") UI.view = "login";
  const views = { login: vLogin, today: vToday, lesson: vLesson, cards: vCards, listen: vListen, progress: vProgress, guide: vGuide, quiz: vQuiz, quizResult: vQuizResult, chat: vChat };
  const keep = document.activeElement && document.activeElement.id;
  const drill = $("#drill-in") && $("#drill-in").value, wr = $("#write-in") && $("#write-in").value, qi = $("#q-in") && $("#q-in").value, ci = $("#chat-in") && $("#chat-in").value;
  document.getElementById("app").innerHTML = header() + guideBar() + `<main><div class="wrap">${views[UI.view]()}</div></main>` + (["quiz", "quizResult", "chat", "login"].includes(UI.view) ? "" : nav()) + (UI.toast ? `<div class="toast" role="status">${esc(UI.toast)}</div>` : "");
  setSync(store.kind);
  if (drill && $("#drill-in") && !UI.clearDrill) $("#drill-in").value = drill; UI.clearDrill = false;
  if (wr && $("#write-in") && !(UI.write && UI.write.text)) $("#write-in").value = wr;
  if (qi && $("#q-in") && !$("#q-in").disabled && !$("#q-in").value) $("#q-in").value = qi;
  if (ci && $("#chat-in") && !UI.clearChat) $("#chat-in").value = ci; UI.clearChat = false;
  if (keep && document.getElementById(keep)) { try { document.getElementById(keep).focus({ preventScroll: true }); } catch (e) {} }
  if (UI.view === "chat") { const l = $("#chatlog"); if (l) l.lastElementChild && l.lastElementChild.scrollIntoView({ block: "nearest" }); }
}
function toast(t) { UI.toast = t; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { UI.toast = null; render(); }, 2200); }
function go(target) {
  const [v, anchor] = target.split("#");
  UI.view = v; render();
  if (anchor) setTimeout(() => { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
  else window.scrollTo(0, 0);
}

// ---------- actions ----------
const A = {
  view: b => { UI.card = UI.card && !UI.card.done ? UI.card : null; go(b.dataset.v); },
  go: b => go(b.dataset.go),
  day: b => { const d = +b.dataset.d; if (d < 1 || d > S.unlocked) return; UI.day = d; UI.drill = null; UI.write = null; if (UI.view === "progress" || UI.view === "guide") UI.view = "today"; render(); window.scrollTo(0, 0); },
  mode: b => { S.mode = b.dataset.m; save(); },
  gdone: b => {
    const d = +b.dataset.d; markDone(d, b.dataset.id); logActivity();
    const n = currentStep(d).t;
    if (b.dataset.back) UI.view = "today";
    save(); if (UI.view === "today") window.scrollTo(0, 0);
    toast(n ? "ممتاز! الخطوة التالية: " + n.t : "أنهيت خطوات اليوم!");
  },
  toggle: b => { const d = +b.dataset.d, id = b.dataset.id; markDone(d, id, !isDone(d, id)); if (isDone(d, id)) logActivity(); save(); },
  linkdone: b => { const d = +b.dataset.d, id = b.dataset.id; if (!isDone(d, id)) { markDone(d, id); logActivity(); setTimeout(() => save(), 200); } return "follow"; },
  say: b => { hush(); say(b.dataset.t); },
  sayslow: b => { hush(); say(b.dataset.t, { rate: 0.6 }); },
  quiz: b => startQuiz(b.dataset.k),
  toggleAr: () => { UI.showAr = !UI.showAr; render(); },
  rdpick: b => { const d = UI.day; if (!UI.rd || UI.rd.d !== d) UI.rd = { d, a: {}, ar: false }; UI.rd.a[+b.dataset.q] = +b.dataset.i; render(); },
  rdAr: () => { const d = UI.day; if (!UI.rd || UI.rd.d !== d) UI.rd = { d, a: {}, ar: false }; UI.rd.ar = !UI.rd.ar; render(); },
  playlist: b => { UI.listenSrc = b.dataset.src; plStart(listenItems(b.dataset.src)); go("listen"); },
  lsrc: b => { UI.listenSrc = b.dataset.v; const was = PL.on; plStop(); PL.items = listenItems(UI.listenSrc); PL.i = 0; if (was) plStart(PL.items); else render(); },
  plToggle: () => { if (PL.on) { plStop(); render(); } else { if (!PL.items.length) PL.items = listenItems(UI.listenSrc); plStart(PL.items, PL.i < PL.items.length ? PL.i : 0); markDone(UI.day, DAYS[UI.day].kind === "learn" ? "bgself" : DAYS[UI.day].kind === "review" ? "bgweek" : "bgall"); save(false); render(); } },
  plNext: () => { if (!PL.items.length) return; PL.i = Math.min(PL.i + 1, PL.items.length - 1); if (PL.on) { hush(); plRun(); } else render(); },
  plPrev: () => { if (!PL.items.length) return; PL.i = Math.max(PL.i - 1, 0); if (PL.on) { hush(); plRun(); } else render(); },
  cardDir: b => { S.cardDir = b.dataset.v; save(); },
  cardStart: () => { const q = dueList().slice(0, 25); UI.card = { q, ok: 0, seen: 0, again: {}, done: false }; UI.flipped = false; render(); if (S.cardDir === "en" && q.length) say(WORDS[q[0]].en); },
  flip: () => { if (!UI.card || UI.card.done) return; UI.flipped = !UI.flipped; render(); if (UI.flipped && S.cardDir === "ar") say(WORDS[UI.card.q[0]].en); },
  cardGrade: b => {
    const C = UI.card, k = C.q.shift(), ok = b.dataset.ok === "1";
    C.seen++; if (ok) C.ok++;
    grade(k, ok);
    if (!ok && !C.again[k]) { C.again[k] = 1; C.q.push(k); }
    UI.flipped = false; logActivity();
    if (!C.q.length) { C.done = true; const d = UI.day; if (DAYS[d].kind !== "learn" || wordsOf(d).every(w => (S.srs[w.key] || [0])[0] >= 1)) markDone(d, "words"); }
    save(); if (!C.done && S.cardDir === "en") say(WORDS[C.q[0]].en);
  },
  cardEnd: () => { UI.card.done = true; save(); },
  drillCheck: (b, alts) => {
    const d = +(b ? b.dataset.d : UI.day), P = phrasesOf(d), cur = UI.drill && UI.drill.d === d ? UI.drill : { d, i: 0, wins: 0 };
    const target = P[cur.i % P.length].en;
    const list = alts || [($("#drill-in") || {}).value || ""];
    if (!list.join("").trim()) { toast("لم أسمع شيئاً. اضغط الزر وتكلم بوضوح."); return; }
    const r = bestOf(target, list);
    UI.drill = { d, i: cur.i, r, wins: (cur.wins || 0) + (r.score >= 80 ? 1 : 0) };
    if (UI.drill.wins >= 3) markDone(d, "speak");
    logActivity(); save();
  },
  drillNext: b => { const d = +b.dataset.d; UI.drill = { d, i: (UI.drill && UI.drill.d === d ? UI.drill.i : 0) + 1, r: null, wins: UI.drill && UI.drill.d === d ? UI.drill.wins : 0 }; UI.drillRec = null; UI.clearDrill = true; render(); },
  mic: b => {
    const ctx = b.dataset.ctx;
    if (ctx === "drill") micListen("drill", alts => { if (alts.length) A.drillCheck(null, alts); });
    else if (ctx === "quiz") micListen("quiz", alts => { if (!alts.length) return; const Z = UI.quiz, q = Z.qs[Z.i]; if (Z.answers[Z.i]) return; const r = bestOf(q.target, alts); recordAnswer(r.score >= 80 ? 1 : 0, 1, { said: r.said, score: r.score }); });
    else if (ctx === "chat") micListen("chat", alts => { if (!alts.length) return; const el = $("#chat-in"); if (el) el.value = alts[0]; A.chatSend(); });
  },
  recDrill: b => {
    const d = +b.dataset.d;
    if (RECD.on) { recStop(); return; }
    const i = UI.drill && UI.drill.d === d ? UI.drill.i : 0;
    UI.recCtx = "drill";
    recStart(10000, blob => { try { UI.drillRec && URL.revokeObjectURL(UI.drillRec.url); } catch (e) {} UI.drillRec = { d, i, blob, url: URL.createObjectURL(blob) }; logActivity(); save(false); });
  },
  pronAI: async b => {
    const d = +b.dataset.d, R = UI.drillRec; if (!R) return;
    const P = phrasesOf(d), target = P[R.i % P.length].en;
    R.busy = true; R.err = null; render();
    try { R.res = await aiPron(target, R.blob); if ((+R.res.score || 0) >= 80) { UI.drill = UI.drill || { d, i: R.i, wins: 0 }; } }
    catch (e) { R.err = aiErr(e); }
    R.busy = false; render();
  },

  aiWrite: async b => {
    const d = +b.dataset.d, task = b.dataset.task, text = ($("#write-in") || {}).value || "";
    if (text.trim().split(/\s+/).length < 4) { toast("اكتب جملتين على الأقل"); return; }
    UI.write = { d, text, busy: true }; render();
    try {
      const res = await aiCorrect(task, text);
      UI.write = { d, text, res };
      S.journal = (S.journal || []).concat([{ day: d, text, res, at: Date.now() }]).slice(-40);
      markDone(d, "write"); logActivity(); save();
    } catch (e) { UI.write = { d, text, err: aiErr(e) }; render(); }
  },
  selfWrite: b => {
    const d = +b.dataset.d, text = ($("#write-in") || {}).value || "";
    if (!text.trim()) { toast("اكتب أولاً"); return; }
    UI.write = { d, text, self: true };
    S.journal = (S.journal || []).concat([{ day: d, text, res: null, at: Date.now() }]).slice(-40);
    markDone(d, "write"); logActivity(); save();
  },
  // quiz
  qpick: b => { const Z = UI.quiz, q = Z.qs[Z.i], i = +b.dataset.i; recordAnswer(i === q.ans ? 1 : 0, 1, { choice: i }); render(); if (q.hidden) say(q.audio); },
  qcheck: () => {
    const Z = UI.quiz, q = Z.qs[Z.i], v = ($("#q-in") || {}).value || "";
    if (!v.trim()) { toast(q.type === "speak" ? "قل الجملة بميكروفون الكيبورد أولاً" : "اكتب ما سمعته أولاً"); return; }
    const r = compare(q.target, v); recordAnswer(r.score >= 80 ? 1 : 0, 1, { said: v, score: r.score }); render();
  },
  qskip: () => { recordAnswer(0, 0, { skip: true, said: "" }); render(); },
  qwrite: async () => {
    const Z = UI.quiz, q = Z.qs[Z.i], text = ($("#q-in") || {}).value || "";
    if (text.trim().split(/\s+/).length < 8) { toast("اكتب أكثر (5 جمل على الأقل)"); return; }
    Z.ws = { text, busy: true }; render();
    try {
      const res = await aiCorrect(q.prompt, text);
      Z.ws = { text, res }; const sc = Math.max(0, Math.min(10, +res.score || 0));
      recordAnswer(Math.round(sc / 10 * q.weight * 10) / 10, q.weight);
      S.journal = (S.journal || []).concat([{ day: UI.day, text, res, at: Date.now() }]).slice(-40); save(false);
      render();
    } catch (e) { Z.ws = { text, err: aiErr(e) }; render(); }
  },
  qselfw: () => { const Z = UI.quiz, text = ($("#q-in") || {}).value || ""; if (!text.trim()) { toast("اكتب أولاً"); return; } Z.ws = { text, self: true }; render(); },
  qselfdone: () => { const Z = UI.quiz, q = Z.qs[Z.i]; const n = SELF_CHECK.filter((_, i) => ($("#qsc-" + i) || {}).checked).length; recordAnswer(Math.round(n / SELF_CHECK.length * q.weight * 10) / 10, q.weight); render(); },
  qnext: () => { const Z = UI.quiz; hush(); Z.ws = null; if (Z.i + 1 < Z.qs.length) { Z.i++; render(); window.scrollTo(0, 0); const q = Z.qs[Z.i]; if (q.hidden || q.type === "type") say(q.audio); } else finishQuiz(); },
  qexit: () => { hush(); UI.quiz = null; UI.view = "today"; render(); },
  qdone: () => { const Z = UI.quiz; const dayOf = Object.keys(DAYS).map(Number).find(d => testKey(d) === Z.key); if (Z.result.passed && dayOf && dayOf < 30) UI.day = dayOf + 1; UI.quiz = null; UI.view = "today"; render(); window.scrollTo(0, 0); },
  // chat
  chat: () => { hush(); UI.chat = { day: UI.day, msgs: [], busy: false }; UI.view = "chat"; render(); window.scrollTo(0, 0); },
  chatExit: () => { if (UI.chat && UI.chat.ctl) UI.chat.ctl.abort(); UI.chat = null; UI.view = "today"; render(); window.scrollTo(0, 0); },
  chatSend: async () => {
    const C = UI.chat; if (C.busy || !store.ai) return;
    const v = (($("#chat-in") || {}).value || "").trim();
    if (C.msgs.length && !v) { toast("تكلم أو اكتب ردك أولاً"); return; }
    if (v) C.msgs.push({ role: "user", content: v });
    C.busy = true; C.err = null; C.stream = ""; UI.clearChat = true; render();
    let hist = C.msgs.slice(-16); while (hist.length && hist[0].role === "user" && C.msgs.length > 16) hist.shift();
    const turns = [{ role: "user", text: chatRules(C.day) + "\n\nStart the conversation now with a greeting and a first question." }].concat(hist.map(m => ({ role: m.role === "assistant" ? "model" : "user", text: m.content })));
    if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", text: "(continue)" });
    try {
      const text = await aiText(turns, false);
      C.msgs.push({ role: "assistant", content: text.trim() });
      C.busy = false;
      if (C.msgs.filter(m => m.role === "user").length >= 4) markDone(C.day, "chat");
      logActivity(); save(false); render();
      hush(); say(text.split(/\n?\s*Correction:/)[0]);
    } catch (e) { C.busy = false; C.err = aiErr(e); render(); }
  },
  login: async () => {
    const email = (($("#lg-email") || {}).value || "").trim().toLowerCase(), pin = (($("#lg-pin") || {}).value || "").trim();
    if (!email || !/^\d{4,8}$/.test(pin)) { UI.loginErr = "اكتب الإيميل ورمزاً من 4 إلى 8 أرقام."; render(); return; }
    AUTH = { email, pin }; UI.loginBusy = true; UI.loginErr = null; render();
    try {
      const j = await api("login");
      UI.loginBusy = false;
      if (!j.ok) { AUTH = null; UI.loginErr = j.error === "auth" ? "الإيميل أو الرمز غير صحيح." : j.error === "locked" ? "محاولات خاطئة كثيرة. الدخول مقفول " + (j.minutes || 30) + " دقيقة للحماية." : "تعذّر الاتصال بالخادم."; render(); return; }
      try { localStorage.setItem(AUTH_K, JSON.stringify(AUTH)); } catch (e) {}
      store.ai = !!j.ai; UI.view = "today"; render(); toast(j.firstTime ? "تم إنشاء حسابك. احفظ رمزك." : "أهلاً بعودتك"); connect();
    } catch (e) { AUTH = null; UI.loginBusy = false; UI.loginErr = "تعذّر الاتصال بالخادم. تأكد من الإنترنت."; render(); }
  },
  guest: () => { UI.view = "today"; render(); },
  logout: () => logout(false),
  testMail: async b => { if (!AUTH) return; await flush(); try { const j = await api(b.dataset.k); toast(j.ok ? "أُرسل. راجع بريدك (وقد يصل إلى الرسائل غير المرغوبة)." : "تعذّر الإرسال"); } catch (e) { toast("تعذّر الاتصال"); } },
  aiTest: async () => {
    UI.aiTestBusy = true; UI.aiTest = null; render();
    try { const j = await api("aiTest"); UI.aiTest = { ok: !!j.ok, lines: j.results ? j.results.map(x => x.model + " → " + (x.code === 200 ? "OK" : x.code + " " + x.msg) + " (" + (x.ms / 1000).toFixed(1) + "s)") : [j.error || "error"] }; }
    catch (e) { UI.aiTest = { ok: false, lines: [aiErr(e)] }; }
    UI.aiTestBusy = false; render();
  },
  saveKey: async () => {
    const key = (($("#gkey") || {}).value || "").trim(); if (!key) { UI.keyMsg = ["warn", "الصق المفتاح أولاً."]; render(); return; }
    UI.keyBusy = true; UI.keyMsg = null; render();
    try { const j = await api("setKey", { key }); store.ai = !!j.ai; UI.keyMsg = j.ok ? (j.warn ? ["warn", "تم حفظ المفتاح، لكن Gemini لم يرد الآن (" + j.warn + "). جرّب بعد دقيقة."] : ["ok", "تم تفعيل Gemini. المحادثة والتصحيح وتحليل النطق جاهزة."]) : ["bad", "المفتاح لم يعمل. تأكد أنك نسخته كاملاً." + (j.detail ? " (" + String(j.detail).slice(0, 160) + ")" : "")]; }
    catch (e) { UI.keyMsg = ["bad", aiErr(e)]; }
    UI.keyBusy = false; render();
  },
  recVoice: () => {
    if (RECD.on) { recStop(); return; }
    UI.recCtx = "voice"; UI.voiceMsg = ["info", "يسجّل… تكلم عن نفسك بالإنجليزية ثم اضغط «إيقاف وحفظ»."];
    recStart(90000, blob => uploadVoice(blob, blob.type));
  },
  voicePlay: async b => {
    const id = b.dataset.id; UI.voiceLoading = id; render();
    try { const j = await api("voiceGet", { id }); if (!j.ok) throw j; const bin = atob(j.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); UI.voiceUrls = UI.voiceUrls || {}; UI.voiceUrls[id] = URL.createObjectURL(new Blob([u], { type: j.mime })); }
    catch (e) { toast("تعذّر تحميل التسجيل"); }
    UI.voiceLoading = null; render();
  },
  rate: b => { S.rate = +b.value; save(false); },
  reset: b => {
    if (!UI.confirmReset) { UI.confirmReset = true; render(); return; }
    if (b.dataset.y === "1") { const keepVoice = S.voice; S = blank(); S.voice = keepVoice; UI.day = 1; UI.confirmReset = false; save(false); UI.view = "today"; render(); toast("بدأت من جديد"); }
    else { UI.confirmReset = false; render(); }
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act; if (!A[act] || b.tagName === "SELECT" || b.type === "checkbox") return;
  if (b.tagName === "A") { A[act](b); return; }
  e.preventDefault(); A[act](b);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "q-in" && e.target.tagName === "INPUT") { e.preventDefault(); A.qcheck(); return; } if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("flash")) { e.preventDefault(); A.flip(); } });
async function uploadVoice(blob, mime) {
  if (!AUTH) { UI.voiceMsg = ["warn", "سجّل الدخول لحفظ التسجيلات على إيميلك."]; render(); return; }
  if (blob.size > 12 * 1024 * 1024) { UI.voiceMsg = ["warn", "الملف كبير جداً. سجّل دقيقة أو دقيقتين فقط."]; render(); return; }
  UI.voiceMsg = ["info", "يحفظ التسجيل في Drive…"]; render();
  try {
    const j = await api("voiceUpload", { data: await toB64(blob), mime: mime || blob.type || "audio/webm", day: UI.day });
    if (!j.ok) throw j;
    S.voice = (S.voice || []).concat([{ id: j.id, day: UI.day, at: Date.now() }]);
    UI.voiceUrls = UI.voiceUrls || {}; UI.voiceUrls[j.id] = URL.createObjectURL(blob);
    UI.voiceMsg = ["ok", "حُفظ التسجيل على إيميلك."]; markDone(UI.day, "voice"); logActivity(); save();
  } catch (e) { UI.voiceMsg = ["warn", "تعذّر الحفظ الآن. حاول مرة أخرى."]; render(); }
}
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "rate") { A.rate(t); return; }
  if (t.dataset && t.dataset.act === "plOpt") { if (t.id === "pl-ar") UI.plAr = t.checked; if (t.id === "pl-shadow") UI.plShadow = t.checked; if (t.id === "pl-loop") UI.plLoop = t.checked; return; }
  if (t.dataset && t.dataset.act === "setOpt") {
    S.settings = Object.assign({ remind: true, remindHour: 20, report: true }, S.settings);
    if (t.id === "st-remind") S.settings.remind = t.checked;
    if (t.id === "st-report") S.settings.report = t.checked;
    if (t.id === "st-hour") S.settings.remindHour = +t.value;
    save(false); toast("تم الحفظ"); return;
  }
  if (t.id === "voice-in" && t.files && t.files[0]) { const f = t.files[0]; UI.recCtx = null; uploadVoice(f, f.type || (/\.m4a$/i.test(f.name) ? "audio/mp4" : "audio/mpeg")); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "lg-pin" || e.target.id === "lg-email")) { e.preventDefault(); A.login(); } });

ensureCards();
render();
connect();

</script>
