ln\"><button class=\"say\" data-say=\"I love reading.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I love reading.<\/span><div class=\"ar\">أحب القراءة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I want to learn English.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I want to learn English.<\/span><div class=\"ar\">أريد أن أتعلم الإنجليزية.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Call me later.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Call me later.<\/span><div class=\"ar\">اتصل بي لاحقاً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Do you know him?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Do you know him?<\/span><div class=\"ar\">هل تعرفه؟<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I want learn English.<\/s> → <b>I want to learn English.<\/b><\/div><div class=\"ar\">بعد want لا بد من to.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I like _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">swimming<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Call _____ later. (أنا)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">me<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">I want _____ travel.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">to<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">This is Ali. I like _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">him<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d27-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"I love reading.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I love reading.<\/span><div class=\"ar\">أحب القراءة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I want to learn English.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I want to learn English.<\/span><div class=\"ar\">أريد أن أتعلم الإنجليزية.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Call me later.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Call me later.<\/span><div class=\"ar\">اتصل بي لاحقاً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Do you know him?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Do you know him?<\/span><div class=\"ar\">هل تعرفه؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My favorite food is rice because it's delicious.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My favorite food is rice because it's delicious.<\/span><div class=\"ar\">طعامي المفضل الأرز لأنه لذيذ.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I prefer tea, but my wife prefers coffee.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I prefer tea, but my wife prefers coffee.<\/span><div class=\"ar\">أفضّل الشاي لكن زوجتي تفضّل القهوة.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d27-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Why do you want to learn English?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Why do you want to learn English?<\/span><div class=\"ar\">لماذا تريد أن تتعلم الإنجليزية؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Because I want to travel and I like meeting people.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Because I want to travel and I like meeting people.<\/span><div class=\"ar\">لأني أريد السفر وأحب مقابلة الناس.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is English difficult for you?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Is English difficult for you?<\/span><div class=\"ar\">هل الإنجليزية صعبة عليك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It was difficult, but now it's easy! I enjoy it.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: It was difficult, but now it's easy! I enjoy it.<\/span><div class=\"ar\">كانت صعبة، لكنها الآن سهلة! أستمتع بها.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Do you study alone?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Do you study alone?<\/span><div class=\"ar\">هل تدرس وحدك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No. My friend and I study together. I help him and he helps me.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: No. My friend and I study together. I help him and he helps me.<\/span><div class=\"ar\">لا. أدرس مع صديقي. أساعده ويساعدني.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d27-read","t":"قراءة: Two friends","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Laila and Dina are friends, but they are different. Laila is friendly, and she enjoys meeting new people. She likes going to parties. Dina is shy. She prefers staying at home and reading. But they both love cooking, so they often cook together. Dina wants to learn English, and Laila helps her. Laila also likes Dina's family very much.<\/div><button class=\"say\" data-say=\"Laila and Dina are friends, but they are different. Laila is friendly, and she enjoys meeting new people. She likes going to parties. Dina is shy. She prefers staying at home and reading. But they both love cooking, so they often cook together. Dina wants to learn English, and Laila helps her. Laila also likes Dina's family very much.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">ليلى ودينا صديقتان، لكنهما مختلفتان. ليلى ودودة وتستمتع بالتعرف على أشخاص جدد. تحب الذهاب إلى الحفلات. دينا خجولة. تفضّل البقاء في البيت والقراءة. لكن الاثنتين تحبان الطبخ، لذلك غالباً تطبخان معاً. دينا تريد أن تتعلم الإنجليزية، وليلى تساعدها. وليلى تحب عائلة دينا كثيراً.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What does Laila enjoy?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">meeting new people<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is Dina like?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">shy<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What do they often do together?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">cook<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d27-pron","t":"النطق: التنغيم في الأسئلة","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>أسئلة نعم/لا يرتفع الصوت في آخرها ↗ (Do you like it?). أسئلة wh ينخفض ↘ (What do you like?).<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"Do you like it?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Do you like it?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"What do you like?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">What do you like?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Are you ready?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Are you ready?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Where do you live?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Where do you live?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Can you come?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Can you come?<\/span><\/div><\/div>","color":"indigo"},{"id":"d27-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب 5 جمل: أشياء تحب فعلها (+ing)، شيء تريد تعلمه (want to)، واستخدم because مرة.<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d27-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner what they want to do in the future and why (because...).<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d27-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-27-i-cant-come-in/3457316.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 27: I Can't Come In ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/writing/a1/email-book-hotel\" target=\"_blank\" rel=\"noopener\">An email to book a hotel ↗<\/a> <span class=\"muted\">(British Council · كتابة · إضافي)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2/verbs-followed-ing-or-infinitive\" target=\"_blank\" rel=\"noopener\">Verbs followed by -ing or infinitive ↗<\/a> <span class=\"muted\">(British Council · قواعد · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d27-quiz","t":"اختبار اليوم","s":"80% تفتح اليوم اللي بعده","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>6 أسئلة كلمات (إنجليزي↔عربي)<\/li><li>أسئلة القاعدة<\/li><li>سؤال قراءة من نص اليوم<\/li><li>2 استماع (اختار المعنى)<\/li><li>1 استماع (اكتب اللي سمعته)<\/li><li>1 نطق بالمايك<\/li><li>سؤال مراجعة من يوم قديم<\/li><\/ul>","color":"indigo"}],"color":"indigo"},{"id":"d28","t":"اليوم 28: مراجعة الأسبوع 4","s":"مراجعة + اختبار المهارات الأربع","d":"<p>يوم مراجعة للأيام 22، 23، 24، 25، 26، 27.<\/p>","c":[{"id":"d28-rules","t":"قواعد الأسبوع في صفحة","s":"السطور الصفراء بس","d":"<ul><li><b>اليوم 22:<\/b> ماضي to be: was / were<div class=\"rule\" dir=\"ltr\">I/he/she/it + was · you/we/they + were<\/div><\/li><li><b>اليوم 23:<\/b> الماضي البسيط: -ed و did<div class=\"rule\" dir=\"ltr\">فعل+ed  ·  didn't + أصلي  ·  Did + فاعل + أصلي؟<\/div><\/li><li><b>اليوم 24:<\/b> الماضي الشاذ<div class=\"rule\" dir=\"ltr\">احفظ الشكل الثاني: go→went · eat→ate · see→saw · buy→bought<\/div><\/li><li><b>اليوم 25:<\/b> going to للخطط<div class=\"rule\" dir=\"ltr\">am/is/are + going to + فعل أصلي<\/div><\/li><li><b>اليوم 26:<\/b> have / has + ألم، والجمع الشاذ<div class=\"rule\" dir=\"ltr\">I/you/we/they have · he/she has  ·  My ... hurts<\/div><\/li><li><b>اليوم 27:<\/b> like + ing و want to وضمائر المفعول<div class=\"rule\" dir=\"ltr\">like/love + ing  ·  want + to + فعل  ·  فعل + me/him/her/us/them<\/div><\/li><\/ul>","color":"indigo"},{"id":"d28-read","t":"قراءة الاختبار: Last weekend","s":"النص اللي في اختبار الأسبوع","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Last weekend was great. On Thursday night I went to my uncle's house. We ate dinner together and talked a lot. On Friday morning I was tired, so I stayed at home. In the afternoon I visited my friend Ali. We watched a soccer game on TV. My team didn't win, but it was fun. Next month I'm going to travel to London. I'm going to visit museums and practice my English!<\/div><button class=\"say\" data-say=\"Last weekend was great. On Thursday night I went to my uncle's house. We ate dinner together and talked a lot. On Friday morning I was tired, so I stayed at home. In the afternoon I visited my friend Ali. We watched a soccer game on TV. My team didn't win, but it was fun. Next month I'm going to travel to London. I'm going to visit museums and practice my English!\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  \n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where did he go on Thursday night?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">to his uncle's house<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why did he stay at home on Friday morning?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">He was tired.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Did his team win?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, it didn't.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where is he going to travel?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">London<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d28-test","t":"اختبار الأسبوع 4","s":"75% للنجاح","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>10 كلمات<\/li><li>7 قواعد<\/li><li>3 استماع + 2 اكتب اللي سمعته<\/li><li>نص قراءة و4 أسئلة<\/li><li>2 نطق بالمايك<\/li><\/ul><p>بعده: أعد أضعف يوم في الأسبوع لحد ما تجيب 90%، وسجّل «بصمة صوتك»: اتكلم دقيقة عن نفسك.<\/p>","color":"indigo"}],"color":"indigo"}],"color":"indigo"},{"id":"wend","t":"النهاية","s":"اليوم 29 و 30","d":"<p>يومين لتثبيت كل حاجة واختبار المستوى.<\/p>","c":[{"id":"d29","t":"اليوم 29: اختبار تجريبي","s":"نسخة مصغرة من النهائي · 70%","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>راجع كل البطاقات المستحقة<\/li><li>الاختبار التجريبي: كلمات، قواعد، استماع، قراءة، نطق، وكتابة فقرة<\/li><li>عالج أضعف مهارة<\/li><li>مقابلة تجريبية بالإنجليزي<\/li><li><a href=\"https://www.cambridgeenglish.org/test-your-english/general-english/\" target=\"_blank\" rel=\"noopener\">اختبار كامبريدج السريع (خارجي) ↗<\/a><\/li><\/ul>","color":"indigo"},{"id":"d30","t":"اليوم 30: الاختبار النهائي","s":"70% في كل مهارة","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>الاختبار النهائي A1: المهارات الأربع، ولازم 70% في كل مهارة لوحدها<\/li><li>سجّل بصمة صوتك الأخيرة وقارنها بأول واحدة<\/li><li><a href=\"https://www.efset.org/quick-check/\" target=\"_blank\" rel=\"noopener\">EF SET Quick Check (تأكيد خارجي مجاني) ↗<\/a><\/li><li><a href=\"https://www.efset.org/ef-set-50/\" target=\"_blank\" rel=\"noopener\">EF SET 50 دقيقة (شهادة CEFR مجانية) ↗<\/a><\/li><\/ul>","color":"indigo"}],"color":"indigo"}]},{"id":"grammar","t":"القواعد","s":"24 قاعدة في 12 مجموعة","color":"amber","d":"<p>كل قاعدة: شرح بالعربي، السطر الأصفر اللي تحفظه، أمثلة بصوت، الخطأ الشائع عند العرب، وأسئلة تختبر بيها نفسك.<\/p>","c":[{"id":"gg0","t":"فعل الكينونة to be","s":"I am / You are — فعل الكينونة (1) · to be كاملاً: he / she / it / we / they · النفي والسؤال مع to be · ماضي to be: was / were","d":"<ul><li><b>I am / You are — فعل الكينونة (1)<\/b> (اليوم 1)<div class=\"rule\" dir=\"ltr\">I + am  ·  You + are<\/div><\/li><li><b>to be كاملاً: he / she / it / we / they<\/b> (اليوم 2)<div class=\"rule\" dir=\"ltr\">he / she / it + is  ·  we / you / they + are<\/div><\/li><li><b>النفي والسؤال مع to be<\/b> (اليوم 3)<div class=\"rule\" dir=\"ltr\">النفي: am/is/are + not  ·  السؤال: Are you...? / Is she...?<\/div><\/li><li><b>ماضي to be: was / were<\/b> (اليوم 22)<div class=\"rule\" dir=\"ltr\">I/he/she/it + was · you/we/they + were<\/div><\/li><\/ul>","c":[{"id":"g1","t":"I am / You are — فعل الكينونة (1)","s":"اليوم 1","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>في العربية نقول «أنا طالب» بلا فعل. في الإنجليزية لا بد من فعل to be بين الفاعل وما بعده. مع I نستخدم am، ومع you نستخدم are. وفي الكلام نختصرها: I'm و you're.<\/p><div class=\"rule\" dir=\"ltr\">I + am  ·  You + are<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"I am Ahmed.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I am Ahmed.<\/span><div class=\"ar\">أنا أحمد.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm a student.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm a student.<\/span><div class=\"ar\">أنا طالب.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"You are my friend.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">You are my friend.<\/span><div class=\"ar\">أنت صديقي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"You're welcome.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">You're welcome.<\/span><div class=\"ar\">عفواً.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I student.<\/s> → <b>I am a student.<\/b><\/div><div class=\"ar\">لا تحذف am أبداً.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ a student.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">am<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">You _____ my friend.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ name is Sara.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">My<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g2","t":"to be كاملاً: he / she / it / we / they","s":"اليوم 2","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>he (هو) و she (هي) و it (للأشياء والحيوانات) تأخذ is. و we (نحن) و they (هم) تأخذ are. الاختصار: he's, she's, it's, we're, they're.<\/p><div class=\"rule\" dir=\"ltr\">he / she / it + is  ·  we / you / they + are<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"She is a doctor.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She is a doctor.<\/span><div class=\"ar\">هي طبيبة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It's a phone.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It's a phone.<\/span><div class=\"ar\">إنه هاتف.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We are friends.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">We are friends.<\/span><div class=\"ar\">نحن أصدقاء.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"They're students.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">They're students.<\/span><div class=\"ar\">هم طلاب.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>She are my sister.<\/s> → <b>She is my sister.<\/b><\/div><div class=\"ar\">he/she/it دائماً مع is.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">She _____ a doctor.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">is<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They _____ my friends.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">It _____ cold today.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">is<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">We _____ from Egypt.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g3","t":"النفي والسؤال مع to be","s":"اليوم 3","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>للنفي نضيف not بعد الفعل: I'm not, he isn't, they aren't. وللسؤال نقدّم الفعل على الفاعل: Are you...? Is he...? والإجابة القصيرة: Yes, I am. / No, I'm not.<\/p><div class=\"rule\" dir=\"ltr\">النفي: am/is/are + not  ·  السؤال: Are you...? / Is she...?<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"I'm not Egyptian.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm not Egyptian.<\/span><div class=\"ar\">أنا لست مصرياً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"He isn't from Riyadh.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">He isn't from Riyadh.<\/span><div class=\"ar\">هو ليس من الرياض.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Are you Saudi? Yes, I am.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Are you Saudi? Yes, I am.<\/span><div class=\"ar\">هل أنت سعودي؟ نعم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is she a teacher? No, she isn't.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Is she a teacher? No, she isn't.<\/span><div class=\"ar\">هل هي معلمة؟ لا.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>You are Saudi?<\/s> → <b>Are you Saudi?<\/b><\/div><div class=\"ar\">في السؤال الفعل أولاً.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">_____ you from Jordan?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Are<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">I _____ not a teacher.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">am<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">He's from Jeddah. He _____ from Riyadh.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">isn't<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Is she British? No, she _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">isn't<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g22","t":"ماضي to be: was / were","s":"اليوم 22","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>I/he/she/it + was · you/we/they + were. النفي: wasn't / weren't. السؤال: Were you...? Was it...? ونستخدم معه: yesterday, last night, last week, ago.<\/p><div class=\"rule\" dir=\"ltr\">I/he/she/it + was · you/we/they + were<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Where were you yesterday?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Where were you yesterday?<\/span><div class=\"ar\">أين كنت أمس؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I was at home.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I was at home.<\/span><div class=\"ar\">كنت في البيت.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It was a great party.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It was a great party.<\/span><div class=\"ar\">كانت حفلة رائعة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We weren't busy last week.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">We weren't busy last week.<\/span><div class=\"ar\">لم نكن مشغولين الأسبوع الماضي.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I were tired.<\/s> → <b>I was tired.<\/b><\/div><div class=\"ar\">مع I نستخدم was.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ tired yesterday.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">was<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They _____ at school.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">were<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ you at work yesterday?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Were<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">She _____ at the party. (نفي)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">wasn't<\/span><\/details><\/li><\/ul>","color":"amber"}],"color":"amber"},{"id":"gg1","t":"الأسماء والملكية","s":"صفات الملكية و 's · a / an والجمع و this / that / these / those","d":"<ul><li><b>صفات الملكية و 's<\/b> (اليوم 4)<div class=\"rule\" dir=\"ltr\">my · your · his · her · our · their + اسم  ·  Ali's + اسم<\/div><\/li><li><b>a / an والجمع و this / that / these / those<\/b> (اليوم 5)<div class=\"rule\" dir=\"ltr\">a + ساكن · an + متحرك  ·  this/that (مفرد) · these/those (جمع)<\/div><\/li><\/ul>","c":[{"id":"g4","t":"صفات الملكية و 's","s":"اليوم 4","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>my (ـي)، your (ـك)، his (ـه للمذكر)، her (ـها)، our (ـنا)، their (ـهم) وتأتي قبل الاسم. ولملكية الأسماء نضيف 's: Ali's car = سيارة علي.<\/p><div class=\"rule\" dir=\"ltr\">my · your · his · her · our · their + اسم  ·  Ali's + اسم<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"This is my brother.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">This is my brother.<\/span><div class=\"ar\">هذا أخي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Her name is Mona.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Her name is Mona.<\/span><div class=\"ar\">اسمها منى.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Our house is big.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Our house is big.<\/span><div class=\"ar\">بيتنا كبير.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Ali's son is ten.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Ali's son is ten.<\/span><div class=\"ar\">ابن علي عمره عشر سنوات.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>Sara is he sister.<\/s> → <b>Sara is his sister.<\/b><\/div><div class=\"ar\">he = هو (فاعل)، his = ـه (ملكية).<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">This is _____ father. (أنا)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">my<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Sara is _____ sister. (هو)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">his<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ car is new. (نحن)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Our<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">This is Omar_____ phone.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">'s<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g5","t":"a / an والجمع و this / that / these / those","s":"اليوم 5","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>a قبل الصوت الساكن (a book) و an قبل الصوت المتحرك (an apple). الجمع غالباً بإضافة s (books) وأحياناً es (boxes). this/these للقريب، that/those للبعيد.<\/p><div class=\"rule\" dir=\"ltr\">a + ساكن · an + متحرك  ·  this/that (مفرد) · these/those (جمع)<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"This is an apple.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">This is an apple.<\/span><div class=\"ar\">هذه تفاحة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"What are these? They're keys.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What are these? They're keys.<\/span><div class=\"ar\">ما هذه؟ إنها مفاتيح.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is that your bag?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Is that your bag?<\/span><div class=\"ar\">هل تلك حقيبتك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Those are my books.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Those are my books.<\/span><div class=\"ar\">تلك كتبي.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>This are my keys.<\/s> → <b>These are my keys.<\/b><\/div><div class=\"ar\">الجمع مع these و are.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I have _____ apple.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">an<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ are my keys. (قريبة)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">These<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">One box, two _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">boxes<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">One child, two _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">children<\/span><\/details><\/li><\/ul>","color":"amber"}],"color":"amber"},{"id":"gg2","t":"الصفات","s":"مكان الصفة و very","d":"<ul><li><b>مكان الصفة و very<\/b> (اليوم 6)<div class=\"rule\" dir=\"ltr\">صفة + اسم (a big house)  ·  be + صفة (It is big)  ·  very + صفة<\/div><\/li><\/ul>","c":[{"id":"g6","t":"مكان الصفة و very","s":"اليوم 6","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>الصفة تأتي قبل الاسم (عكس العربية): a red car = سيارة حمراء. أو بعد فعل to be: The car is red. والصفة لا تُجمع: two red cars. و very (جداً) تأتي قبل الصفة.<\/p><div class=\"rule\" dir=\"ltr\">صفة + اسم (a big house)  ·  be + صفة (It is big)  ·  very + صفة<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"It's a big house.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It's a big house.<\/span><div class=\"ar\">إنه بيت كبير.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My car is white.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My car is white.<\/span><div class=\"ar\">سيارتي بيضاء.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm very tired.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm very tired.<\/span><div class=\"ar\">أنا متعب جداً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"They are new phones.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">They are new phones.<\/span><div class=\"ar\">إنها هواتف جديدة.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>a car red<\/s> → <b>a red car<\/b><\/div><div class=\"ar\">الصفة قبل الاسم دائماً.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">She has a _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">red car<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">I'm _____ tired.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">very<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They are _____ phones.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">new<\/span><\/details><\/li><\/ul>","color":"amber"}],"color":"amber"},{"id":"gg3","t":"المضارع البسيط","s":"المضارع البسيط (I / you / we / they) · he / she / it + s  و at / on / in للوقت · النفي والسؤال بـ do / does · ظروف التكرار","d":"<ul><li><b>المضارع البسيط (I / you / we / they)<\/b> (اليوم 8)<div class=\"rule\" dir=\"ltr\">I / you / we / they + الفعل الأصلي<\/div><\/li><li><b>he / she / it + s  و at / on / in للوقت<\/b> (اليوم 9)<div class=\"rule\" dir=\"ltr\">he/she/it + فعل+s  ·  at الساعة · on اليوم · in الشهر<\/div><\/li><li><b>النفي والسؤال بـ do / does<\/b> (اليوم 10)<div class=\"rule\" dir=\"ltr\">Do + I/you/we/they · Does + he/she/it  ·  don't / doesn't + فعل أصلي<\/div><\/li><li><b>ظروف التكرار<\/b> (اليوم 11)<div class=\"rule\" dir=\"ltr\">فاعل + always/never + فعل  ·  فاعل + am/is/are + always/never<\/div><\/li><\/ul>","c":[{"id":"g8","t":"المضارع البسيط (I / you / we / they)","s":"اليوم 8","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>نستخدمه للعادات والأشياء المتكررة. مع I و you و we و they يبقى الفعل كما هو بدون إضافة: I work, they live. ولا نستخدم am/is/are مع الفعل هنا.<\/p><div class=\"rule\" dir=\"ltr\">I / you / we / they + الفعل الأصلي<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"I wake up at seven.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I wake up at seven.<\/span><div class=\"ar\">أستيقظ في السابعة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We eat breakfast at home.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">We eat breakfast at home.<\/span><div class=\"ar\">نأكل الفطور في البيت.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"They live in Jeddah.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">They live in Jeddah.<\/span><div class=\"ar\">يعيشون في جدة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I study English every day.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I study English every day.<\/span><div class=\"ar\">أدرس الإنجليزية كل يوم.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I am work in a bank.<\/s> → <b>I work in a bank.<\/b><\/div><div class=\"ar\">لا تضع am مع الفعل العادي.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ coffee every morning.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">drink<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They _____ in Jeddah.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">live<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">We _____ work at eight.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">start<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g9","t":"he / she / it + s  و at / on / in للوقت","s":"اليوم 9","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>مع he و she و it نضيف s للفعل: she works, he lives، ومع الأفعال المنتهية بـ o/sh/ch نضيف es: goes, watches. للوقت: at للساعة (at 5)، on لليوم (on Monday)، in للشهر والسنة (in May).<\/p><div class=\"rule\" dir=\"ltr\">he/she/it + فعل+s  ·  at الساعة · on اليوم · in الشهر<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"She works on Sunday.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She works on Sunday.<\/span><div class=\"ar\">تعمل يوم الأحد.<\/div><\/div><\ n't. انتبه: بعد does و doesn't يعود الفعل لأصله بدون s: She doesn't like (وليس likes).<\/p><div class=\"rule\" dir=\"ltr\">Do + I/you/we/they · Does + he/she/it  ·  don't / doesn't + فعل أصلي<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Do you like coffee? Yes, I do.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Do you like coffee? Yes, I do.<\/span><div class=\"ar\">هل تحب القهوة؟ نعم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I don't understand.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I don't understand.<\/span><div class=\"ar\">لا أفهم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Does she drive? No, she doesn't.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Does she drive? No, she doesn't.<\/span><div class=\"ar\">هل تقود؟ لا.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"He doesn't like fish.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">He doesn't like fish.<\/span><div class=\"ar\">لا يحب السمك.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>She doesn't likes tea.<\/s> → <b>She doesn't like tea.<\/b><\/div><div class=\"ar\">الـs تنتقل إلى does.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">_____ you like tea?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Do<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">She _____ like fish.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">doesn't<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ he play soccer?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Does<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">I _____ understand.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">don't<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g11","t":"ظروف التكرار","s":"اليوم 11","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>always (دائماً 100%) · usually (عادةً) · often (غالباً) · sometimes (أحياناً) · never (أبداً 0%). مكانها قبل الفعل العادي (I always drink tea) لكن بعد فعل to be (She is never late).<\/p><div class=\"rule\" dir=\"ltr\">فاعل + always/never + فعل  ·  فاعل + am/is/are + always/never<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"I always drink tea in the morning.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I always drink tea in the morning.<\/span><div class=\"ar\">دائماً أشرب الشاي صباحاً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I never eat fast food.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I never eat fast food.<\/span><div class=\"ar\">لا آكل الوجبات السريعة أبداً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"She is usually happy.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She is usually happy.<\/span><div class=\"ar\">هي عادةً سعيدة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"How often do you travel?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">How often do you travel?<\/span><div class=\"ar\">كم مرة تسافر؟<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I go always to the gym.<\/s> → <b>I always go to the gym.<\/b><\/div><div class=\"ar\">الظرف قبل الفعل.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Choose the correct sentence:<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en ummary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g19","t":"البسيط مقابل المستمر","s":"اليوم 19","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>البسيط للعادة والحقيقة: It rains a lot in winter. المستمر لما يحدث الآن: Look! It's raining. كلمات البسيط: always, every day, usually. كلمات المستمر: now, at the moment, Look!<\/p><div class=\"rule\" dir=\"ltr\">عادة ← I work · الآن ← I'm working<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"It usually rains in winter.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It usually rains in winter.<\/span><div class=\"ar\">عادةً تمطر في الشتاء.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Look! It's raining.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Look! It's raining.<\/span><div class=\"ar\">انظر! إنها تمطر.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I drink tea every morning.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I drink tea every morning.<\/span><div class=\"ar\">أشرب الشاي كل صباح.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm drinking coffee now.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm drinking coffee now.<\/span><div class=\"ar\">أشرب قهوة الآن.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I'm going to work every day.<\/s> → <b>I go to work every day.<\/b><\/div><div class=\"ar\">مع every day نستخدم البسيط.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">It usually _____ in winter.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">rains<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Look! It _____.<\/span> <span class=\"muted\">←<\/spa .<\/span><div class=\"ar\">شاهدت فيلماً الليلة الماضية.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"She called me yesterday.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She called me yesterday.<\/span><div class=\"ar\">اتصلت بي أمس.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Did you finish? Yes, I did.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Did you finish? Yes, I did.<\/span><div class=\"ar\">هل انتهيت؟ نعم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I didn't like it.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I didn't like it.<\/span><div class=\"ar\">لم يعجبني.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I didn't watched it.<\/s> → <b>I didn't watch it.<\/b><\/div><div class=\"ar\">بعد didn't فعل أصلي.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ my uncle yesterday.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">visited<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ you call him?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Did<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">He didn't _____ yesterday.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">work<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">She _____ English last year.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">studied<\/span><\/details><\/li><\/ul>","color":"amber"},{"id":"g24","t":"الماضي الشاذ","s":"اليوم 24","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>أفعال كثيرة شائعة لا تأخذ ed بل لها شكل خاص يجب ح <script>
(() => {
const ROOT = JSON.parse(document.getElementById('tree').textContent);
const byId = new Map(), parent = new Map();
(function idx(n, p, dep) { n.dep = dep; byId.set(n.id, n); if (p) parent.set(n.id, p); (n.c || []).forEach(k => idx(k, n, dep + 1)); })(ROOT, null, 0);
const leafIds = n => n.c ? n.c.flatMap(leafIds) : [n.id];
const LS = 'a1map.v1';
let saved = {}; try { saved = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) {}
const done = new Set(saved.done || []);
const expanded = new Set(['root']);
let sel = 'root';
const persist = () => { try { localStorage.setItem(LS, JSON.stringify({ done: [...done] })); } catch (e) {} };

const $ = s => document.querySelector(s);
const map = $('#map'), world = $('#world'), svg = $('#links'), panel = $('#panel');
const els = new Map(), pos = new Map();
const small = () => matchMedia('(max-width:760px)').matches;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const colorVar = n => `var(--${n.color === 'ink' ? 'inkc' : n.color})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() { const out = []; (function w(n) { out.push(n); if (n.c && expanded.has(n.id)) n.c.forEach(w); })(ROOT); return out; }
function progress(n) { const L = leafIds(n); return [L.filter(i => done.has(i)).length, L.length]; }

function nodeEl(n) {
  let el = els.get(n.id);
  if (!el) {
    el = document.createElement('button'); el.className = 'node'; el.dataset.id = n.id;
    el.style.setProperty('--c', colorVar(n));
    el.addEventListener('click', e => { if (moved) return; onNode(n.id); });
    world.appendChild(el); els.set(n.id, el);
  }
  const kids = n.c ? n.c.length : 0, open = expanded.has(n.id);
  let badge = '';
  if (kids) { const [a, b] = progress(n); badge = `<span class="cnt">${open ? '−' : '+' + kids}${a ? ' · ' + a + '/' + b : ''}</span>`; }
  else if (done.has(n.id)) badge = '<span class="ck" aria-label="خلصته">✓</span>';
  el.innerHTML = `${n.dep ? '<span class="dot"></span>' : ''}<span class="tx"><span class="tt">${esc(n.t)}</span>${n.s && n.dep < 3 ? `<span class="st">${esc(n.s)}</span>` : ''}</span>${badge}`;
  el.className = 'node' + (n.dep === 0 ? ' root' : n.dep === 1 ? ' d1' : '') + (n.id === sel ? ' sel' : '') + (!kids && done.has(n.id) ? ' done' : '');
  el.setAttribute('aria-expanded', kids ? String(open) : 'false');
  el.setAttribute('aria-label', n.t + (kids ? (open ? '، مفتوح' : '، فيه ' + kids + ' فروع') : ''));
  return el;
}

const HG = 56, VG = 10;
let anim = null;
function layout(animate = true) {
  const vis = visible(), seen = new Set(vis.map(n => n.id));
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); }
  vis.forEach(nodeEl);
  const size = new Map(); vis.forEach(n => { const el = els.get(n.id); size.set(n.id, [el.offsetWidth, el.offsetHeight]); });
  const colW = []; vis.forEach(n => { colW[n.dep] = Math.max(colW[n.dep] || 0, size.get(n.id)[0]); });
  const right = [0]; for (let d = 1; d < colW.length; d++) right[d] = right[d - 1] - colW[d - 1] - HG;
  const target = new Map(); let cur = 0;
  (function place(n) {
    const [w, h] = size.get(n.id);
    let y;
    if (n.c && expanded.has(n.id)) {
      const ys = n.c.map(place); y = (ys[0] + ys[ys.length - 1]) / 2;
      if (n.dep >= 1) cur += VG;
    } else { y = cur + h / 2; cur += h + VG; }
    target.set(n.id, { x: right[n.dep] - w, y: y - h / 2, w, h, cy: y });
    return y;
  })(ROOT);
  const from = new Map();
  vis.forEach(n => {
    const t = target.get(n.id), p = parent.get(n.id);
    from.set(n.id, pos.get(n.id) || (p && pos.get(p.id) ? { ...t, x: pos.get(p.id).x - t.w + pos.get(p.id).w, y: pos.get(p.id).cy - t.h / 2, cy: pos.get(p.id).cy } : t));
  });
  const t0 = performance.now(), dur = animate && !reduce ? 320 : 0;
  cancelAnimationFrame(anim);
  const step = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    vis.forEach(n => { const a = from.get(n.id), b = target.get(n.id);
      const q = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, w: b.w, h: b.h, cy: a.cy + (b.cy - a.cy) * e };
      pos.set(n.id, q); els.get(n.id).style.transform = `translate(${q.x}px,${q.y}px)`; });
    drawLinks(vis);
    if (k < 1) anim = requestAnimationFrame(step);
  };
  if (dur) anim = requestAnimationFrame(step); else step(t0);
  return target;
}
function drawLinks(vis) {
  let d = '';
  const byColor = {};
  vis.forEach(n => { const p = parent.get(n.id); if (!p) return; const a = pos.get(p.id), b = pos.get(n.id); if (!a || !b) return;
    const x1 = a.x, y1 = a.cy, x2 = b.x + b.w, y2 = b.cy, mx = (x1 + x2) / 2;
    (byColor[n.color] = byColor[n.color] || []).push(`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`); });
  svg.innerHTML = Object.entries(byColor).map(([c, ps]) => `<path stroke="var(--${c})" d="${ps.join(' ')}"/>`).join('');
}

// ---- view transform ----
let tx = 0, ty = 0, k = 1, viewAnim = null;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${k})`; };
function viewTo(nx, ny, nk, animate = true) {
  cancelAnimationFrame(viewAnim);
  if (!animate || reduce) { tx = nx; ty = ny; k = nk; apply(); return; }
  const a = { tx, ty, k }, t0 = performance.now();
  const step = now => { const q = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - q, 3);
    tx = a.tx + (nx - a.tx) * e; ty = a.ty + (ny - a.ty) * e; k = a.k + (nk - a.k) * e; apply(); if (q < 1) viewAnim = requestAnimationFrame(step); };
  viewAnim = requestAnimationFrame(step);
}
function focusOn(id, targetMap, zoom) {
  const t = (targetMap && targetMap.get(id)) || pos.get(id); if (!t) return;
  const r = map.getBoundingClientRect(), nk = zoom || k;
  const panelH = small() && !panel.classList.contains('shut') ? r.height * 0.58 : 0;
  const cx = r.width * (small() ? 0.5 : 0.62), cy = (r.height - panelH) * 0.5;
  viewTo(cx - (t.x + t.w / 2) * nk, cy - (t.y + t.h / 2) * nk, nk);
}
function fit() {
  const r = map.getBoundingClientRect();
  const panelH = small() && !panel.classList.contains('shut') ? r.height * 0.58 : 0;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [id] of els) { const t = pos.get(id); if (!t) continue; x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x + t.w); y0 = Math.min(y0, t.y); y1 = Math.max(y1, t.y + t.h); }
  if (!isFinite(x0)) return;
  const W = r.width - 40, H = r.height - panelH - 40;
  const nk = Math.max(0.4, Math.min(1, W / (x1 - x0), H / (y1 - y0)));
  viewTo(r.width - 20 - x1 * nk, 20 + (H - (y1 - y0) * nk) / 2 - y0 * nk, nk);
}

// ---- interactions ----
function ancestors(id) { const a = []; let p = parent.get(id); while (p) { a.unshift(p); p = parent.get(p.id); } return a; }
function onNode(id, fromPanel) {
  const n = byId.get(id);
  if (n.c) { if (expanded.has(id) && sel === id && !fromPanel) collapse(id); else expanded.add(id); }
  select(id);
}
function collapse(id) { expanded.delete(id); (function w(n) { (n.c || []).forEach(k => { expanded.delete(k.id); w(k); }); })(byId.get(id)); }
function select(id, reveal) {
  if (reveal) ancestors(id).forEach(a => expanded.add(a.id));
  sel = id; const tgt = layout(); renderPanel();
  if (small()) panel.classList.remove('shut');
  focusOn(id, tgt, Math.max(k, small() ? 0.8 : 0.9));
}
function renderPanel() {
  const n = byId.get(sel), anc = ancestors(sel);
  panel.style.setProperty('--c', colorVar(n.color === 'ink' ? { color: 'indigo' } : n));
  const kids = n.c || [];
  const isLeaf = !kids.length;
  panel.innerHTML = `<div class="ph">
    <div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0">
    ${anc.length ? `<div class="crumbs">${anc.map(a => `<button data-go="${a.id}">${esc(a.t)}</button><span>‹</span>`).join('')}</div>` : ''}
    <h2><i></i>${esc(n.t)}</h2>${n.s ? `<div class="sub">${esc(n.s)}</div>` : ''}</div>
    <button class="closep" id="closep" aria-label="اقفل التفاصيل">×</button></div>
    ${isLeaf ? `<div class="row"><button class="pill ${done.has(n.id) ? 'on' : ''}" id="doneBtn">${done.has(n.id) ? '✓ خلصته' : 'علّم إنك خلصته'}</button></div>` : (() => { const [a, b] = progress(n); return `<div class="row"><span class="pill" style="cursor:default">خلصت ${a} من ${b}</span></div>`; })()}
  </div>
  <div class="pb">${n.d || ''}
    ${kids.length ? `<div class="kids"><h4>الفروع (${kids.length})</h4>${kids.map(c => `<button class="kid" data-go="${c.id}"><span>${esc(c.t)}${done.has(c.id) ? ' ✓' : ''}</span><small>${c.c ? c.c.length + ' ←' : ''}</small></button>`).join('')}</div>` : ''}
  </div>`;
  panel.querySelector('.pb').scrollTop = 0;
}
panel.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { onNode(go.dataset.go, true); return; }
  const s = e.target.closest('[data-say]'); if (s) { speak(s.dataset.say); return; }
  if (e.target.closest('#doneBtn')) { done.has(sel) ? done.delete(sel) : done.add(sel); persist(); layout(false); renderPanel(); return; }
  if (e.target.closest('#closep')) { panel.classList.add('shut'); return; }
  if (small() && panel.classList.contains('shut') && e.target.closest('.ph')) panel.classList.remove('shut');
});

// speech
let voice = null;
function pickVoice() { const v = speechSynthesis.getVoices(); voice = v.find(x => /^en[-_]US/i.test(x.lang) && /Google|Samantha|Aria|Jenny|Ava/.test(x.name)) || v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = 0.85; speechSynthesis.speak(u); }

// pan / zoom
let pointers = new Map(), moved = false, start = null, pinch = null;
map.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { moved = false; start = { x: e.clientX, y: e.clientY, tx, ty }; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k, tx, ty, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
});
map.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()], r = map.getBoundingClientRect();
    const nk = Math.min(2.2, Math.max(0.25, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    const mx = pinch.mx - r.left, my = pinch.my - r.top;
    tx = mx - (mx - pinch.tx) * nk / pinch.k; ty = my - (my - pinch.ty) * nk / pinch.k; k = nk; moved = true; apply(); return;
  }
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (!moved && Math.hypot(dx, dy) > 5) { moved = true; map.classList.add('drag'); try { map.setPointerCapture(e.pointerId); } catch (x) {} }
  if (moved) { cancelAnimationFrame(viewAnim); tx = start.tx + dx; ty = start.ty + dy; apply(); }
});
const end = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) { start = null; map.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); } };
map.addEventListener('pointerup', end); map.addEventListener('pointercancel', end);
map.addEventListener('wheel', e => { e.preventDefault(); const r = map.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const nk = Math.min(2.2, Math.max(0.25, k * Math.exp(-e.deltaY * 0.0015))); cancelAnimationFrame(viewAnim);
  tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk; apply(); }, { passive: false });
const zoomBy = f => { const r = map.getBoundingClientRect(), mx = r.width / 2, my = r.height / 2, nk = Math.min(2.2, Math.max(0.25, k * f)); viewTo(mx - (mx - tx) * nk / k, my - (my - ty) * nk / k, nk); };
$('#bIn').onclick = () => zoomBy(1.2); $('#bOut').onclick = () => zoomBy(1 / 1.2);
$('#bFit').onclick = () => { layout(false); fit(); };
$('#bFold').onclick = () => { expanded.clear(); expanded.add('root'); sel = 'root'; layout(); renderPanel(); setTimeout(fit, 30); };

// search
const plain = new Map(); byId.forEach((n, id) => plain.set(id, (n.t + ' ' + (n.s || '') + ' ' + (n.d || '').replace(/<[^>]+>/g, ' ')).toLowerCase()));
const q = $('#q'), res = $('#res');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  if (s.length < 2) { res.hidden = true; return; }
  const hits = []; byId.forEach((n, id) => { if (id === 'root') return; const txt = plain.get(id); const i = txt.indexOf(s); if (i >= 0) hits.push([n, (n.t.toLowerCase().includes(s) ? 0 : 1) + n.dep * 0.01]); });
  hits.sort((a, b) => a[1] - b[1]);
  res.innerHTML = hits.length ? hits.slice(0, 30).map(([n]) => `<button data-hit="${n.id}"><div>${esc(n.t)}</div><div class="rp">${esc(ancestors(n.id).slice(1).map(a => a.t).join(' ‹ ') || 'فرع رئيسي')}</div></button>`).join('') : '<div class="rp" style="padding:10px">مفيش نتيجة. جرّب كلمة تانية.</div>';
  res.hidden = false;
});
res.addEventListener('click', e => { const b = e.target.closest('[data-hit]'); if (!b) return; res.hidden = true; q.blur(); select(b.dataset.hit, true); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
q.addEventListener('keydown', e => { if (e.key === 'Escape') { res.hidden = true; q.blur(); } if (e.key === 'Enter') { const b = res.querySelector('[data-hit]'); if (b) b.click(); } });

// start: root + main branches, with "ابدأ من هنا" open
expanded.add('start');
if (small()) panel.classList.add('shut');
layout(false); renderPanel(); fit();
addEventListener('resize', () => { layout(false); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(false); fit(); });
})();
</script>

</body>
</html>
