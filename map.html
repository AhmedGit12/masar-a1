<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>خريطة منهج A1</title>
<meta name="description" content="خريطة ذهنية تفاعلية لمنهج الإنجليزي A1 في 30 يوم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#EEF2EC; --grid:#DCE3D8; --surface:#FFFFFF; --surface2:#F6F8F4; --ink:#17212B; --muted:#5B6672; --line:#CBD4C7; --shadow:0 1px 2px rgba(23,33,43,.06),0 8px 24px -14px rgba(23,33,43,.28);
  --teal:#0E7C74; --indigo:#3B4CC0; --amber:#A8650A; --green:#2D7F3E; --rose:#B3395F; --blue:#1C6AA3; --violet:#7043B3; --clay:#9C4E28; --inkc:#17212B;
  --hi:#FFE27A; --hi-ink:#2A2100; --ok:#1E8A4C; --bad:#B7322D;
  --f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif; --f-disp:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1519; --grid:#1A232A; --surface:#172027; --surface2:#1D2831; --ink:#E6ECEF; --muted:#98A5B0; --line:#2C3943; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  --teal:#3CC2B6; --indigo:#8C9BFF; --amber:#F0AC45; --green:#62C877; --rose:#F07CA0; --blue:#5FB0EC; --violet:#B792F5; --clay:#E58F63; --inkc:#E6ECEF;
  --hi:#5A4A00; --hi-ink:#FFE9A0; --ok:#52C98A; --bad:#F07A74; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0F1519; --grid:#1A232A; --surface:#172027; --surface2:#1D2831; --ink:#E6ECEF; --muted:#98A5B0; --line:#2C3943; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  --teal:#3CC2B6; --indigo:#8C9BFF; --amber:#F0AC45; --green:#62C877; --rose:#F07CA0; --blue:#5FB0EC; --violet:#B792F5; --clay:#E58F63; --inkc:#E6ECEF;
  --hi:#5A4A00; --hi-ink:#FFE9A0; --ok:#52C98A; --bad:#F07A74; color-scheme:dark;}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-inline-end:auto;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:20px;margin:0;white-space:nowrap}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--indigo);outline-offset:1px}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:55vh;overflow:auto;z-index:20;padding:4px}
.results button{display:block;width:100%;text-align:start;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface2);outline:none}
.results .rp{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px}
.tb{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb:focus-visible,.node:focus-visible,.say:focus-visible,.kid:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;display:flex}
.map{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:22px 22px}
.map.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg.links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
svg.links path{fill:none;stroke-width:2;opacity:.55}
.node{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;width:max-content;max-width:270px;padding:7px 11px 7px 9px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:start;white-space:normal;line-height:1.35}
.node .tx{min-width:0}
.node .tt{font-weight:600;font-size:14px;display:block}
.node .st{font-size:11.5px;color:var(--muted);display:block;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.node .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.node .cnt{flex:none;font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--c);color:var(--c);font-variant-numeric:tabular-nums}
.node .ck{flex:none;color:var(--ok);font-weight:700}
.node.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),var(--shadow)}
.node.d1{padding:10px 14px;border-width:2px;border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.node.d1 .tt{font-family:var(--f-disp);font-size:17px}
.node.root{padding:14px 18px;background:var(--inkc);color:var(--surface);border-color:var(--inkc);max-width:260px}
.node.root .tt{font-family:var(--f-disp);font-size:21px}
.node.root .st{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.node.done .tt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 70%,transparent)}
/* panel */
.panel{width:min(440px,42vw);flex:none;background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ph h2{font-family:var(--f-disp);font-weight:600;font-size:22px;margin:0;text-wrap:balance;display:flex;gap:8px;align-items:center}
.ph h2 i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.ph .sub{color:var(--muted);font-size:13px;margin-top:4px}
.ph .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.pill.on{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok)}
.closep{display:none;margin-inline-start:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.pb{padding:12px 18px 24px;overflow:auto;line-height:1.75}
.pb p{margin:0 0 10px}
.pb h4{margin:16px 0 6px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.pb ul,.pb ol{margin:0 0 10px;padding-inline-start:20px}
.pb li{margin:3px 0}
.pb a{color:var(--c);text-underline-offset:3px}
.en{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
.ar{color:var(--muted);font-size:13.5px}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;margin-inline-end:4px;margin-bottom:8px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.t-memo{--tc:var(--violet)}.t-und{--tc:var(--blue)}.t-rep{--tc:var(--clay)}.t-focus{--tc:var(--teal)}.t-bg{--tc:var(--muted)}.t-read{--tc:var(--green)}.t-write{--tc:var(--rose)}.t-test{--tc:var(--ink)}
.rule{background:var(--hi);color:var(--hi-ink);border-radius:8px;padding:4px 10px;font-weight:600;display:inline-block;margin:4px 0 10px;direction:ltr}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 10px;margin-bottom:10px}
.w{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);min-width:0}
.w .en{font-weight:600}
.w .ar{margin-inline-start:auto;text-align:end}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ln{display:flex;gap:8px;align-items:flex-start}
.ln .en{display:block;font-weight:500}
.say{flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--c);border-radius:999px;min-width:26px;height:26px;padding:0 6px;font-size:11px;cursor:pointer;line-height:1}
.say:hover{border-color:var(--c)}
.mis{border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:10px;padding:8px 12px;margin:6px 0 10px}
.mis .lbl{font-size:12px;color:var(--bad);font-weight:600}
.mis s{color:var(--bad)}
.passage{background:var(--surface2);border-radius:10px;padding:10px 14px;line-height:1.7;margin-bottom:8px;text-align:left}
details{display:inline-block;margin-inline-start:6px}
details summary{cursor:pointer;color:var(--c);font-size:13px}
.taglist{display:flex;flex-direction:column;gap:6px}
.tg{display:flex;gap:6px;align-items:baseline}
.tg .chip{flex:none;margin:0}
.kids{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.kids h4{margin-top:0}
.kid{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.kid:hover{border-color:var(--c)}
.kid small{color:var(--muted)}
.hint{position:absolute;bottom:14px;inset-inline-end:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none}
@media (max-width:760px){
  header{padding:8px 16px;gap:8px}
  .brand small{display:none}
  .search{order:3;flex-basis:100%;max-width:none}
  .stage{flex-direction:column}
  .panel{position:absolute;inset-inline:0;bottom:0;width:auto;height:58%;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.35);z-index:8;transform:translateY(0);transition:transform .28s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.shut{transform:translateY(calc(100% - 52px))}
  .panel.shut .pb{visibility:hidden}
  .closep{display:block}
  .hint{display:none}
  .tb.hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>

<script type="application/json" id="tree">{"id":"root","t":"إنجليزي A1 في 30 يوم","s":"اضغط على أي فرع","color":"ink","d":"<p>دي خريطة المنهج كله. <b>ابدأ من «ابدأ من هنا»<\/b>، وبعدها «الخطة: 30 يوم» يوم بيوم.<\/p><p>باقي الفروع (القواعد، الكلمات، النطق، المهارات، الاختبارات، المصادر) نفس المحتوى متقسم بطريقة تانية، عشان ترجعله وقت المراجعة.<\/p><p><b>إزاي تستخدمها:<\/b> اضغط على أي فرع يفتح اللي تحته ويظهر تفاصيله. اسحب الخريطة عشان تتحرك، وكبّر وصغّر بالعجلة أو بصباعين. اضغط ▶ جنب أي كلمة إنجليزي عشان تسمعها.<\/p>","c":[{"id":"start","t":"ابدأ من هنا","s":"الفكرة، والروتين اليومي، والقواعد العامة","color":"teal","d":"<p>لو أول مرة تفتح الخريطة: اقرأ الفروع دي بالترتيب من فوق لتحت، وبعدها روح لفرع «الخطة: 30 يوم» وابدأ من اليوم 1.<\/p>","c":[{"id":"start-a1","t":"يعني إيه مستوى A1؟","s":"اللي هتقدر تعمله في الآخر","d":"<p>A1 هو أول مستوى في الإطار الأوروبي CEFR. في الآخر المفروض تقدر:<\/p><ul><li><b>استماع:<\/b> تفهم كلام بطيء وواضح عن نفسك وعيلتك وحاجاتك اليومية.<\/li><li><b>قراءة:<\/b> تفهم نصوص قصيرة جداً: رسالة، إعلان، قائمة طعام، لافتة.<\/li><li><b>تحدث:<\/b> تعرّف بنفسك، تسأل وتجاوب أسئلة بسيطة (منين، بتشتغل إيه، بتحب إيه)، تطلب حاجة في مطعم أو محل.<\/li><li><b>كتابة:<\/b> تكتب جمل بسيطة عن نفسك، وتملا استمارة، وتكتب رسالة قصيرة.<\/li><\/ul><p><b>أرقام المنهج:<\/b> 30 يوم · 720 كلمة · 144 جملة جاهزة · 24 قاعدة · 24 حوار · 24 نص قراءة · 24 درس نطق · 30 حلقة فيديو · 4 اختبارات أسبوعية + تجريبي + نهائي.<\/p>","color":"teal"},{"id":"start-loop","t":"روتين اليوم الواحد","s":"بالترتيب من أول خطوة لآخر خطوة","d":"<p>كل يوم تعلم بيمشي بنفس الترتيب ده:<\/p><ol>\n      <li><span class=\"chip t-memo\">احفظ<\/span> <b>الكلمات<\/b> (30 كلمة) بالبطاقات: اسمع، قول بصوتك مرتين، اقلب.<\/li>\n      <li><span class=\"chip t-und\">افهم فقط<\/span> <b>القاعدة<\/b>: افهم الشرح، واحفظ السطر الأصفر بس.<\/li>\n      <li><span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span> <b>الجمل الجاهزة<\/b> (6): احفظها قطعة واحدة، وكررها 3 مرات بصوتك.<\/li>\n      <li><span class=\"chip t-focus\">استمع بتركيز<\/span> <b>حلقة الفيديو<\/b> VOA: مرة بتركيز مع الترجمة الإنجليزية.<\/li>\n      <li><span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span> <b>الحوار<\/b>: اسمع بدون قراءة، بعدين اقرأ مع الصوت، بعدين كرر دور B.<\/li>\n      <li><span class=\"chip t-read\">اقرأ<\/span> <b>قراءة اليوم<\/b>: نص قصير و3 أسئلة.<\/li>\n      <li><span class=\"chip t-rep\">كرّر بصوتك<\/span> <b>النطق<\/b>: صوت واحد صعب على العرب.<\/li>\n      <li><span class=\"chip t-rep\">كرّر بصوتك<\/span> <b>تحدي النطق بالمايك<\/b>.<\/li>\n      <li><span class=\"chip t-write\">اكتب<\/span> <b>الكتابة<\/b>: 3 لـ 6 جمل عن موضوع اليوم.<\/li>\n      <li><span class=\"chip t-rep\">كرّر بصوتك<\/span> <b>محادثة<\/b> مع شريك ذكي.<\/li>\n      <li><span class=\"chip t-test\">اختبر<\/span> <b>اختبار اليوم<\/b>: 80% أو أكتر عشان تعدّي لليوم اللي بعده.<\/li><\/ol><p><span class=\"chip t-bg\">في الخلفية<\/span> وطول اليوم: <b>استماع في الخلفية<\/b> (كلمات وجمل اليوم، بودكاست، الحلقة كصوت) وإنت بتسوق أو بتطبخ أو بتمشي.<\/p>","color":"teal"},{"id":"start-modes","t":"الأوضاع الثلاثة","s":"حسب وقتك في اليوم","d":"<ul><li><b>مشغول<\/b> (حوالي 30 دقيقة): الحد الأدنى الذي يحافظ على تقدمك: كلمات + قاعدة مختصرة + جمل + اختبار.<\/li><li><b>يوم عادي<\/b> (حوالي 75 دقيقة): الوضع الموصى به: يضيف حلقة الفيديو والحوار والنطق.<\/li><li><b>متفرغ<\/b> (حوالي 120 دقيقة): الأسرع: يضيف الكتابة المصححة والمحادثة ومصادر إضافية.<\/li><\/ul><p><b>الأفضل:<\/b> «يوم عادي» أغلب الأيام. لو أغلب أيامك «مشغول»، احسب المسار 6 أسابيع بدل 4.<\/p>","color":"teal"},{"id":"start-tags","t":"معنى العلامات","s":"احفظ، افهم فقط، كرر بصوتك...","d":"<div class=\"taglist\"><div class=\"tg\"><span class=\"chip t-memo\">احفظ<\/span><span>ليصبح في ذاكرتك: الكلمة ومعناها ونطقها. عبر البطاقات والتكرار المتباعد.<\/span><\/div><div class=\"tg\"><span class=\"chip t-und\">افهم فقط<\/span><span>اقرأ وافهم الفكرة. لا تحفظ الشرح، سيثبت بالتطبيق والاختبار.<\/span><\/div><div class=\"tg\"><span class=\"chip t-rep\">كرّر بصوتك<\/span><span>قل الجملة بصوت مسموع مقلداً النطق (Shadowing). لا تكتفِ بالقراءة الصامتة.<\/span><\/div><div class=\"tg\"><span class=\"chip t-focus\">استمع بتركيز<\/span><span>سماعات، بلا أي نشاط آخر. أول مرة بدون نص، ثم مع النص.<\/span><\/div><div class=\"tg\"><span class=\"chip t-bg\">في الخلفية<\/span><span>أثناء القيادة أو الطبخ أو المشي. لا يهم أن تفهم كل كلمة؛ الهدف تعويد الأذن.<\/span><\/div><div class=\"tg\"><span class=\"chip t-read\">اقرأ<\/span><span>اقرأ النص مرة للفكرة العامة، ثم مرة للتفاصيل.<\/span><\/div><div class=\"tg\"><span class=\"chip t-write\">اكتب<\/span><span>اكتب بنفسك دون ترجمة آلية، ثم صحّح.<\/span><\/div><div class=\"tg\"><span class=\"chip t-test\">اختبر<\/span><span>قِس نفسك. لا تنتقل إلا بعد النجاح.<\/span><\/div><\/div>","color":"teal"},{"id":"start-rules","t":"قواعد النجاح والانتقال","s":"إمتى يتفتح اليوم اللي بعده","d":"<ul><li>اختبار يوم التعلم: <b>80%<\/b> أو أكتر.<\/li><li>اختبار الأسبوع (المهارات الأربع): <b>75%<\/b>.<\/li><li>الاختبار التجريبي (يوم 29): <b>70%<\/b>.<\/li><li>الاختبار النهائي (يوم 30): <b>70% في كل مهارة لوحدها<\/b>، ومن غير تخطي أسئلة الكلام.<\/li><li>تقدر تعيد أي اختبار بلا حدود، وبيتحسب أحسن نتيجة.<\/li><li>متبدأش يوم جديد في نفس الجلسة إلا لو عندك وقت فعلاً. توزيع الأيام بيثبّت الحفظ.<\/li><\/ul>","color":"teal"},{"id":"start-us","t":"أمريكي ولا بريطاني؟","s":"المنهج كله أمريكي","d":"<p>المنهج كله <b>إنجليزي أمريكي<\/b>: الكلمات والتهجئة وصوت النطق وحلقات VOA.<\/p><ul><li><span class=\"en\" dir=\"ltr\">color<\/span> ← بريطاني <span class=\"en\" dir=\"ltr\">colour<\/span><\/li><li><span class=\"en\" dir=\"ltr\">favorite<\/span> ← <span class=\"en\" dir=\"ltr\">favourite<\/span><\/li><li><span class=\"en\" dir=\"ltr\">soccer<\/span> ← <span class=\"en\" dir=\"ltr\">football<\/span><\/li><li><span class=\"en\" dir=\"ltr\">pants<\/span> ← <span class=\"en\" dir=\"ltr\">trousers<\/span><\/li><li><span class=\"en\" dir=\"ltr\">vacation<\/span> ← <span class=\"en\" dir=\"ltr\">holiday<\/span><\/li><li><span class=\"en\" dir=\"ltr\">fall<\/span> ← <span class=\"en\" dir=\"ltr\">autumn<\/span><\/li><li><span class=\"en\" dir=\"ltr\">movie theater<\/span> ← <span class=\"en\" dir=\"ltr\">cinema<\/span><\/li><\/ul><p>دروس British Council الإضافية بريطانية: افهم الفرق بس، واكتب وانطق بالأمريكي.<\/p>","color":"teal"}]},{"id":"plan","t":"الخطة: 30 يوم","s":"4 أسابيع + تجريبي + نهائي","color":"indigo","d":"<p>كل أسبوع: 6 أيام تعلم + يوم مراجعة واختبار. آخر يومين: تجريبي ثم نهائي.<\/p>","c":[{"id":"w1","t":"الأسبوع 1","s":"التحية والتعارف · الأرقام والحروف · البلدان والجنسيات · العائلة · الأشياء من حولك · الألوان والصفات","d":"<p><b>مواضيع الأسبوع 1:<\/b><\/p><ul><li>اليوم 1: التحية والتعارف — I am / You are — فعل الكينونة (1)<\/li><li>اليوم 2: الأرقام والحروف — to be كاملاً: he / she / it / we / they<\/li><li>اليوم 3: البلدان والجنسيات — النفي والسؤال مع to be<\/li><li>اليوم 4: العائلة — صفات الملكية و 's<\/li><li>اليوم 5: الأشياء من حولك — a / an والجمع و this / that / these / those<\/li><li>اليوم 6: الألوان والصفات — مكان الصفة و very<\/li><\/ul>","c":[{"id":"d1","t":"اليوم 1: التحية والتعارف","s":"Hello! · I am / You are — فعل الكينونة (1)","d":"<p><b>التحية والتعارف<\/b> — <span class=\"en\" dir=\"ltr\">Hello!<\/span><\/p><p><b>قاعدة اليوم:<\/b> I am / You are — فعل الكينونة (1)<\/p><div class=\"rule\" dir=\"ltr\">I + am  ·  You + are<\/div><p>افتح فروع اليوم بالترتيب من فوق لتحت.<\/p>","c":[{"id":"d1-words","t":"الكلمات (30)","s":"احفظ المعنى والنطق","d":"<span class=\"chip t-memo\">احفظ<\/span><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"hello\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">hello<\/span><span class=\"ar\">مرحباً<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"hi\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">hi<\/span><span class=\"ar\">أهلاً<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"goodbye\" aria-label=\"استمع\">▶<\/butto -label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">You're welcome.<\/span><div class=\"ar\">عفواً.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I student.<\/s> → <b>I am a student.<\/b><\/div><div class=\"ar\">لا تحذف am أبداً.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ a student.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">am<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">You _____ my friend.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ name is Sara.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">My<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d1-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Hello, my name is Ahmed.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Hello, my name is Ahmed.<\/span><div class=\"ar\">مرحباً، اسمي أحمد.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"What's your name?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What's your name?<\/span><div class=\"ar\">ما اسمك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Nice to meet you.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Nice to meet you.<\/span><div class=\"ar\">تشرفت بمعرفتك.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"How are you?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">How are you?<\/span><div class=\"ar\">كيف حالك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm fine, thank you.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm fine, thank you.<\/span><div class=\"ar\">أنا بخير، شكراً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"See you later.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">See you later.<\/span><div class=\"ar\">أراك لاحقاً.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d1-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Hello! My name is Sam. What's your name?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Hello! My name is Sam. What's your name?<\/span><div class=\"ar\">مرحباً! اسمي سام. ما اسمك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Hi, I'm Ahmed.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Hi, I'm Ahmed.<\/span><div class=\"ar\">أهلاً، أنا أحمد.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Nice to meet you, Ahmed.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Nice to meet you, Ahmed.<\/span><div class=\"ar\">تشرفت بمعرفتك يا أحمد.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Nice to meet you too. How are you?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Nice to meet you too. How are you?<\/span><div class=\"ar\">وأنا كذلك. كيف حالك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm fine, thank you. Are you a student?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: I'm fine, thank you. Are you a student?<\/span><div class=\"ar\">بخير، شكراً. هل أنت طالب؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, I am.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, I am.<\/span><div class=\"ar\">نعم.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d1-read","t":"قراءة: Sara at school","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Hello! My name is Sara. I am a student. Omar is my friend. He is a student too. Mr Adam is our teacher. He is very nice. Every morning I say, &quot;Good morning, Mr Adam!&quot; and he says, &quot;Good morning, Sara. How are you?&quot; I say, &quot;I'm fine, thank you.&quot;<\/div><button class=\"say\" data-say=\"Hello! My name is Sara. I am a student. Omar is my friend. He is a student too. Mr Adam is our teacher. He is very nice. Every morning I say, &quot;Good morning, Mr Adam!&quot; and he says, &quot;Good morning, Sara. How are you?&quot; I say, &quot;I'm fine, thank you.&quot;\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">مرحباً! اسمي سارة. أنا طالبة. عمر صديقي. هو طالب أيضاً. السيد آدم معلّمنا. هو لطيف جداً. كل صباح أقول: «صباح الخير يا سيد آدم!» فيقول: «صباح الخير يا سارة. كيف حالك؟» فأقول: «أنا بخير، شكراً.»<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is Sara?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a student<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Who is Omar?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">her friend<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does Sara say every morning?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Good morning<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d1-pron","t":"النطق: حرف P مقابل B","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>العربية ليس فيها P، فنقولها B. الـP تُنطق بنفخة هواء بدون اهتزاز الحنجرة. ضع يدك أمام فمك: مع pen تشعر بالهواء، ومع Ben لا.<\/p><div class=\"words\"> button class=\"say\" data-say=\"Where do you live?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Where do you live?<\/span><div class=\"ar\">أين تسكن؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d3-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Where are you from?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Where are you from?<\/span><div class=\"ar\">من أين أنت؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm from Saudi Arabia. And you?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I'm from Saudi Arabia. And you?<\/span><div class=\"ar\">أنا من السعودية. وأنت؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm from Britain. Are you from Riyadh?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: I'm from Britain. Are you from Riyadh?<\/span><div class=\"ar\">أنا من بريطانيا. هل أنت من الرياض؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No, I'm not. I'm from Jeddah, but I live in Riyadh.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: No, I'm not. I'm from Jeddah, but I live in Riyadh.<\/span><div class=\"ar\">لا. أنا من جدة لكن أعيش في الرياض.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Do you speak English?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Do you speak English?<\/span><div class=\"ar\">هل تتكلم الإنجليزية؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"A little. I speak Arabic.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: A little. I speak Arabic.<\/span><div class=\"ar\">قليلاً. أتكلم العربية.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d3-read","t":"قراءة: Yusuf and John","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">I am Yusuf. I am from Egypt, but I live in Saudi Arabia. My city is Riyadh. I speak Arabic and a little English. My friend John is not Egyptian. He is British. He is from London, the capital of Britain. His language is English. Are you from Egypt too?<\/div><button class=\"say\" data-say=\"I am Yusuf. I am from Egypt, but I live in Saudi Arabia. My city is Riyadh. I speak Arabic and a little English. My friend John is not Egyptian. He is British. He is from London, the capital of Britain. His language is English. Are you from Egypt too?\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">أنا يوسف. أنا من مصر، لكني أعيش في السعودية. مدينتي الرياض. أتكلم العربية وقليلاً من الإنجليزية. صديقي جون ليس مصرياً. هو بريطاني، من لندن عاصمة بريطانيا. لغته الإنجليزية. هل أنت من مصر أيضاً؟<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where is Yusuf from?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Egypt<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where does Yusuf live?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in Saudi Arabia<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What nationality is John?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">British<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d3-pron","t":"النطق: حرف V مقابل F","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>العربية ليس فيها V. الـV مثل الـF تماماً في وضع الفم (الأسنان العليا على الشفة السفلى) لكن مع صوت واهتزاز.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"very\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">very<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"fine\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">fine<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"five\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">five<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"live\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">live<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"have\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">have<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"view\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">view<\/span><\/div><\/div>","color":"indigo"},{"id":"d3-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب 4 جمل: من أين أنت، أين تسكن، ما اللغات التي تتكلمها، وجملة نفي (I'm not...).<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d3-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask where the learner is from, where they live and what languages they speak.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d3-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-3-i-am-here/3126527.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 3: I'm Here! ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/speaking/a1/talking-about-where-youre\" target=\"_blank\" rel=\"noopener\">Talking about where you're from ↗<\/a> <span class=\"muted\">(Brit band's name is Tarek. We have two children, a son and a daughter. Our son is eight and our daughter is five. My parents live near us. My father is a teacher and my mother is a doctor. My brother, Sami, is single. His car is red.<\/div><button class=\"say\" data-say=\"My name is Huda. I am married. My husband's name is Tarek. We have two children, a son and a daughter. Our son is eight and our daughter is five. My parents live near us. My father is a teacher and my mother is a doctor. My brother, Sami, is single. His car is red.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">اسمي هدى. أنا متزوجة. اسم زوجي طارق. لدينا طفلان، ولد وبنت. ابننا عمره ثماني سنوات وابنتنا خمس سنوات. والداي يعيشان قريباً منا. أبي معلّم وأمي طبيبة. أخي سامي أعزب. سيارته حمراء.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Is Huda married?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Yes, she is.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How many children do Huda and Tarek have?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">two<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Who is single?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Sami<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d4-pron","t":"النطق: الحركات القصيرة والطويلة","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>sheep (ي طويلة) ليست ship (كسرة قصيرة). full ليست fool. المدّة تغيّر المعنى في الإنجليزية.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"sheep\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">sheep<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"ship\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">ship<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"leave\" aria-label=\"استمع\ <\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Where is my phone?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Where is my phone?<\/span><div class=\"ar\">أين هاتفي؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d5-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Where is my phone?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Where is my phone?<\/span><div class=\"ar\">أين هاتفي؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is this your phone?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Is this your phone?<\/span><div class=\"ar\">هل هذا هاتفك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No, it isn't. My phone is black.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: No, it isn't. My phone is black.<\/span><div class=\"ar\">لا. هاتفي أسود.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"What about that? On the table.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: What about that? On the table.<\/span><div class=\"ar\">وماذا عن ذلك؟ على الطاولة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes! That's my phone. And these are my keys!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Yes! That's my phone. And these are my keys!<\/span><div class=\"ar\">نعم! هذا هاتفي. وهذه مفاتيحي!<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"OK, good.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: OK, good.<\/span><div class=\"ar\">حسناً، جيد.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d5-read","t":"قراءة: What's in my bag?","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">This is my bag. It is big and black. In my bag there is a book, two pens and a pencil. These are my keys, and this is my phone. That is my wallet on the table. Those are not my glasses. They are my brother's glasses. My laptop is not in my bag. It is at home.<\/div><button class=\"say\" data-say=\"This is my bag. It is big and black. In my bag there is a book, two pens and a pencil. These are my keys, and this is my phone. That is my wallet on the table. Those are not my glasses. They are my brother's glasses. My laptop is not in my bag. It is at home.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">هذه حقيبتي. إنها كبيرة وسوداء. في حقيبتي كتاب وقلمان وقلم رصاص. هذه مفاتيحي، وهذا هاتفي. تلك محفظتي على الطاولة. تلك ليست نظارتي، إنها نظارة أخي. اللابتوب ليس في حقيبتي، إنه في البيت.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What color is the bag?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">black<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How many pens are in the bag?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">two<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where is the laptop?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at home<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d5-pron","t":"النطق: a / an ونطق the","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>قبل صوت متحرك نقول an و «ذي»: an apple, the apple (ذي). وقبل صوت ساكن: a book, the book (ذَ).<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"an apple\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">an apple<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"the egg\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">the egg<\/span><\ > <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">red car<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">I'm _____ tired.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">very<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They are _____ phones.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">new<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d6-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"What color is it?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What color is it?<\/span><div class=\"ar\">ما لونه؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My car is white.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My car is white.<\/span><div class=\"ar\">سيارتي بيضاء.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It's a big house.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It's a big house.<\/span><div class=\"ar\">إنه بيت كبير.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm very tired.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm very tired.<\/span><div class=\"ar\">أنا متعب جداً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"The weather is hot today.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">The weather is hot today.<\/span><div class=\"ar\">الجو حار اليوم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My favorite color is blue.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My favorite color is blue.<\/span><div class=\"ar\">لوني المفضل الأزرق.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d6-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Is this your new car?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Is this your new car?<\/span><div class=\"ar\">هل هذه سيارتك الجديدة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, it is. Do you like it?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, it is. Do you like it?<\/span><div class=\"ar\">نعم. هل تعجبك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It's very beautiful! What color is it? Blue?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: It's very beautiful! What color is it? Blue?<\/span><div class=\"ar\">جميلة جداً! ما لونها؟ أزرق؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No, it's green. My favorite color is green.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: No, it's green. My favorite color is green.<\/span><div class=\"ar\">لا، أخضر. لوني المفضل الأخضر.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"And your old car?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: And your old car?<\/span><div class=\"ar\">وسيارتك القديمة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It was small and white.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: It was small and white.<\/span><div class=\"ar\">كانت صغيرة وبيضاء.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d6-read","t":"قراءة: My favorite things","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">My favorite color is green. My new car is dark green and very beautiful. My house is small, but it is nice. My cat is gray and white. She is very small and very happy. My brother is tall and strong. His favorite color is blue. Today is very hot, so I am tired.<\/div><button class=\"say\" data-say=\"My favorite color is green. My new car is dark green and very beautiful. My house is small, but it is nice. My cat is gray and white. She is very small and very happy. My brother is tall and strong. His favorite color is blue. Today is very hot, so I am tired.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">لوني المفضل هو الأخضر. سيارتي الجديدة خضراء غامقة وجميلة جداً. بيتي صغير لكنه لطيف. قطتي رمادية وبيضاء. هي صغيرة جداً وسعيدة جداً. أخي طويل وقوي. لونه المفضل الأزرق. اليوم حار جداً، لذلك أنا متعب.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is the writer's favorite color?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">green<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What color is the cat?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">gray and white<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why is the writer tired?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It is very hot.<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d6-pron","t":"النطق: الحروف الساكنة المتتالية","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>العربي يضيف حركة قبل الحرفين الساكنين: «إستريت». قلها street مباشرة بدون همزة في البداية.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"street\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">street<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"school\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">school<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"sleep\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">sleep<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"small\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">small<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"black\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">black<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"green\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">green<\/span><\/div><\/div>","color":"indigo"},{"id":"d6-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> صف 4 أشياء تملكها باللون والحجم: My phone is black and small...<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d6-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner to describe things they own: color, size, new or old.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d6-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-6-where-is-the-gym/3225958.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 6: Where Is the Gym? ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/listening/a1/meeting-other-students\" target=\"_blank\" rel=\"noopener\">Meeting other students ↗<\/a> <span class=\"muted\">(British Council · استماع · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d6-quiz","t":"اختبار اليوم","s":"80% تفتح اليوم اللي بعده","d":"<span class=\"chip t-test\">اختبر<\/span><ul>< hrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"I wake up at seven.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I wake up at seven.<\/span><div class=\"ar\">أستيقظ في السابعة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I go to work by car.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I go to work by car.<\/span><div class=\"ar\">أذهب إلى العمل بالسيارة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I eat breakfast at home.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I eat breakfast at home.<\/span><div class=\"ar\">آكل الفطور في البيت.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I study English every day.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I study English every day.<\/span><div class=\"ar\">أدرس الإنجليزية كل يوم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I go to bed at eleven.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I go to bed at eleven.<\/span><div class=\"ar\">أنام في الحادية عشرة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"What do you do in the morning?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What do you do in the morning?<\/span><div class=\"ar\">ماذا تفعل في الصباح؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d8-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"What do you do in the morning?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: What do you do in the morning?<\/span><div class=\"ar\">ماذا تفعل في الصباح؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I wake up at six and I take a shower.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I wake up at six and I take a shower.<\/span><div class=\"ar\">أستيقظ في السادسة وأستحم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Do you eat breakfast?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Do you eat breakfast?<\/span><div class=\"ar\">هل تأكل الفطور؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes. I eat breakfast at home with my family.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes. I eat breakfast at home with my family.<\/span><div class=\"ar\">نعم. آكل الفطور في البيت مع عائلتي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"And then?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: And then?<\/span><div class=\"ar\">ثم؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I go to work by car. I work in an office.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I go to work by car. I work in an office.<\/span><div class=\"ar\">أذهب إلى العمل بالسيارة. أعمل في مكتب.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d8-read","t":"قراءة: My day","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">I get up at six o'clock every day. I wash my face and pray. Then I have breakfast with my family. We eat bread, eggs and cheese. I go to work at seven thirty. I work in an office. I come back home at four. In the evening, I study English for one hour. I go to bed at eleven.<\/div><button class=\"say\" data-say=\"I get up at six o'clock every day. I wash my face and pray. Then I have breakfast with my family. We eat bread, eggs and cheese. I go to work at seven thirty. I work in an office. I come back home at four. In the evening, I study English for one hour. I go to bed at eleven.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">أستيقظ الساعة السادسة كل يوم. أغسل وجهي وأصلّي. ثم أتناول الفطور مع عائلتي. نأكل خبزاً وبيضاً وجبناً. أذهب إلى العمل الساعة السابعة والنصف. أعمل في مكتب. أرجع إلى البيت الساعة الرابعة. في المساء أدرس الإنجليزية لمدة ساعة. أنام الساعة الحادية عشرة.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When does the writer get up?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at six<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where does the writer work?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in an office<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does the writer do in the evening?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">studies English<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d8-pron","t":"النطق: -s في نهاية الفعل","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>works (س) · lives (ز) · watches (إز). لا تنسَها مع he/she/it — هي أكثر خطأ عند المبتدئين.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"works\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">works<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"lives\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">lives<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"watches\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">watches<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"goes\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">goes<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"plays\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">plays<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"washes\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">washes<\/span><\/div><\/div>","color":"indigo"},{"id":"d8-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب 5 جمل عن روتينك: متى تستيقظ، ماذا تأكل، كيف تذهب للعمل، متى تنام.<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d8-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner about their daily routine: wake up time, breakfast, work, bedtime.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d8-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-8-are-you-busy/3253185.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 8: Are You Busy? ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/reading/a1/study-timetable\" target=\"_blank\" rel=\"noopener\">A study timetable ↗<\/a> <span class=\"muted\">(British Council · قراءة · إضافي)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2/present-simple\" target=\"_blank\" rel=\"noopener\">Present simple ↗<\/a> <span class=\"muted\">(British Council · قواعد · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d8-quiz","t":"اختبار اليوم","s":"80% تفتح اليوم اللي بعده","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>6 أسئلة كلمات (إنجليزي↔عربي)<\/li><li>أسئلة القاعدة<\/li><li>سؤال قراءة من نص اليوم<\/li><li>2 استماع (ا },{"id":"d9-grammar","t":"القاعدة: he / she / it + s  و at / on / in للوقت","s":"افهم الشرح، احفظ السطر الأصفر","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>مع he و she و it نضيف s للفعل: she works, he lives، ومع الأفعال المنتهية بـ o/sh/ch نضيف es: goes, watches. للوقت: at للساعة (at 5)، on لليوم (on Monday)، in للشهر والسنة (in May).<\/p><div class=\"rule\" dir=\"ltr\">he/she/it + فعل+s  ·  at الساعة · on اليوم · in الشهر<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"She works on Sunday.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She works on Sunday.<\/span><div class=\"ar\">تعمل يوم الأحد.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"The class starts at nine.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">The class starts at nine.<\/span><div class=\"ar\">الحصة تبدأ في التاسعة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"He goes to the gym in the evening.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">He goes to the gym in the evening.<\/span><div class=\"ar\">يذهب إلى النادي في المساء.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My birthday is in May.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My birthday is in May.<\/span><div class=\"ar\">عيد ميلادي في مايو.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>He work in a bank.<\/s> → <b>He works in a bank.<\/b><\/div><div class=\"ar\">لا تنسَ الـs مع he/she/it.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">He _____ in a bank.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">works<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">I study _____ Monday.<\/span> <span class=\"muted\">←<\/span> <d rk at seven in the morning and finishes at three in the afternoon. Friday and Saturday are her weekend. On Friday she visits her mother. In the evening she watches TV or reads a book. Her birthday is in May.<\/div><button class=\"say\" data-say=\"Nadia is a nurse. She works in a big hospital. She starts work at seven in the morning and finishes at three in the afternoon. Friday and Saturday are her weekend. On Friday she visits her mother. In the evening she watches TV or reads a book. Her birthday is in May.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">نادية ممرضة. تعمل في مستشفى كبير. تبدأ العمل الساعة السابعة صباحاً وتنتهي الساعة الثالثة عصراً. الجمعة والسبت عطلة نهاية الأسبوع لها. يوم الجمعة تزور أمها. في المساء تشاهد التلفاز أو تقرأ كتاباً. عيد ميلادها في شهر مايو.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is Nadia's job?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a nurse<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What time does she finish work?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at three<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does she do on Friday?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">She visits her mother.<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d9-pron","t":"النطق: نطق الأيام","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>Wednesday تنطق «وِنزدي» (حرف d الأول صامت). Tuesday «تيوزدي» أو «تُوزدي».<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"Wednesday\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Wednesday<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Tuesday\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Tuesday<\/span><\/div><div class=\"w\"><button class=\"say\" data-sa r the match.<\/span><div class=\"ar\">رائع! أحتاج صديقاً للمباراة.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d10-read","t":"قراءة: Two different brothers","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Ali and Hassan are brothers, but they are very different. Ali likes soccer. He watches every match on TV. Hassan doesn't like soccer. He loves music and reading. Ali drinks coffee every morning, but Hassan doesn't drink coffee. He prefers tea. Do they like the same food? Yes, they do! They love chicken and rice.<\/div><button class=\"say\" data-say=\"Ali and Hassan are brothers, but they are very different. Ali likes soccer. He watches every match on TV. Hassan doesn't like soccer. He loves music and reading. Ali drinks coffee every morning, but Hassan doesn't drink coffee. He prefers tea. Do they like the same food? Yes, they do! They love chicken and rice.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">علي وحسن أخوان، لكنهما مختلفان جداً. علي يحب كرة القدم. يشاهد كل مباراة على التلفاز. حسن لا يحب كرة القدم. يحب الموسيقى والقراءة. علي يشرب القهوة كل صباح، لكن حسن لا يشرب القهوة. يفضّل الشاي. هل يحبان نفس الطعام؟ نعم! يحبان الدجاج والأرز.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Who likes soccer?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Ali<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does Hassan drink?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">tea<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What food do both brothers love?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">chicken and rice<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d10-pron","t":"النطق: الضغط على المقطع","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>كل كلمة لها div class=\"ar\">دائماً أشرب الشاي صباحاً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I never eat fast food.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I never eat fast food.<\/span><div class=\"ar\">لا آكل الوجبات السريعة أبداً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"How often do you travel?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">How often do you travel?<\/span><div class=\"ar\">كم مرة تسافر؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I usually visit my friends on Friday.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I usually visit my friends on Friday.<\/span><div class=\"ar\">عادةً أزور أصدقائي يوم الجمعة.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d11-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"What do you do in your free time?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: What do you do in your free time?<\/span><div class=\"ar\">ماذا تفعل في وقت فراغك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I usually go to the gym. And I sometimes swim.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I usually go to the gym. And I sometimes swim.<\/span><div class=\"ar\">عادةً أذهب إلى النادي. وأحياناً أسبح.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Do you go to the beach?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Do you go to the beach?<\/span><div class=\"ar\">هل تذهب إلى الشاطئ؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, often. I love the beach. And you?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, often. I love the beach. And you?<\/span><div class=\"ar\">نعم، غالباً. أحب الشاطئ. وأنت؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I never swim! I always watch movies at home.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: I never swim! I always watch movies at home.<\/span><div class=\"ar\">لا أسبح أبداً! دائماً أشاهد الأفلام في البيت.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"That's OK. Movies are fun too.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: That's OK. Movies are fun too.<\/span><div class=\"ar\">لا بأس. الأفلام ممتعة أيضاً.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d11-read","t":"قراءة: Mariam's free time","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Mariam is very busy in the week, but at the weekend she has free time. She always visits her grandmother on Friday. She usually goes to the gym on Saturday morning. She often walks in the park with her friends. She sometimes takes photos with her camera. She never watches TV because she thinks it is boring.<\/div><button class=\"say\" data-say=\"Mariam is very busy in the week, but at the weekend she has free time. She always visits her grandmother on Friday. She usually goes to the gym on Saturday morning. She often walks in the park with her friends. She sometimes takes photos with her camera. She never watches TV because she thinks it is boring.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">مريم مشغولة جداً خلال الأسبوع، لكن في عطلة نهاية الأسبوع عندها وقت فراغ. دائماً تزور جدتها يوم الجمعة. عادةً تذهب إلى النادي الرياضي صباح السبت. غالباً تمشي في الحديقة مع صديقاتها. أحياناً تلتقط صوراً بكاميرتها. لا تشاهد التلفاز أبداً لأنها تراه مملاً.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When does Mariam visit her grandmother?<\/span><details><su ay=\"It's one hundred riyals.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: It's one hundred riyals.<\/span><div class=\"ar\">بمئة ريال.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"That's too expensive. Do you have a cheap one?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: That's too expensive. Do you have a cheap one?<\/span><div class=\"ar\">غالٍ جداً. هل عندك واحد رخيص؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"This blue shirt is thirty riyals.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: This blue shirt is thirty riyals.<\/span><div class=\"ar\">هذا القميص الأزرق بثلاثين.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Great. Do you have a bigger size?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Great. Do you have a bigger size?<\/span><div class=\"ar\">رائع. هل عندك مقاس أكبر؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, here you are. Cash or card?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, here you are. Cash or card?<\/span><div class=\"ar\">نعم، تفضل. نقداً أم بطاقة؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d13-read","t":"قراءة: Buying a jacket","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Salma is at the market. She wants a new jacket for winter. She tries on a black jacket, but it is too small. She asks for a large size. The large jacket is perfect. &quot;How much is it?&quot; she asks. &quot;It's fifty riyals,&quot; says the shop assistant. It is not cheap, but it is not expensive. Salma pays by card and takes her receipt.<\/div><button class=\"say\" data-say=\"Salma is at the market. She wants a new jacket for winter. She tries on a black jacket, but it is too small. She asks for a large size. The large jacket is perfect. &quot;How much is it?&quot; she asks. &quot;It's fifty riyals,&quot; says the shop assistant. It is not cheap, but it is not expensive. Salma pays by card and takes her receipt.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">سلمى في السوق. تريد جاكيت جديداً للشتاء. تجرّب جاكيت أسود، لكنه صغير جداً عليها. تطلب مقاساً كبيراً. الجاكيت الكبير ممتاز. تسأل: «بكم هذا؟» فيقول البائع: «بخمسين ريالاً.» ليس رخيصاً وليس غالياً. تدفع سلمى بالبطاقة وتأخذ الإيصال.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What does Salma want?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a jacket<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is the problem with the first jacket?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It is too small.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How does Salma pay?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">by card<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d13-pron","t":"النطق: الأرقام -teen و -ty","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>thirTEEN (الضغط في الآخر) مقابل THIRty (الضغط في الأول). مهم جداً مع الأسعار.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"thirteen\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">thirteen<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"thirty\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">thirty<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"fifteen\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">fifteen<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"fifty\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">fifty<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"eighteen\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">eighteen<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"eighty\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">eighty<\/span><\/div><\/div>","color":"indigo"},{"id":"d13-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب حواراً قصيراً (4 أسطر) بينك وبين بائع: السعر، المقاس، الدفع.<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d13-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Role-play: you are a shop assistant in a clothes shop.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d13-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-13-happy-birthday-william-shakespeare/3312239.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 13: Happy Birthday, William Shakespeare! ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/listening/a1/shopping-clothes\" target=\"_blank\" rel=\"noopener\">Shopping for clothes ↗<\/a> <span class=\"muted\">(British Council · استماع · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d13-quiz","t":"اختبار اليوم","s":"80% تفتح اليوم اللي بعده","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>6 أسئلة كلمات (إنجليزي↔عربي)<\/li><li>أسئلة القاعدة<\/li><li>سؤال قراءة من نص اليوم<\/li><li>2 استماع (اختار المعنى)<\/li><li>1 استماع (اكتب اللي سمعته)<\/li><li>1 نطق بالمايك<\/li><li>سؤال مراجعة من يوم قديم<\/li><\/ul>","color":"indigo"}]
