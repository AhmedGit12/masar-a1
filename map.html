ع\">▶<\/button><span class=\"en\" dir=\"ltr\">carpet<\/span><span class=\"ar\">سجادة<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"shelf\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">shelf<\/span><span class=\"ar\">رف<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"towel\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">towel<\/span><span class=\"ar\">منشفة<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"oven\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">oven<\/span><span class=\"ar\">فرن<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"toilet\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">toilet<\/span><span class=\"ar\">حمّام (مرحاض)<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"neighbor\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">neighbor<\/span><span class=\"ar\">جار<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"upstairs\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">upstairs<\/span><span class=\"ar\">في الطابق العلوي<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"downstairs\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">downstairs<\/span><span class=\"ar\">في الطابق السفلي<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"rent\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">rent<\/span><span class=\"ar\">إيجار<\/span><\/div><\/div>","color":"indigo"},{"id":"d15-grammar","t":"القاعدة: There is / There are","s":"افهم الشرح، احفظ السطر الأصفر","d":"<span class=\"chip t-und\">افهم فقط<\/span><span class=\"chip t-memo\">احفظ<\/span><p>لقول «يوجد»: There is + مفرد، There are + جمع. النفي: There isn't / There aren't any. السؤال: Is there...? / Are there...?<\/p><div class=\"rule\" dir=\"ltr\">There is + مفرد · There are + جمع  ·  Is there...? / Are there...?<\/div>\n  <div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"There is a big kitchen.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">There is a big kitchen.<\/span><div class=\"ar\">يوجد مطبخ كبير.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"There are three bedrooms.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">There are three bedrooms.<\/span><div class=\"ar\">توجد ثلاث غرف نوم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is there a garden? No, there isn't.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Is there a garden? No, there isn't.<\/span><div class=\"ar\">هل توجد حديقة؟ لا.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"There aren't any chairs.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">There aren't any chairs.<\/span><div class=\"ar\">لا توجد كراسي.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>There is two bedrooms.<\/s> → <b>There are two bedrooms.<\/b><\/div><div class=\"ar\">الجمع مع are.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">There _____ two beds.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">There _____ a sofa in the room.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">is<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ there a lamp?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Is<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">There aren't _____ chairs.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">any<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d15-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"There is a big kitchen.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">There is a big kitchen.<\/span><div class=\"ar\">يوجد مطبخ كبير.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"There are three bedrooms.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">There are three bedrooms.<\/span><div class=\"ar\">توجد ثلاث غرف نوم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is there a garden? No, there isn't.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Is there a garden? No, there isn't.<\/span><div class=\"ar\">هل توجد حديقة؟ لا.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My apartment is small but nice.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My apartment is small but nice.<\/span><div class=\"ar\">شقتي صغيرة لكنها جميلة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I live on the second floor.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I live on the second floor.<\/span><div class=\"ar\">أسكن في الطابق الثاني.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"The bathroom is next to the bedroom.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">The bathroom is next to the bedroom.<\/span><div class=\"ar\">الحمام بجانب غرفة النوم.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d15-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Tell me about your new apartment.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Tell me about your new apartment.<\/span><div class=\"ar\">حدثني عن شقتك الجديدة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It's small but very nice. There are two bedrooms.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: It's small but very nice. There are two bedrooms.<\/span><div class=\"ar\">صغيرة لكنها جميلة جداً. فيها غرفتا نوم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is there a big kitchen?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Is there a big kitchen?<\/span><div class=\"ar\">هل فيها مطبخ كبير؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No, the kitchen is small. But there is a big living room.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: No, the kitchen is small. But there is a big living room.<\/span><div class=\"ar\">لا، المطبخ صغير. لكن فيها غرفة معيشة كبيرة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is there a garden?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Is there a garden?<\/span><div class=\"ar\">هل فيها حديقة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No, there isn't. I live on the fifth floor!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: No, there isn't. I live on the fifth floor!<\/span><div class=\"ar\">لا. أسكن في الطابق الخامس!<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d15-read","t":"قراءة: My new apartment","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">My new apartment is small but clean. There are three rooms: a living room, a bedroom and a kitchen. There is one bathroom. In the living room there is a big sofa and a lamp, but there isn't a TV. There are two windows in my bedroom. The rent is not expensive, and my neighbors are quiet and friendly.<\/div><button class=\"say\" data-say=\"My new apartment is small but clean. There are three rooms: a living room, a bedroom and a kitchen. There is one bathroom. In the living room there is a big sofa and a lamp, but there isn't a TV. There are two windows in my bedroom. The rent is not expensive, and my neighbors are quiet and friendly.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">شقتي الجديدة صغيرة لكنها نظيفة. فيها ثلاث غرف: غرفة معيشة وغرفة نوم ومطبخ. فيها حمّام واحد. في غرفة المعيشة كنبة كبيرة ومصباح، لكن لا يوجد تلفاز. في غرفة نومي نافذتان. الإيجار ليس غالياً، وجيراني هادئون وودودون.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">How many rooms are there?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">three<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Is there a TV in the living room?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, there isn't.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What are the neighbors like?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">quiet and friendly<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d15-pron","t":"النطق: صوت ER / IR","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>bird, girl, work: صوت واحد بدون «ي» ولا «ا» — افتح الفم قليلاً.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"bird\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">bird<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"girl\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">girl<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"work\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">work<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"first\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">first<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"world\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">world<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"turn\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">turn<\/span><\/div><\/div>","color":"indigo"},{"id":"d15-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> صف بيتك في 5 جمل باستخدام There is و There are.<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d15-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner to describe their home: rooms, furniture, big or small.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d15-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-15-i-love-people-watching/3343720.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 15: I Love People-Watching! ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/reading/a1/holiday-home-adverts\" target=\"_blank\" rel=\"noopener\">Holiday home adverts ↗<\/a> <span class=\"muted\">(British Council · قراءة · إضافي)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2/using-there-there-are\" target=\"_blank\" rel=\"noopener\">Using there is and there are ↗<\/a> <span class=\"muted\">(British Council · قواعد · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d15-quiz","t":"اختبار اليوم","s":"80 ass=\"say\" data-say=\"Turn right at the station.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Turn right at the station.<\/span><div class=\"ar\">انعطف يميناً عند المحطة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is there a pharmacy near here?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Is there a pharmacy near here?<\/span><div class=\"ar\">هل توجد صيدلية قريبة؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d16-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Excuse me, is there a pharmacy near here?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Excuse me, is there a pharmacy near here?<\/span><div class=\"ar\">لو سمحت، هل توجد صيدلية قريبة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes. Go straight and turn right at the bank.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes. Go straight and turn right at the bank.<\/span><div class=\"ar\">نعم. امشِ مباشرة وانعطف يميناً عند البنك.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Turn right at the bank. OK.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Turn right at the bank. OK.<\/span><div class=\"ar\">يميناً عند البنك. حسناً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"The pharmacy is between the supermarket and the mosque.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: The pharmacy is between the supermarket and the mosque.<\/span><div class=\"ar\">الصيدلية بين السوبرماركت والمسجد.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Is it far?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Is it far?<\/span><div class=\"ar\">هل هي بعيدة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"No, it's very near. Five minutes.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: No, it's very near. Five minutes.<\/span><div class=\"ar\">لا، قريبة جداً. خمس دقائق.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d16-read","t":"قراءة: The way to the museum","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Excuse me, where is the museum? — Go straight on this street. Turn left at the traffic lights. The museum is next to the library, opposite the big mosque. It is not far. It's about five minutes from here. — Thank you! — You're welcome.<\/div><button class=\"say\" data-say=\"Excuse me, where is the museum? — Go straight on this street. Turn left at the traffic lights. The museum is next to the library, opposite the big mosque. It is not far. It's about five minutes from here. — Thank you! — You're welcome.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">لو سمحت، أين المتحف؟ — امشِ مستقيماً في هذا الشارع. انعطف يساراً عند إشارة المرور. المتحف بجانب المكتبة، مقابل المسجد الكبير. ليس بعيداً. حوالي خمس دقائق من هنا. — شكراً! — عفواً.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where do you turn left?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at the traffic lights<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is next to the museum?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">the library<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Is the museum far?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">No, it isn't.<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d16-pron","t":"النطق: صوت O في left و hot","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>قارن \" dir=\"ltr\">She can speak three languages.<\/span><div class=\"ar\">تستطيع التحدث بثلاث لغات.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>He can to drive.<\/s> → <b>He can drive.<\/b><\/div><div class=\"ar\">لا to ولا s بعد can.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">She _____ speak three languages.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">can<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ you help me?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Can<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">He can _____.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">drive<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d17-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Can you help me?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Can you help me?<\/span><div class=\"ar\">هل يمكنك مساعدتي؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I can swim, but I can't dance.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I can swim, but I can't dance.<\/span><div class=\"ar\">أستطيع السباحة لكن لا أستطيع الرقص.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Can you speak slowly, please?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Can you speak slowly, please?<\/span><div class=\"ar\">هل يمكنك التحدث ببطء؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Can I open the window?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Can I open the window?<\/span><div class=\"ar\">هل أستطيع فتح النافذة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Sorry, I can't.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Sorry, I can't.<\/span><div class=\"ar\">آسف، لا أستطيع.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Can you say that again?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Can you say that again?<\/span><div class=\"ar\">هل يمكنك قولها مرة أخرى؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d17-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Can you help me? I can't open this door.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Can you help me? I can't open this door.<\/span><div class=\"ar\">هل تساعدني؟ لا أستطيع فتح هذا الباب.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Sure. Oh, it's closed. Can I see the key?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Sure. Oh, it's closed. Can I see the key?<\/span><div class=\"ar\">طبعاً. آه، إنه مقفل. أرني المفتاح.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Here you are.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Here you are.<\/span><div class=\"ar\">تفضل.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"OK, it's open now!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: OK, it's open now!<\/span><div class=\"ar\">حسناً، انفتح الآن!<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Thank you! Can you speak English well?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Thank you! Can you speak English well?<\/span><div class=\"ar\">شكراً! هل تتكلم الإنجليزية جيداً؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"A little. I can understand, but I can't speak fast.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: A little. I can understand, but I can't speak fast.<\/span><div class=\"ar\">قليلاً. أفهم لكن لا أتكلم بسرعة.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d17-read","t":"قراءة: What can you do?","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">My name is Faisal. I am ten years old. I can swim and I can ride a bike, but I can't drive a car. My sister Laila can draw very well. She can't sing, but she can dance! My grandfather can't read small letters, so I help him. I read the news to him. Can you play the piano? I can't, but I want to learn.<\/div><button class=\"say\" data-say=\"My name is Faisal. I am ten years old. I can swim and I can ride a bike, but I can't drive a car. My sister Laila can draw very well. She can't sing, but she can dance! My grandfather can't read small letters, so I help him. I read the news to him. Can you play the piano? I can't, but I want to learn.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">اسمي فيصل. عمري عشر سنوات. أستطيع السباحة وركوب الدراجة، لكن لا أستطيع قيادة السيارة. أختي ليلى تستطيع الرسم جيداً جداً. لا تستطيع الغناء، لكنها تستطيع الرقص! جدي لا يستطيع قراءة الحروف الصغيرة، لذلك أساعده وأقرأ له الأخبار. هل تستطيع العزف على البيانو؟ أنا لا أستطيع، لكني أريد أن أتعلم.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What can't Faisal do?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">drive a car<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What can Laila do very well?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">draw<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How does Faisal help his grandfather?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">He reads the news to him.<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d17-pron","t":"النطق: can و can't","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>can في الجملة تُنطق خفيفة «كِن»، و can't قوية «كانت». الفرق في القوة وليس فقط في الـt.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"I can swim\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">I can swim<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"I can't swim\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">I can't swim<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Can you help me?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Can you help me?<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"She can drive\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">She can drive<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"He can't come\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">He can't come<\/span><\/div><\/div>","color":"indigo"},{"id":"d17-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب 3 أشياء تستطيع فعلها و3 لا تستطيع، وطلبين مهذبين بـ Can you...?<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d17-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner what they can and can't do (sports, languages, cooking).<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d17-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">ا  dir=\"ltr\">They aren't sleeping.<\/span><div class=\"ar\">إنهم لا ينامون.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I cooking now.<\/s> → <b>I am cooking now.<\/b><\/div><div class=\"ar\">لا تحذف am/is/are.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ reading now.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">am<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They _____ watching TV.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">She is _____ at the moment.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">sleeping<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What _____ you doing?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">are<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d18-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"What are you doing?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What are you doing?<\/span><div class=\"ar\">ماذا تفعل (الآن)؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm waiting for the bus.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I'm waiting for the bus.<\/span><div class=\"ar\">أنتظر الحافلة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"She is talking on the phone.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She is talking on the phone.<\/span><div class=\"ar\">إنها تتكلم في الهاتف.<\/div><\/div> -label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: My brother is visiting. Come for dinner!<\/span><div class=\"ar\">أخي يزورنا. تعال للعشاء!<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Great! Oh, the bus is coming. Bye!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Great! Oh, the bus is coming. Bye!<\/span><div class=\"ar\">رائع! آه، الحافلة قادمة. باي!<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d18-read","t":"قراءة: A message from the airport","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Hi Khaled! I'm at the airport right now. I'm going to Cairo today. It's raining outside, and a lot of people are sitting and waiting. A small boy is crying, and his mother is holding him. His father is talking on the phone. I'm drinking coffee and reading a book. See you tomorrow! Omar<\/div><button class=\"say\" data-say=\"Hi Khaled! I'm at the airport right now. I'm going to Cairo today. It's raining outside, and a lot of people are sitting and waiting. A small boy is crying, and his mother is holding him. His father is talking on the phone. I'm drinking coffee and reading a book. See you tomorrow! Omar\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">مرحباً خالد! أنا في المطار الآن. أنا مسافر إلى القاهرة اليوم. إنها تمطر بالخارج، وكثير من الناس جالسون ينتظرون. ولد صغير يبكي، وأمه تحمله. أبوه يتكلم في الهاتف. أنا أشرب قهوة وأقرأ كتاباً. أراك غداً! عمر<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where is Omar now?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">at the airport<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is the weather like?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It's raining.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is Oma " dir=\"ltr\">A: It often rains. Look, it's raining now!<\/span><div class=\"ar\">كثيراً ما تمطر. انظر، إنها تمطر الآن!<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I love rain!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I love rain!<\/span><div class=\"ar\">أحب المطر!<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d19-read","t":"قراءة: Weather in two cities","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">In Riyadh, the summer is very hot and dry. It usually doesn't rain in June or July. Today it is 45 degrees! In London, the weather is different. It often rains in summer. Right now my friend Tom is in London. He is wearing a jacket because it is cool and cloudy. He is sending me photos of the rain!<\/div><button class=\"say\" data-say=\"In Riyadh, the summer is very hot and dry. It usually doesn't rain in June or July. Today it is 45 degrees! In London, the weather is different. It often rains in summer. Right now my friend Tom is in London. He is wearing a jacket because it is cool and cloudy. He is sending me photos of the rain!\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">في الرياض، الصيف حار جداً وجاف. عادةً لا تمطر في يونيو أو يوليو. اليوم درجة الحرارة 45! في لندن الطقس مختلف. غالباً تمطر في الصيف. الآن صديقي توم في لندن. يرتدي جاكيت لأن الجو بارد قليلاً وغائم. يرسل لي صوراً للمطر!<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is summer like in Riyadh?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">hot and dry<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What is the temperature in Riyadh today?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">45 degrees<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why is Tom wearing a jacket?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">It is cool and cloudy.<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d19-pron","t":"النطق: الحروف الصامتة","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>كثير من الحروف لا تُنطق: autumn (n صامتة)، know (k صامتة)، write (w صامتة)، hour (h صامتة).<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"autumn\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">autumn<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"know\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">know<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"write\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">write<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"hour\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">hour<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"listen\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">listen<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"half\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">half<\/span><\/div><\/div>","color":"indigo"},{"id":"d19-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> صف الطقس في مدينتك في الصيف والشتاء، وكيف هو اليوم الآن (5 جمل).<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d19-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Talk about weather and seasons in the learner's city, and today's weather.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d19-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"ch \">ممرض/ة<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"engineer\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">engineer<\/span><span class=\"ar\">مهندس<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"driver\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">driver<\/span><span class=\"ar\">سائق<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"manager\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">manager<\/span><span class=\"ar\">مدير<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"police officer\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">police officer<\/span><span class=\"ar\">شرطي<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"lawyer\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">lawyer<\/span><span class=\"ar\">محامٍ<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"accountant\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">accountant<\/span><span class=\"ar\">محاسب<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"pilot\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">pilot<\/span><span class=\"ar\">طيار<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"farmer\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">farmer<\/span><span class=\"ar\">مزارع<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"employee\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">employee<\/span><span class=\"ar\">موظف<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"company\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">company<\/span><span class=\"ar\">شركة<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"boss\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">boss<\/span><span class=\"ar\">رئيس العمل<\/span><\/div><div class=\"w\"><butt v class=\"ar\">كنت في البيت.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It was a great party.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It was a great party.<\/span><div class=\"ar\">كانت حفلة رائعة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We weren't busy last week.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">We weren't busy last week.<\/span><div class=\"ar\">لم نكن مشغولين الأسبوع الماضي.<\/div><\/div><\/div><\/div>\n  <div class=\"mis\"><div class=\"lbl\">الخطأ الشائع عند العرب<\/div><div dir=\"ltr\"><s>I were tired.<\/s> → <b>I was tired.<\/b><\/div><div class=\"ar\">مع I نستخدم was.<\/div><\/div>\n  <h4>اختبر نفسك<\/h4><ul><li><span class=\"en\" dir=\"ltr\">I _____ tired yesterday.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">was<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">They _____ at school.<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">were<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">_____ you at work yesterday?<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">Were<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">She _____ at the party. (نفي)<\/span> <span class=\"muted\">←<\/span> <details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">wasn't<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d22-phrases","t":"الجمل الجاهزة (6)","s":"احفظها وكررها","d":"<span class=\"chip t-memo\">احفظ<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Where were you yesterday?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Where were you yesterday?<\/span><div class=\"ar\">أين كنت أمس؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I was at home.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I was at home.<\/span><div class=\"ar\">كنت في البيت.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"It was a great party.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">It was a great party.<\/span><div class=\"ar\">كانت حفلة رائعة.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I was born in 1995.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I was born in 1995.<\/span><div class=\"ar\">وُلدت عام 1995.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We weren't busy last week.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">We weren't busy last week.<\/span><div class=\"ar\">لم نكن مشغولين الأسبوع الماضي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Was it interesting?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Was it interesting?<\/span><div class=\"ar\">هل كان ممتعاً؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d22-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Where were you last night?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Where were you last night?<\/span><div class=\"ar\">أين كنت الليلة الماضية؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I was at my cousin's wedding.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I was at my cousin's wedding.<\/span><div class=\"ar\">كنت في عرس ابن عمي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Was it fun?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Was it fun?<\/span><div class=\"ar\">هل كان ممتعاً؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, it was great! There were many people.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, it was great! There were many people.<\/span><div class=\"ar\">نعم، كان رائعاً! كان هناك كثير من الناس.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I was at home. I was sick.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: I was at home. I was sick.<\/span><div class=\"ar\">كنت في البيت. كنت مريضاً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Oh, sorry. Are you OK now?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Oh, sorry. Are you OK now?<\/span><div class=\"ar\">آه، سلامتك. هل أنت بخير الآن؟<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d22-read","t":"قراءة: A wedding last Friday","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Last Friday was my cousin's wedding. It was in a big hotel. The party was great, and the food was delicious. My parents were very happy. My little brother was tired at night. The next day I was sick, so I was at home. I wasn't at work on Saturday.<\/div><button class=\"say\" data-say=\"Last Friday was my cousin's wedding. It was in a big hotel. The party was great, and the food was delicious. My parents were very happy. My little brother was tired at night. The next day I was sick, so I was at home. I wasn't at work on Saturday.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">الجمعة الماضية كان حفل زفاف ابن عمي. كان في فندق كبير. الحفلة كانت رائعة، والطعام كان لذيذاً. والداي كانا سعيدين جداً. أخي الصغير كان متعباً في الليل. في اليوم التالي كنت مريضاً، لذلك كنت في البيت. لم أكن في العمل يوم السبت.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">Where was the wedding?<\/span><details><summary>الإ lass=\"ar\">ذهبت إلى جدة الأسبوع الماضي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We ate pizza.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">We ate pizza.<\/span><div class=\"ar\">أكلنا بيتزا.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I saw my friend at the mall.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I saw my friend at the mall.<\/span><div class=\"ar\">رأيت صديقي في المول.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"She bought a new phone.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">She bought a new phone.<\/span><div class=\"ar\">اشترت هاتفاً جديداً.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"What did you do at the weekend?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What did you do at the weekend?<\/span><div class=\"ar\">ماذا فعلت في عطلة نهاية الأسبوع؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I had a good time.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I had a good time.<\/span><div class=\"ar\">قضيت وقتاً ممتعاً.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d24-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"What did you do at the weekend?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: What did you do at the weekend?<\/span><div class=\"ar\">ماذا فعلت في العطلة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I went to the mall with my brother.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I went to the mall with my brother.<\/span><div class=\"ar\">ذهبت إلى المول مع أخي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Did you buy anything?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Did you buy anything?<\/span><div class=\"ar\">هل اشتريت شيئاً؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, I bought new shoes. Then we ate at a restaurant.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, I bought new shoes. Then we ate at a restaurant.<\/span><div class=\"ar\">نعم، اشتريت حذاءً جديداً. ثم أكلنا في مطعم.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Did you see Ali?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Did you see Ali?<\/span><div class=\"ar\">هل رأيت علي؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes! We met him there. We had a great time.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes! We met him there. We had a great time.<\/span><div class=\"ar\">نعم! قابلناه هناك. قضينا وقتاً رائعاً.<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d24-read","t":"قراءة: A trip to Dubai","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Last month I went to Dubai with my wife. We flew from Cairo, and the trip took three hours. We stayed in a small hotel near the beach. We ate fish every day and drank a lot of juice. We saw many very tall buildings. I bought a watch for my father. On the last day I lost my wallet, but a man found it and gave it back to me!<\/div><button class=\"say\" data-say=\"Last month I went to Dubai with my wife. We flew from Cairo, and the trip took three hours. We stayed in a small hotel near the beach. We ate fish every day and drank a lot of juice. We saw many very tall buildings. I bought a watch for my father. On the last day I lost my wallet, but a man found it and gave it back to me!\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">الشهر الماضي ذهبت إلى دبي مع زوجتي. سافرنا بالطائرة من القاهرة، واستغرقت الرحلة ثلاث ساعات. أقمنا في فندق صغير قرب الشاطئ. أكلنا السمك كل يوم وشربنا الكثير من العصير. رأينا مباني عالية جداً. اشتريت ساعة لأبي. في اليوم الأخير فقدت محفظتي، لكن رجلاً وجدها وأعادها إليّ!<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">How did they travel to Dubai?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">by plane<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What did the writer buy for his father?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a watch<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What happened to the wallet?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">A man found it and gave it back.<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d24-pron","t":"النطق: الأفعال الشاذة","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>bought و thought و caught كلها تنتهي بصوت «ووت». saw «سوو». read في الماضي تُنطق «رِد».<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"bought\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">bought<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"thought\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">thought<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"saw\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">saw<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"read\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">read<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"ate\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">ate<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"said\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">said<\/span><\/div><\/div>","color":"indigo"},{"id":"d24-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب قصة قصيرة (6 جمل) عن يوم ممتع مضى، استخدم 5 أفعال شاذة على الأقل.<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d24-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner about a recent trip or fun day. Encourage irregular past verbs.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d24-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-24-yesterday-was-amazing/3439164.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 24: Yesterday Was Amazing! ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/writing/a1/online-course-introductions\" target=\"_blank\" rel=\"noopener\">Online course introductions ↗<\/a> <span class=\"muted\">(British Council · كتابة · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d24-quiz","t":"اختبار اليوم","s":"80% تفتح اليوم اللي بعده","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>6 أسئلة كلمات (إنجليزي↔عربي)<\/li><li>أسئلة القاعدة<\/li><li>سؤال قراءة من نص اليوم<\/li><li>2 استماع (اختار المعنى)<\/li><li>1 استماع (اكتب اللي سمعته)<\/li><li>1 نطق بالمايك<\/li><li>سؤال مراجعة من يوم قديم<\/li><\/ul>","color":"indigo"}],"color":"indigo"},{"id":"d25","t":"اليوم 25: المستقبل والخطط","s":"Plans · going to للخطط","d":"<p><b>المستقبل والخطط<\/b> — <span class=\"en\" dir=\"ltr\">Plans<\/span><\/p><p><b>قاعدة اليوم:<\/b> going to للخطط<\/ =\"ar\">ماذا ستفعل في الإجازة؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I'm going to travel to Turkey with my family.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I'm going to travel to Turkey with my family.<\/span><div class=\"ar\">سأسافر إلى تركيا مع عائلتي.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Great! Did you book the tickets?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Great! Did you book the tickets?<\/span><div class=\"ar\">رائع! هل حجزت التذاكر؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Yes, and we're going to stay in a hotel near the sea.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: Yes, and we're going to stay in a hotel near the sea.<\/span><div class=\"ar\">نعم، وسنقيم في فندق قرب البحر.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"What are you going to do there?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: What are you going to do there?<\/span><div class=\"ar\">ماذا ستفعلون هناك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"We're going to swim, eat and relax!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: We're going to swim, eat and relax!<\/span><div class=\"ar\">سنسبح ونأكل ونرتاح!<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d25-read","t":"قراءة: Adel's plans","s":"نص قصير + 3 أسئلة","d":"<span class=\"chip t-read\">اقرأ<\/span><div class=\"passage\" dir=\"ltr\">Next year is going to be a big year for Adel. He is going to finish university in June. Then he is going to look for a job in a bank. He is also going to save money because he wants to get married. In the summer he is going to travel abroad with his brother. He hopes to visit Turkey.<\/div><button class=\"say\" data-say=\"Next year is going to be a big year for Adel. He is going to finish university in June. Then he is going to look for a job in a bank. He is also going to save money because he wants to get married. In the summer he is going to travel abroad with his brother. He hopes to visit Turkey.\" aria-label=\"استمع\">▶ استمع للنص<\/button>\n  <details><summary>الترجمة (افتحها بعد ما تقرأ)<\/summary><p class=\"ar\">العام القادم سيكون عاماً مهماً لعادل. سينهي الجامعة في يونيو. ثم سيبحث عن عمل في بنك. وسيدّخر المال أيضاً لأنه يريد أن يتزوج. في الصيف سيسافر إلى الخارج مع أخيه. يتمنى أن يزور تركيا.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">When is Adel going to finish university?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in June<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Where does he want to work?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">in a bank<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">Why is he going to save money?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">to get married<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d25-pron","t":"النطق: gonna","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>في الكلام السريع going to تُسمع «قونا». افهمها عند السماع، واكتبها دائماً going to.<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"I'm going to\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">I'm going to<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"We're going to\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">We're going to<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"Are you going to\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">Are you going to<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"What are you going to do?\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">What are you going to do?<\/span><\/div><\/div>","color":"indigo"},{"id":"d25-write","t":"الكتابة","s":"اكتب بنفسك بلا مترجم","d":"<span class=\"chip t-write\">اكتب<\/span><p><b>المهمة:<\/b> اكتب 5 خطط لك في الشهر القادم باستخدام going to، وجملة نفي.<\/p><p>اكتب من غير مترجم. الأخطاء مطلوبة، هي اللي بتعلّمك. لو معاك Gemini في الموقع، اضغط «صحّح لي».<\/p>","color":"indigo"},{"id":"d25-speak","t":"التحدث","s":"محادثة عن موضوع اليوم","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p><b>موضوع المحادثة:<\/b> <span class=\"en\" dir=\"ltr\">Ask the learner about their plans for tonight, the weekend and next month.<\/span><\/p><p>قول جمل اليوم الجاهزة بصوتك، وجاوب على أسئلة بسيطة عن الموضوع. الهدف 4 ردود على الأقل.<\/p>","color":"indigo"},{"id":"d25-media","t":"الفيديو والمصادر","s":"VOA + British Council","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-bg\">في الخلفية<\/span><ul><li><a href=\"https://learningenglish.voanews.com/a/lets-learn-english-lesson-25-watch-out/3431138.html\" target=\"_blank\" rel=\"noopener\">Let's Learn English — Lesson 25: Watch Out! ↗<\/a> <span class=\"muted\">(أمريكي · شاهده بتركيز، بعدين اسمعه كصوت)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/listening/a1/booking-table\" target=\"_blank\" rel=\"noopener\">Booking a table ↗<\/a> <span class=\"muted\">(British Council · استماع · إضافي)<\/span><\/li><li><a href=\"https://learnenglish.britishcouncil.org/free-resources/speaking/a1/making-suggestions\" target=\"_blank\" rel=\"noopener\">Making suggestions ↗<\/a> <span class=\"muted\">(British Council · محادثة · إضافي)<\/span><\/li><\/ul>","color":"indigo"},{"id":"d25-quiz","t":"اختبار اليوم","s":"80% تفتح اليوم اللي بعده","d":"<span class=\"chip t-test\">اختبر<\/span><ul><li>6 أسئلة كلمات (إنجليزي↔عربي)<\/li><li>أسئلة القاعدة<\/li><li>سؤال قراءة من نص اليوم<\/li><li>2 استماع (اختار المعنى)<\/li><li>1 استماع (اكتب اللي سمعته)<\/li><li>1 نطق بالمايك<\/li><li>سؤال مراجعة من يوم قديم<\/li><\/ul>","color":"indigo"}],"color":"indigo"},{"id": y=\"What's the matter?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">What's the matter?<\/span><div class=\"ar\">ما بك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I have a headache.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I have a headache.<\/span><div class=\"ar\">عندي صداع.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"My back hurts.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">My back hurts.<\/span><div class=\"ar\">ظهري يؤلمني.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I feel sick.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">I feel sick.<\/span><div class=\"ar\">أشعر بالمرض.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Take this medicine.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Take this medicine.<\/span><div class=\"ar\">خذ هذا الدواء.<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"Get well soon!\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">Get well soon!<\/span><div class=\"ar\">أتمنى لك الشفاء العاجل!<\/div><\/div><\/div><\/div>","color":"indigo"},{"id":"d26-dlg","t":"الحوار","s":"اسمع، اقرأ، كرر دور B","d":"<span class=\"chip t-focus\">استمع بتركيز<\/span><span class=\"chip t-rep\">كرّر بصوتك<\/span><div class=\"lines\"><div class=\"ln\"><button class=\"say\" data-say=\"Good morning. What's the matter?\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">A: Good morning. What's the matter?<\/span><div class=\"ar\">صباح الخير. ما بك؟<\/div><\/div><\/div><div class=\"ln\"><button class=\"say\" data-say=\"I feel sick. I have a fever and a headache.\" aria-label=\"استمع\">▶<\/button><div><span class=\"en\" dir=\"ltr\">B: I feel sick. I have a fever and a headache.<\/span><div class=\"ar\">أشعر بالمرض. عندي حمّى وصداع.<\/div><\/div><\/div><div class=\"ln\"><bu مشكلة؟ — ناصر: لا أشعر أنني بخير. عندي صداع وسعال شديد، وظهري يؤلمني. — الطبيب: هل عندك حمّى؟ — ناصر: نعم، قليلاً. — الطبيب: عندك زكام. خذ هذا الدواء ثلاث مرات في اليوم واسترح في البيت يومين. اشرب الكثير من الماء. — ناصر: شكراً يا دكتور.<\/p><\/details>\n  <h4>الأسئلة<\/h4><ul><li><span class=\"en\" dir=\"ltr\">What is wrong with Nasser?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">He has a headache and a cough.<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">What does the doctor say he has?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">a cold<\/span><\/details><\/li><li><span class=\"en\" dir=\"ltr\">How often must he take the medicine?<\/span><details><summary>الإجابة<\/summary><span class=\"en\" dir=\"ltr\">three times a day<\/span><\/details><\/li><\/ul>","color":"indigo"},{"id":"d26-pron","t":"النطق: الجمع الشاذ","s":"صوت صعب على العرب","d":"<span class=\"chip t-rep\">كرّر بصوتك<\/span><p>foot → feet، tooth → teeth، child → children، man → men، woman → women (ويمِن).<\/p><div class=\"words\"><div class=\"w\"><button class=\"say\" data-say=\"feet\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">feet<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"teeth\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">teeth<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"children\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">children<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"women\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">women<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"men\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">men<\/span><\/div><div class=\"w\"><button class=\"say\" data-say=\"stomach\" aria-label=\"استمع\">▶<\/button><span class=\"en\" dir=\"ltr\">stomach<\/span><\/div><\/div>","color":"indigo"},{"id":"d26-write","t":"الكتابة","s":"اكتب ب
